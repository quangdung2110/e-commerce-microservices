name: Contract checks

on:
  workflow_call:
    inputs:
      base:
        type: string
        required: true

permissions:
  contents: read

jobs:
  validation:
    name: Validate contracts (strict tools)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: contracts/tools/package-lock.json
      - name: Install redocly and asyncapi
        working-directory: contracts/tools
        run: |
          npm ci
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Install buf
        uses: bufbuild/buf-setup-action@3e33fea8596569a62fcaa33eb3880b6ac7098941 # v1.9.0
        with:
          version: '1.47.2'
          github_token: ${{ secrets.GITHUB_TOKEN }}
      # -StrictTools turns a missing buf, redocly or asyncapi into an error instead of a warning, so the
      # semantic linters can no longer be skipped silently (contracts ADR-008).
      - name: Validate structure, examples and run every linter
        id: lint
        shell: pwsh
        run: ./contracts/tools/validate-contracts.ps1 -StrictTools
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install Python tooling
        run: python -m pip install pyyaml==6.0.2 "jsonschema>=4.18"
      - name: Check HTTP contract rules and test the contract tools
        id: http
        run: |
          python -m unittest discover -s contracts/tools/tests -v
          python contracts/tools/check_http_contracts.py
      - name: Summarize the failed contract checks
        if: failure()
        env:
          CI_STEPS: ${{ toJSON(steps) }}
        run: python scripts/ci/feedback.py contracts --component contracts

  breaking-changes:
    name: No breaking contract changes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BASE_REF: ${{ inputs.base }}
    steps:
      - name: Checkout repository with history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a valid compatibility baseline
        run: git rev-parse --verify "$BASE_REF^{commit}"
      # buf breaking for protobuf and oasdiff for OpenAPI, from pinned images (contracts ADR-008).
      - name: Compare contracts with the base
        id: breaking
        run: bash contracts/tools/check-breaking.sh "$BASE_REF"
      - name: Prove the gate still catches breaking changes
        id: self_test
        run: bash contracts/tools/tests/test_check_breaking.sh "$BASE_REF"
      - name: Summarize the failed compatibility checks
        if: failure()
        env:
          CI_STEPS: ${{ toJSON(steps) }}
        run: python scripts/ci/feedback.py contracts --component compatibility
