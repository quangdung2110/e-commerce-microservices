name: CD Production PR

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Prepare a reviewed production PR
        required: true
        type: choice
        options: [promote, rollback]
      proof_run_id:
        description: Staging workflow run for promotion; GitOps production-health run for rollback
        required: true
        type: string

permissions:
  contents: read
  actions: read
  packages: read
  attestations: read

concurrency:
  group: cd-production-pr
  cancel-in-progress: false

jobs:
  configuration-required:
    if: vars.CD_ENABLED != 'true' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: |
          echo '::error::Production delivery requires main and CD_ENABLED=true after bootstrap/readiness validation.'
          exit 1

  prepare:
    if: vars.CD_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: delivery
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r deploy/checks/requirements.txt
      - id: config
        run: python scripts/cd/delivery.py preflight --config deploy/gitops/environments.json
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: app
        with:
          app-id: ${{ secrets.GITOPS_APP_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          owner: ${{ steps.config.outputs.owner }}
          repositories: ${{ steps.config.outputs.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-actions: read
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ steps.config.outputs.repository }}
          token: ${{ steps.app.outputs.token }}
          ref: main
          path: gitops-checkout
          fetch-depth: 0
          persist-credentials: false
      - name: Verify trusted proof and open production PR
        env:
          GH_TOKEN: ${{ github.token }}
          GITOPS_TOKEN: ${{ steps.app.outputs.token }}
          OPERATION: ${{ inputs.operation }}
          PROOF_RUN_ID: ${{ inputs.proof_run_id }}
        run: >-
          python scripts/cd/delivery.py "$OPERATION" --config deploy/gitops/environments.json
          --gitops gitops-checkout --run-id "$PROOF_RUN_ID"
