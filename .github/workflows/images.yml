name: Build and scan images

on:
  workflow_call:
    inputs:
      matrix:
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    name: image-${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(inputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - run: mkdir -p ci-artifacts
      - name: Build the release image once
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          pull: true
          tags: ci/${{ matrix.name }}:${{ github.sha }}
          outputs: type=docker,dest=${{ github.workspace }}/ci-artifacts/image.tar
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Exercise SQL migrations and repeat execution against disposable PostgreSQL
        id: migration
        if: matrix.name == 'database-migrations'
        env:
          TEST_IMAGE: ci/${{ matrix.name }}:${{ github.sha }}
        run: |
          docker load --input ci-artifacts/image.tar
          python scripts/cd/test_migrations.py --image "$TEST_IMAGE" --output ci-artifacts/migration-tests.json
      - name: Generate SBOM for the final image
        id: sbom
        run: bash scripts/ci/scan.sh sbom
      - name: Block vulnerable images or embedded secrets
        id: scan
        run: bash scripts/ci/scan.sh image
      - name: Package the exact scanned image
        id: package
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          gzip -1 ci-artifacts/image.tar
          cd ci-artifacts
          sha256sum image.tar.gz sbom.cdx.json image-scan.json > checksums.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        with:
          name: image-${{ matrix.name }}
          path: |
            ci-artifacts/image.tar.gz
            ci-artifacts/sbom.cdx.json
            ci-artifacts/migration-tests.json
            ci-artifacts/image-scan.json
            ci-artifacts/checksums.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
          overwrite: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: image-report-${{ matrix.name }}
          overwrite: true
          path: |
            ci-artifacts/image-scan.json
            ci-artifacts/sbom.cdx.json
            ci-artifacts/migration-tests.json
          retention-days: 14
      - name: Summarize the failed image checks
        if: failure()
        env:
          CI_STEPS: ${{ toJSON(steps) }}
          COMPONENT: ${{ matrix.name }}
          BUILD_CONTEXT: ${{ matrix.context }}
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: python scripts/ci/feedback.py image --component "$COMPONENT" --directory "$BUILD_CONTEXT" --dockerfile "$DOCKERFILE" --artifact "image-report-$COMPONENT"
