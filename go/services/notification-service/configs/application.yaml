# Notification Service configuration — local development defaults.
#
# Every key can be overridden with the NOTIFICATION_ prefix
# (NOTIFICATION_DATABASE_HOST overrides database.host). ${VAR} is expanded from
# the environment at load time; secrets (DB_PASSWORD, REDIS_PASSWORD, AWS
# credentials) never live in this file. Design: docs/notification/13-development.md §3.

app:
  name: "notification-service"
  env: "development"        # development | staging | production
  role: "all"               # all | api | consumer | deliver | track | jobs
  lane: ""                  # critical | transactional | bulk ; empty = every lane

server:                     # public listener: inbox API behind the gateway
  host: "0.0.0.0"
  port: 8080
  read_timeout: 15s
  write_timeout: 15s
  idle_timeout: 120s
  shutdown_timeout: 20s
  trusted_proxies: []

internal:                   # cluster-internal listener: status, ops, /metrics, health
  host: "0.0.0.0"
  port: 8081
  # Authentication is the mesh's job (mTLS + AuthorizationPolicy per principal);
  # these lists are the X-Service-Identity allowlists kept as defence in depth.
  status_principals: [order-service, finance-ops]
  ops_principals: [notification-ops]

database:
  host: "localhost"
  port: 5432
  name: "notification_db"
  username: "postgres"
  password: "${DB_PASSWORD}"
  sslmode: "disable"
  conn_max_lifetime: 30m
  connect_timeout: 5s
  pools:                    # bulkhead per role (06-backpressure.md §3)
    consumer: 10
    deliver_critical: 5
    deliver_transactional: 10
    deliver_bulk: 15
    track: 5
    api: 10
    jobs: 3

redis:
  host: "localhost"
  port: 6379
  password: "${REDIS_PASSWORD}"
  db: 0
  pool_size: 20
  min_idle_conns: 2
  dial_timeout: 1s
  read_timeout: 1s
  write_timeout: 1s
  key_prefix: "notification"

kafka:
  brokers: ["localhost:9092"]
  client_id: "notification-service"
  version: "3.5.0"
  session_timeout: 30s
  heartbeat_interval: 3s
  max_processing_time: 60s
  consume_max_attempts: 5
  consume_min_backoff: 200ms
  consume_max_backoff: 5s
  sources:
    critical:       { enabled: true, topic: t.notification.critical.v1,      group: notification-critical,               dlq: t.notification.critical.v1.dlq }
    transactional:  { enabled: true, topic: t.notification.transactional.v1, group: notification-transactional,          dlq: t.notification.transactional.v1.dlq }
    bulk:           { enabled: true, topic: t.notification.bulk.v1,          group: notification-bulk,                   dlq: t.notification.bulk.v1.dlq }
    auth:           { enabled: true, topic: t.auth.notification.events,      group: notification-auth-critical,          dlq: t.auth.notification.events.dlq }
    review:         { enabled: true, topic: t.review.events,                 group: notification-review-transactional,   dlq: t.review.events.dlq }
    cart:           { enabled: true, topic: t.cart.events,                   group: notification-cart-bulk,              dlq: t.cart.events.dlq }
    preferences:    { enabled: true, topic: t.user.events,                   group: notification-preferences,            dlq: t.user.events.dlq }
    user_lifecycle: { enabled: true, topic: t.auth.events,                   group: notification-user-lifecycle,         dlq: t.auth.events.dlq }
  outcomes:
    topic: t.notification.outcomes.v1

email:
  provider: "smtp"          # smtp (Mailpit, dev/CI) | ses (production)
  from_address: "no-reply@ecommerce.local"
  from_name: "E-Commerce"
  unsubscribe_url: "http://localhost:3000/profile/preferences"
  connect_timeout: 2s
  send_timeout: 10s
  smtp:
    host: "localhost"
    port: 1025
    username: ""
    password: ""
    max_conns_per_lane: 5
  ses:
    region: "ap-southeast-1"
    endpoint: ""
    configuration_set_critical_transactional: "notification-critical-transactional"
    configuration_set_bulk: "notification-bulk"
    max_conns_per_lane: 10
    max_24_hour_send: 50000
    bulk_stop_daily_ratio: 0.8

track:                      # SES → SNS → SQS poller (03-tracking.md)
  enabled: true
  queue_url: "http://localhost:4566/000000000000/notification-ses-events"
  aws_endpoint: "http://localhost:4566"
  aws_region: "ap-southeast-1"
  wait_time: 20s
  batch_size: 10
  verify_signature: true
  allowed_cert_hosts: ["sns.ap-southeast-1.amazonaws.com", "localhost:4566", "localstack:4566"]
  max_clock_skew: 10m
  worker_batch: 50
  worker_poll: 1s
  unmatched_retry: 30s
  unmatched_alert_after: 3
  unmatched_give_up: 24h
  soft_bounce_suppression: 48h
  correlate_provider: ses        # ses (production) | mailpit (dev: SES sample events for mail Mailpit delivered)

auth:                       # Auth internal API (listener 8081 of auth-service)
  base_url: "http://localhost:8081"
  timeout: 2s
  service_identity: "notification-service"
  rate_per_second: { critical: 0, transactional: 30, bulk: 20 }
  max_conns:       { critical: 10, transactional: 10, bulk: 5 }
  breaker: { window_size: 20, failure_ratio: 0.5, open_duration: 30s, half_open_successes: 3 }

lanes:                      # dev sizes; quotas follow 06-backpressure.md §4.1 (SES 50/s)
  critical:      { email_workers: 2, in_app_workers: 1, batch_size: 5,  email_quota_per_second: 10, breaker_open_retry: 30s, max_attempts: 5 }
  transactional: { email_workers: 2, in_app_workers: 1, batch_size: 10, email_quota_per_second: 20, breaker_open_retry: 5m,  max_attempts: 8 }
  bulk:          { email_workers: 3, in_app_workers: 1, batch_size: 20, email_quota_per_second: 15, breaker_open_retry: 30m, max_attempts: 8 }

deliver:
  lease: 60s
  heartbeat_interval: 20s
  idle_min_sleep: 50ms
  idle_max_sleep: 1s
  reaper_interval: 30s
  retry_base: 30s
  retry_max: 1h
  retry_jitter: 30s
  rate_limit_wait: 5s
  retry_budget_ratio: 0.2
  retry_budget_defer: 15m
  limiter_fallback_replicas: 4
  control_poll_interval: 5s
  breaker: { window_size: 20, failure_ratio: 0.5, open_duration: 30s, half_open_successes: 3 }
  use_listen_notify: true
  # Provider watchdog (06-backpressure.md §5, decisions.md D-23): pause bulk email
  # when the breaker stays unhealthy this long (0 disables; resume is manual) and
  # probe a half-open breaker with the provider health check when no real row did.
  breaker_auto_pause_after: 1h
  health_probe_interval: 10s    # 0 disables the watchdog
  health_probe_idle: 15s
  # Order: per-subject serialisation lease (05-ordering.md §4). Must exceed
  # connect + send timeout + auth timeout + rate_limit_wait + 5s.
  ordering_lease: 45s
  ordering_heartbeat_interval: 10s
  ordering_busy_retry: 2s

frontend:
  base_url: "http://localhost:3000"
  cart_path: "/cart"

bulk:
  quiet_from: "22:00"
  quiet_to: "08:00"
  default_timezone: "Asia/Ho_Chi_Minh"
  frequency_cap_per_day: 2

outbox:
  publisher: "debezium"     # debezium (CDC) | poller (this service publishes)
  poll_interval: 500ms
  batch: 100

jobs:
  partition_interval: 1h
  partition_ahead_months: 2
  purge_interval: 1h
  purge_batch: 10000
  retention_days: { request: 90, delivery: 90, provider_event: 30, inbox: 90, ingest_dedup: 30, delivery_dedup: 30, provider_event_dedup: 14, outbox: 7, ops_idempotency: 1 }
  metrics_interval: 15s

contact:
  cache_ttl: 15m

logging:
  level: "info"
  format: "json"

telemetry:
  metrics_path: "/metrics"

templates:
  default_locale: "vi"

extensions:
  replay_mode_default_ttl: 6h
  idempotency_ttl: 24h

# Versioned HMAC keys for Order subject high-watermarks, ordering keys and
# deleted-user tombstones (09-data-model.md §3, §10). Secret: set
# NOTIFICATION_PRIVACY_HMAC_KEY (>= 32 bytes outside development; development
# falls back to a fixed dev key). Rotation: raise hmac_key_version, keep the old
# key in previous_hmac_keys ("1:<key>") — never swap keys in one step.
privacy:
  hmac_key: "${NOTIFICATION_PRIVACY_HMAC_KEY}"
  hmac_key_version: 1
  previous_hmac_keys: "${NOTIFICATION_PRIVACY_PREVIOUS_HMAC_KEYS}"
