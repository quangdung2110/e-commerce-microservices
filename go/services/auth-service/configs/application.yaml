# Application Configuration
app:
  name: "auth-service"
  host: "0.0.0.0"
  port: 8080
  env: "development"  # development, staging, production

# Server Configuration
server:
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 120s
  shutdown_timeout: 30s

# Database Configuration
database:
  host: "localhost"
  port: 5432
  name: "auth_db"
  username: "postgres"
  password: "${DB_PASSWORD}"
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 5m
  sslmode: "disable"

# Redis Configuration
redis:
  host: "localhost"
  port: 6379
  password: "${REDIS_PASSWORD}"
  db: 0
  pool_size: 10
  min_idle_conns: 5

# Kafka Configuration
kafka:
  brokers:
    - "localhost:9092"
  topic_prefix: "t.auth"
  consumer_group: "auth-service"
  admin_topic: "t.admin"

# JWT Configuration
jwt:
  access_token_ttl: 15m
  refresh_token_ttl: 720h  # 30 days
  grace_period: 10s
  issuer: "auth-service"
  algorithm: "RS256"

# Security Configuration
security:
  argon2:
    memory: 65536      # 64MB
    iterations: 3
    parallelism: 4
    salt_length: 16
    key_length: 32
  
  rate_limit:
    login_max_attempts: 5
    login_lockout_duration: 30m
    login_window: 60m
  
  session:
    max_concurrent: 10

# Key Management
keys:
  rotation_interval: 720h  # 30 days
  retirement_delay: 744h  # 31 days
  key_size: 2048          # RSA key size

# Cleanup Configuration
cleanup:
  refresh_token_retention: 168h   # 7 days
  audit_log_retention: 4320h      # 6 months
  outbox_retention: 336h          # 14 days
  auto_unlock_interval: 30m

# Logging Configuration
logging:
  level: "info"      # debug, info, warn, error
  format: "json"     # json, console
