# Inventory Service Configuration

server:
  port: 8088
  host: 0.0.0.0

kafka:
  brokers:
    - localhost:9092
  group_id: inventory-service-group
  topics:
    - order-events
    - payment-events
  dead_letter_topic: inventory-events-dlt

redis:
  host: localhost
  port: 6379
  password: ""
  db: 0

database:
  host: localhost
  port: 5432
  name: inventory_db
  user: postgres
  password: postgres
  ssl_mode: disable

temporal:
  host_port: localhost:7233
  namespace: default

# Service-specific configuration
inventory:
  reservation_ttl_minutes: 15
  max_concurrent_reservations: 1000
  enable_warehouse_distribution: true
