# =============================================================================
# Traefik v3.x - Static Configuration
# =============================================================================
# This file is loaded on Traefik startup and defines the core configuration.
# Changes require Traefik restart.
# =============================================================================

# Global settings
global:
  checkNewVersion: true
  sendAnonymousUsage: false

# API Configuration
api:
  dashboard: true
  insecure: true

# EntryPoints - Define ports and protocols
entryPoints:
  web:
    address: ":80"
    # Client IP chain (security review 2026-10-22, H2; mesh ADR-004). Only the frontend container
    # (fixed address on the ecommerce-edge network, docker-compose.yml) may name the browser in
    # X-Forwarded-For / X-Real-Ip; it overwrites both with its TCP peer (frontend/client-ip-server.cjs).
    # From any other peer, including a client calling :8088 directly, Traefik drops those headers
    # and sets X-Real-Ip to the peer address. Rate limits key on X-Real-Ip (dynamic.yml).
    forwardedHeaders:
      trustedIPs:
        - "10.89.8.10/32"

  metrics:
    address: ":8090"

# Providers - Service discovery mechanisms
providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: ecommerce-network
    watch: true

  file:
    directory: /etc/traefik/dynamic
    watch: true

# Logging
log:
  level: INFO
  format: json

# Access Log
accessLog:
  format: json
  fields:
    defaultMode: keep
    names:
      RequestPath: drop
      RequestLine: drop
      ClientUsername: drop
    headers:
      defaultMode: drop
      names:
        X-Request-Id: keep

metrics:
  prometheus:
    entryPoint: metrics
    addRoutersLabels: true
    buckets: [0.005, 0.01, 0.025, 0.05, 0.1, 0.25, 0.5, 1, 2.5, 5, 10]

tracing:
  serviceName: api-gateway
  sampleRate: 1.0
  otlp:
    http:
      endpoint: http://otel-collector:4318/v1/traces
