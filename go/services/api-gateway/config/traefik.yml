# =============================================================================
# Traefik v3.x - Static Configuration
# =============================================================================
# This file is loaded on Traefik startup and defines the core configuration.
# Changes require Traefik restart.
# =============================================================================

# Global settings
global:
  checkNewVersion: true
  sendAnonymousUsage: false

# API Configuration
api:
  dashboard: true
  insecure: true

# EntryPoints - Define ports and protocols
entryPoints:
  web:
    address: ":80"

  metrics:
    address: ":8090"

# Providers - Service discovery mechanisms
providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: ecommerce-network
    watch: true

  file:
    directory: /etc/traefik/dynamic
    watch: true

# Logging
log:
  level: INFO
  format: json

# Access Log
accessLog:
  format: json
  fields:
    defaultMode: keep
    names:
      RequestPath: drop
      RequestLine: drop
      ClientUsername: drop
    headers:
      defaultMode: drop
      names:
        X-Request-Id: keep

metrics:
  prometheus:
    entryPoint: metrics
    addRoutersLabels: true
    buckets: [0.005, 0.01, 0.025, 0.05, 0.1, 0.25, 0.5, 1, 2.5, 5, 10]

tracing:
  serviceName: api-gateway
  sampleRate: 1.0
  otlp:
    http:
      endpoint: http://otel-collector:4318/v1/traces
