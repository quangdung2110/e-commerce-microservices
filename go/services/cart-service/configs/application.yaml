# Cart Service — Redis-only configuration (docs/cart/operations.md §2).
#
# Every key can be overridden with a CART_-prefixed environment variable where
# dots become underscores, e.g. CART_REDIS_ADDRS, CART_PRODUCT_ADDRESS.

app:
  name: "cart-service"
  env: "development"
  host: "0.0.0.0"
  port: 8080
  shutdown_timeout: 30s
  readiness_timeout: 2s

# Redis is the single source of truth. Production must run AOF, a replica, TLS
# and maxmemory-policy noeviction: there is no cold store to recover from.
redis:
  addrs:
    - "localhost:6379"
  password: ""
  db: 0
  pool_size: 100
  min_idle_conns: 20
  dial_timeout: 5s
  read_timeout: 3s
  write_timeout: 3s
  tls_enabled: false

kafka:
  brokers:
    - "localhost:9092"
  topic_cart_events: "t.cart.events"
  topic_cart_events_dlq: "t.cart.events.dlq"
  topic_order_events: "t.order.events"
  consumer_group_order: "cart-order-consumer"
  initial_offset: "oldest"
  required_acks: "all"
  produce_timeout: 10s
  session_timeout: 30s
  tls_enabled: false
  event_data_schema: "https://contracts.ecommerce.local/events/cart/v1/schemas/cart-abandoned.schema.json"

# Pull model: Product is called when a user writes and when a user reads, never
# on a schedule and never through a change feed (ADR-005).
product:
  address: "localhost:9091"
  dial_timeout: 5s
  get_sku_timeout: 200ms
  get_batch_skus_timeout: 200ms
  cache_size: 4096
  cache_ttl: 45s
  circuit_breaker:
    failure_threshold: 5
    half_open_max_calls: 1
    open_timeout: 30s

# Public media. Product gRPC returns image storage keys; Cart builds the CDN URL
# when it renders a response. Values must match the Product Detail BFF and
# Search so a cart line shows the same file. Local values serve MinIO through
# the gateway over http; every other environment overrides them with https
# (CART_MEDIA_CDN_BASE_URL, CART_MEDIA_PLACEHOLDER_URL, CART_MEDIA_REQUIRE_HTTPS).
media:
  cdn_base_url: "http://localhost:8088/media"
  placeholder_url: "http://localhost:8088/media/placeholder/product.svg"
  require_https: false

cart:
  # A data contract, not a tunable. The service refuses to start on a mismatch.
  bucket_count: 64
  abandoned_after: 720h   # 30 days
  active_ttl: 888h        # 37 days: a 7-day buffer for the marker
  abandoned_ttl: 168h     # 7 days of retention after the transition
  product_validation_ttl: 45s
  idempotency_ttl: 24h
  rate_limit:
    requests_per_second: 20
    burst: 40
    idle_timeout: 10m

worker:
  abandoned_marker:
    enabled: true
    interval: 1m
    batch_size: 200
    operation_timeout: 5s
  outbox_relay:
    enabled: true
    idle_interval: 2s
    batch_size: 64
    claim_min_idle: 30s
    max_publish_attempts: 3
    publish_backoff: 200ms
    operation_timeout: 10s
  stream_trimmer:
    enabled: true
    interval: 5m
    operation_timeout: 5s
  order_consumer:
    enabled: true

logging:
  level: "debug"
  format: "json"
  output: "stdout"
