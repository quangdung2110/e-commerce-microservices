# Standalone stack for developing Cart Service.
#
# Cart has no PostgreSQL dependency: Redis is the source of truth, the
# scheduler store, the idempotency store and the outbox (ADR-010).

services:
  # ── Product Service ──────────────────────────────────────────────────────────
  product-service:
    image: product-service:local
    container_name: product-service
    ports:
      - "8081:8081"
      - "9091:9091"
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - SERVER_PORT=8081
      - GRPC_PORT=9091
      - DB_URL=jdbc:postgresql://product-postgres:5432/product_service
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - GRPC_SECURITY_ENABLED=false
      - LOGGING_LEVEL_ROOT=DEBUG
      - SPRING_FLYWAY_ENABLED=false
      - SPRING_JPA_HIBERNATE_DDL_AUTO=create-drop
    depends_on:
      product-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - shared-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health/liveness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # ── Cart Service ─────────────────────────────────────────────────────────────
  cart-service:
    image: cart-service:local
    build:
      context: ../..
      dockerfile: services/cart-service/Dockerfile
    container_name: cart-service
    profiles:
      - app
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=development
      - CART_REDIS_ADDRS=redis:6379
      - CART_KAFKA_BROKERS=kafka:29092
      - CART_PRODUCT_ADDRESS=product-service:9091
      - CART_LOGGING_LEVEL=debug
    depends_on:
      product-service:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - ./configs:/app/configs:ro
    networks:
      - shared-network
    restart: unless-stopped

  # ── Redis: the cart source of truth ──────────────────────────────────────────
  # noeviction is mandatory, not a preference. Under allkeys-lru Redis would
  # silently discard live carts under memory pressure, and Cart has no cold
  # store to recover them from. AOF is on for the same reason.
  redis:
    image: redis:7.2-alpine
    container_name: cart-redis
    ports:
      - "6379:6379"
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - shared-network

  # PostgreSQL is here only because Product Service needs it. Cart never
  # connects to it.
  product-postgres:
    image: postgres:16-alpine
    container_name: cart-product-postgres
    ports:
      - "15435:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: product_service
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - shared-network

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: cart-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: U-Ui4bTZS5CSb3nHVfwbmQ
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shared-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: cart-kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka
    networks:
      - shared-network

volumes:
  redis-data:
  postgres-data:
  kafka-data:

networks:
  shared-network:
    driver: bridge
