name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  # The Lua scripts are copied from docs/cart/scripts, which stays the
  # canonical source. Drift between the two is a correctness bug, not a style
  # issue, so it fails the build.
  contract-drift:
    name: Lua scripts match the canonical source
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go/services/cart-service
    steps:
      - uses: actions/checkout@v4
      - run: make check-lua

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: go/services/cart-service/go.sum
      - uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          working-directory: go/services/cart-service
          args: --timeout=5m

  test:
    name: Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go/services/cart-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: go/services/cart-service/go.sum

      - name: Verify formatting
        run: test -z "$(gofmt -l $(find . -name '*.go' -not -path './internal/infrastructure/product/pb/*'))"

      - name: Vet
        run: go vet ./...

      # The Lua scripts run against an in-process Redis, so no service
      # container is needed and no PostgreSQL exists to provision.
      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage summary
        if: always()
        run: go tool cover -func=coverage.out | tail -1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: go/services/cart-service/coverage.out
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go/services/cart-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: go/services/cart-service/go.sum
      - run: go build -o bin/cart-service ./cmd/server

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: securego/gosec@master
        with:
          args: -no-fail -fmt sarif -out gosec-results.sarif ./go/services/cart-service/...
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: gosec-results.sarif
