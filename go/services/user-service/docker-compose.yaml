# Local development stack for User Service.
#
# The public API is published on 8082, so it can run next to auth-service on
# 8080. The internal checkout API on 8083 is reachable only inside the compose
# network, which is why it is not published.

services:
  user-service:
    build:
      context: ../..
      dockerfile: services/user-service/Dockerfile
    ports:
      - "8082:8082"
    environment:
      USER_APP_ENV: development
      USER_DATABASE_HOST: postgres
      USER_REDIS_HOST: redis
      USER_KAFKA_BROKERS: kafka:9092
      DB_PASSWORD: postgres
      REDIS_PASSWORD: ""
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8082/health/ready >/dev/null || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - user-network

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: user_db
      TZ: UTC
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # The schema is applied, in order, on first start of an empty volume.
      - ./migrations/0001_initial_user_schema.up.sql:/docker-entrypoint-initdb.d/0001_initial_user_schema.sql:ro
      - ./migrations/0002_marketing_opt_in_default.up.sql:/docker-entrypoint-initdb.d/0002_marketing_opt_in_default.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - user-network

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - user-network

  kafka:
    image: bitnami/kafka:3.7
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9093:9092"
    volumes:
      - kafka_data:/bitnami/kafka
    networks:
      - user-network

volumes:
  postgres_data:
  redis_data:
  kafka_data:

networks:
  user-network:
    driver: bridge
