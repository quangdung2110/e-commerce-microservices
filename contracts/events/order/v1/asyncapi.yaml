asyncapi: 3.0.0
info:
  title: Order Service Integration Events
  version: 1.0.0
  description: >-
    Provider-owned Order facts with registered consumers, plus the provider-owned
    Payment, Inventory and Delivery facts consumed by Order workflows. Order publishes
    only PAID for Cart cleanup and COMPLETED for Review eligibility. Delivery is
    at-least-once; consumers deduplicate by CloudEvents id.
x-adoption-status: proposed
x-contract-scope: order-integration-events
defaultContentType: application/cloudevents+json
servers:
  local:
    host: localhost:9092
    protocol: kafka
channels:
  orderEvents:
    address: t.order.events
    description: Order facts that have registered, implemented consumers.
    x-owner: order-service
    x-message-key: order_id
    x-ordering-scope: order_id
    x-delivery-semantic: at-least-once
    x-deduplication-key: CloudEvents.id
    x-ordering-guard: sequence
    x-max-payload-bytes: 262144
    x-retention: 14d
    x-data-classification: INTERNAL
    messages:
      orderPaid: { $ref: '#/components/messages/orderPaid' }
      orderCompleted: { $ref: '#/components/messages/orderCompleted' }
  paymentFacts:
    address: t.payment.events.v2
    description: Payment-owned financial facts accepted by Order workflows.
    x-owner: payment-service
    x-message-key: data.order_id
    x-deduplication-key: CloudEvents.source + CloudEvents.id
    x-ordering-guard: data.financial_state_version per data.payment_transaction_id
    messages:
      paymentSucceeded:
        $ref: '../../payment/v2/asyncapi.yaml#/components/messages/paymentSucceeded'
      paymentFailed:
        $ref: '../../payment/v2/asyncapi.yaml#/components/messages/paymentFailed'
      paymentExpired:
        $ref: '../../payment/v2/asyncapi.yaml#/components/messages/paymentExpired'
      paymentCanceled:
        $ref: '../../payment/v2/asyncapi.yaml#/components/messages/paymentCanceled'
      refundProcessing:
        $ref: '../../payment/v2/asyncapi.yaml#/components/messages/refundProcessing'
      refundSucceeded:
        $ref: '../../payment/v2/asyncapi.yaml#/components/messages/refundSucceeded'
      refundFailed:
        $ref: '../../payment/v2/asyncapi.yaml#/components/messages/refundFailed'
      refundReversed:
        $ref: '../../payment/v2/asyncapi.yaml#/components/messages/refundReversed'
  inventoryOrderFacts:
    address: t.inventory.order.events.v1
    description: Inventory-owned physical-dispatch and refund-inspection facts accepted by Order.
    x-owner: inventory-service
    x-message-key: order_id
    messages:
      reservationLineDispatched:
        $ref: '../../inventory/v1/asyncapi.yaml#/components/messages/reservationLineDispatched'
      allItemsInspectionCompleted:
        $ref: '../../inventory/v1/asyncapi.yaml#/components/messages/allItemsInspectionCompleted'
  deliveryFacts:
    address: t.delivery.order.events.v1
    description: Delivery-owned verified customer-delivery facts accepted by Order.
    x-owner: delivery-service
    x-message-key: order_id
    messages:
      orderLineDelivered:
        $ref: '../../delivery/v1/asyncapi.yaml#/components/messages/orderLineDelivered'
operations:
  publishOrderPaid:
    action: send
    channel: { $ref: '#/channels/orderEvents' }
    summary: Publish once when the immutable captured payment moves the Order into PAID, including fenced late-payment recovery.
    x-consumers: [cart-service]
    messages: [{ $ref: '#/channels/orderEvents/messages/orderPaid' }]
  publishOrderCompleted:
    action: send
    channel: { $ref: '#/channels/orderEvents' }
    summary: Publish once after every line is delivered by verified Delivery proof and the master completion CAS succeeds.
    x-consumers: [review-service]
    messages: [{ $ref: '#/channels/orderEvents/messages/orderCompleted' }]
  consumePaymentFacts:
    action: receive
    channel: { $ref: '#/channels/paymentFacts' }
    summary: Consume only terminal payment facts and refund lifecycle facts that can advance or reconcile an Order workflow; dispatch by exact namespaced CloudEvents type.
    x-consumer-group: order-payment-consumer
    x-accepted-event-types:
      - com.ecommerce.payment.transaction.succeeded.v2
      - com.ecommerce.payment.transaction.canceled.v2
      - com.ecommerce.payment.transaction.failed.v2
      - com.ecommerce.payment.transaction.expired.v2
      - com.ecommerce.payment.refund.processing.v2
      - com.ecommerce.payment.refund.succeeded.v2
      - com.ecommerce.payment.refund.failed.v2
      - com.ecommerce.payment.refund.reversed.v2
    messages:
      - { $ref: '#/channels/paymentFacts/messages/paymentSucceeded' }
      - { $ref: '#/channels/paymentFacts/messages/paymentCanceled' }
      - { $ref: '#/channels/paymentFacts/messages/paymentFailed' }
      - { $ref: '#/channels/paymentFacts/messages/paymentExpired' }
      - { $ref: '#/channels/paymentFacts/messages/refundProcessing' }
      - { $ref: '#/channels/paymentFacts/messages/refundSucceeded' }
      - { $ref: '#/channels/paymentFacts/messages/refundFailed' }
      - { $ref: '#/channels/paymentFacts/messages/refundReversed' }
  consumeInventoryOrderFacts:
    action: receive
    channel: { $ref: '#/channels/inventoryOrderFacts' }
    summary: Consume physical dispatch and completed selected-return inspection; HTTP activity results remain authoritative for reserve, commit and release commands.
    x-consumer-groups: [order-inventory-ship-consumer, order-inventory-return-consumer]
    messages:
      - { $ref: '#/channels/inventoryOrderFacts/messages/reservationLineDispatched' }
      - { $ref: '#/channels/inventoryOrderFacts/messages/allItemsInspectionCompleted' }
  consumeDeliveryFacts:
    action: receive
    channel: { $ref: '#/channels/deliveryFacts' }
    summary: Consume the only fact allowed to move one Order line from DISPATCHED to DELIVERED.
    x-consumer-group: order-delivery-consumer
    messages: [{ $ref: '#/channels/deliveryFacts/messages/orderLineDelivered' }]
components:
  messages:
    orderPaid:
      name: orderPaidV1
      title: ORDER_PAID
      summary: Minimal purchased-SKU fact used by Cart to remove only the items paid for.
      contentType: application/cloudevents+json
      x-consumers: [cart-service]
      payload: { $ref: './schemas/order-paid.schema.json' }
    orderCompleted:
      name: orderCompletedV1
      title: ORDER_COMPLETED
      summary: Immutable completed-order item snapshot used by Review to grant one entitlement per SKU.
      contentType: application/cloudevents+json
      x-consumers: [review-service]
      payload: { $ref: './schemas/order-completed.schema.json' }
