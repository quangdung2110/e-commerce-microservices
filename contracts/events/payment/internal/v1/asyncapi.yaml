asyncapi: 3.0.0
info:
  title: Payment Internal Stripe Webhook Buffer
  version: 1.0.0
  description: >-
    Internal contract between the Payment webhook ingress and Payment webhook
    processor. The message preserves the exact Stripe request body as base64;
    candidate identifiers remain untrusted until the worker verifies the signature.
x-adoption-status: proposed
x-contract-scope: payment-internal-webhook-buffer
defaultContentType: application/cloudevents+json
servers:
  local:
    host: localhost:9092
    protocol: kafka
    description: Local development broker
channels:
  rawStripeWebhooks:
    address: t.payment.webhooks.raw
    description: Raw Stripe deliveries accepted by the HTTP ingress after Kafka acknowledgement.
    x-owner: payment-service
    x-visibility: internal
    x-message-key: STRIPE:<candidate_event_id> or RAW:<raw_body_sha256>
    x-ordering-scope: ingress key only; payment correctness never relies on partition order
    x-delivery-semantic: at-least-once
    x-deduplication-key: verified Stripe event id in webhook_logs, not candidate_event_id
    x-max-payload-bytes: 262144
    x-retention: 7d
    x-retry-policy:
      strategy: kafka-redelivery-before-db-commit-then-webhook-log-auto-retry
      durable-retry-store: payment.webhook_logs
      exhausted-financial-event-action: open-WEBHOOK_RETRY_EXHAUSTED-review-case
      kafka-dlq: none
    x-data-classification: CONFIDENTIAL
    bindings:
      kafka:
        partitions: 6
        replicas: 3
        topicConfiguration:
          cleanup.policy: [delete]
          retention.ms: 604800000
          max.message.bytes: 262144
        bindingVersion: '0.5.0'
    messages:
      stripeWebhookReceived: { $ref: '#/components/messages/stripeWebhookReceived' }
operations:
  bufferStripeWebhook:
    action: send
    title: Buffer a Stripe webhook
    summary: payment-api sends the raw delivery only after Kafka acknowledges it.
    channel: { $ref: '#/channels/rawStripeWebhooks' }
    messages: [{ $ref: '#/channels/rawStripeWebhooks/messages/stripeWebhookReceived' }]
  processStripeWebhook:
    action: receive
    title: Verify and process a Stripe webhook
    summary: payment-worker verifies, parses, deduplicates and applies the matching FSM transition.
    channel: { $ref: '#/channels/rawStripeWebhooks' }
    bindings:
      kafka:
        groupId: { type: string, const: payment-webhook-processor }
        bindingVersion: '0.5.0'
    messages: [{ $ref: '#/channels/rawStripeWebhooks/messages/stripeWebhookReceived' }]
components:
  messages:
    stripeWebhookReceived:
      name: stripeWebhookReceivedV1
      title: STRIPE_WEBHOOK_RECEIVED
      summary: Untrusted raw Stripe delivery awaiting signature verification.
      contentType: application/cloudevents+json
      x-event-type: com.ecommerce.payment.stripe-webhook.received.v1
      x-producer-component: payment-api
      x-consumer-component: payment-worker
      x-example-file: ../../../../examples/events/payment-stripe-webhook-received.v1.json
      bindings:
        kafka:
          key:
            type: string
            pattern: '^(STRIPE:evt_[A-Za-z0-9]+|RAW:[a-f0-9]{64})$'
          bindingVersion: '0.5.0'
      payload: { $ref: './schemas/stripe-webhook-received.schema.json' }
