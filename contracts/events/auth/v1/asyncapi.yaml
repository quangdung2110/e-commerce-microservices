            dataschema: /contracts/events/auth/v1/schemas/user-password-changed.schema.json
            correlationid: 0198e098-96f2-7ad3-91d8-570608021328
            data:
              delivery_id: 0198e09d-96f2-7ad3-91d8-570608021328
              user_id: 0198e098-96f2-7ad3-91d8-570608021328
              changed_at: '2026-08-27T13:05:00Z'
    userAccountLocked:
      name: userAccountLockedV1
      title: USER_ACCOUNT_LOCKED
      summary: Gửi cảnh báo account bị khóa tạm thời.
      contentType: application/cloudevents+json
      x-consumers: [notification-service]
      payload:
        $ref: './schemas/user-account-locked.schema.json'
      examples:
        - name: default
