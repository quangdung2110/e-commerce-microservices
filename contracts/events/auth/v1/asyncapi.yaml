            dataschema: /contracts/events/auth/v1/schemas/user-account-locked.schema.json
            correlationid: 0198e098-96f2-7ad3-91d8-570608021328
            data:
              delivery_id: 0198e09e-96f2-7ad3-91d8-570608021328
              user_id: 0198e098-96f2-7ad3-91d8-570608021328
              locked_at: '2026-08-27T13:10:00Z'
              locked_until: '2026-08-27T13:25:00Z'
    userUnlocked:
      name: userUnlockedV1
      title: USER_UNLOCKED
      summary: Gửi thông báo worker đã tự mở khóa account.
      contentType: application/cloudevents+json
      x-consumers: [notification-service]
      payload:
        $ref: './schemas/user-unlocked.schema.json'
      examples:
        - name: default
