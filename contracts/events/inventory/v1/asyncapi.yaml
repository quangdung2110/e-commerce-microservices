asyncapi: 3.0.0
info:
  title: Inventory Service Public Facts
  version: 1.0.0
  description: >-
    Target Inventory facts emitted from the transactional outbox. Delivery is
    at-least-once. Search consumes an Inventory-owned per-SKU availability snapshot;
    Order consumes workflow facts. Consumers use aggregate revision to reject stale
    facts. Export sequence may contain gaps and is not global Kafka order.
x-adoption-status: proposed
defaultContentType: application/cloudevents+json
servers:
  local:
    host: localhost:9092
    protocol: kafka
channels:
  availabilityFacts:
    address: t.inventory.stock.events.v1
    description: Per-SKU stock availability snapshots for Search.
    x-owner: inventory-service
    x-message-key: sku_id
    x-delivery-semantic: at-least-once
    x-deduplication-key: CloudEvents.id
    x-ordering-scope: sku_id
    x-ordering-guard: aggregaterevision
    x-max-payload-bytes: 16384
    x-retention: 30d-minimum
    x-retry-policy:
      strategy: retry-without-ack-then-projection-rebuild
    x-data-classification: INTERNAL
    x-consumers: [search-service]
    messages:
      skuAvailabilityChanged: { $ref: '#/components/messages/skuAvailabilityChanged' }
  orderFacts:
    address: t.inventory.order.events.v1
    description: Reservation, physical dispatch, and refund-inspection facts for Order reconciliation.
    x-owner: inventory-service
    x-message-key: order_id
    x-ordering-scope: order_id
    x-delivery-semantic: at-least-once
    x-deduplication-key: CloudEvents.id
    x-ordering-guard: aggregaterevision
    x-max-payload-bytes: 262144
    x-retention: 30d-minimum
    x-retry-policy:
      strategy: consumer-managed-retry-with-dlq
      dead-letter-topic: t.inventory.order.events.v1.dlq
    x-data-classification: INTERNAL
    x-consumers: [order-service]
    messages:
      reservationReserved: { $ref: '#/components/messages/reservationReserved' }
      reservationCommitted: { $ref: '#/components/messages/reservationCommitted' }
      reservationReleased: { $ref: '#/components/messages/reservationReleased' }
      reservationLineDispatched: { $ref: '#/components/messages/reservationLineDispatched' }
      allItemsInspectionCompleted: { $ref: '#/components/messages/allItemsInspectionCompleted' }
operations:
  publishSkuAvailabilityChanged:
    action: send
    channel: { $ref: '#/channels/availabilityFacts' }
    summary: Publish the complete Search-facing availability state after the derived boolean changes or is initialized.
    x-message-key: sku_id
    x-publication-precondition: Search has registered that the Product-owned SKU document exists.
    messages: [{ $ref: '#/channels/availabilityFacts/messages/skuAvailabilityChanged' }]
  publishReservationReserved:
    action: send
    channel: { $ref: '#/channels/orderFacts' }
    messages: [{ $ref: '#/channels/orderFacts/messages/reservationReserved' }]
  publishReservationCommitted:
    action: send
    channel: { $ref: '#/channels/orderFacts' }
    messages: [{ $ref: '#/channels/orderFacts/messages/reservationCommitted' }]
  publishReservationReleased:
    action: send
    channel: { $ref: '#/channels/orderFacts' }
    messages: [{ $ref: '#/channels/orderFacts/messages/reservationReleased' }]
  publishReservationLineDispatched:
    action: send
    channel: { $ref: '#/channels/orderFacts' }
    messages: [{ $ref: '#/channels/orderFacts/messages/reservationLineDispatched' }]
  publishAllItemsInspectionCompleted:
    action: send
    channel: { $ref: '#/channels/orderFacts' }
    messages: [{ $ref: '#/channels/orderFacts/messages/allItemsInspectionCompleted' }]
components:
  messages:
    skuAvailabilityChanged:
      name: skuAvailabilityChangedV1
      title: Per-SKU stock availability changed
      contentType: application/cloudevents+json
      payload: { $ref: './schemas/sku-availability-changed.schema.json' }
    reservationReserved:
      name: reservationReservedV1
      title: Whole order reserved
      contentType: application/cloudevents+json
      payload: { $ref: './schemas/reservation-reserved.schema.json' }
    reservationCommitted:
      name: reservationCommittedV1
      title: Whole order committed
      contentType: application/cloudevents+json
      payload: { $ref: './schemas/reservation-committed.schema.json' }
    reservationReleased:
      name: reservationReleasedV1
      title: Whole order reservation released
      contentType: application/cloudevents+json
      payload: { $ref: './schemas/reservation-released.schema.json' }
    reservationLineDispatched:
      name: reservationLineDispatchedV1
      title: Reservation line physically dispatched
      contentType: application/cloudevents+json
      payload: { $ref: './schemas/reservation-line-dispatched.schema.json' }
    allItemsInspectionCompleted:
      name: allItemsInspectionCompletedV1
      title: All expected refund items received and final-inspected
      contentType: application/cloudevents+json
      payload: { $ref: './schemas/all-items-inspection-completed.schema.json' }
