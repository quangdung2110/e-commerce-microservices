syntax = "proto3";

package ecommerce.common.v1;

option go_package = "github.com/ecommerce/contracts/gen/go/ecommerce/common/v1;commonv1";
option java_multiple_files = true;
option java_package = "com.ecommerce.contracts.common.v1";

message CursorPageRequest {
  // Empty means the first page. Treat cursor as opaque.
  string cursor = 1;
  // Provider enforces its documented maximum.
  int32 limit = 2;
}

message CursorPageInfo {
  string next_cursor = 1;
  bool has_more = 2;
}
