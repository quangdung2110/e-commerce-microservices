openapi: 3.1.0
info:
  title: Review Internal Rating Aggregate Snapshot Export API
  version: 1.0.0
  description: >-
    Contract đích để Search bootstrap hoặc phục hồi rating projection. Chỉ service
    identity được gọi; endpoint không expose qua API Gateway.
x-adoption-status: proposed
servers:
  - url: http://review-service:8080
    description: Internal cluster endpoint
paths:
  /internal/v1/reviews/rating-aggregates:
    get:
      operationId: exportRatingAggregateSnapshots
      summary: Keyset export rating aggregate snapshot per Product
      security: [{ serviceIdentity: [] }]
      parameters:
        - name: after_product_id
          in: query
          required: false
          schema: { type: string, maxLength: 64 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 1000, default: 500 }
      responses:
        '200':
          description: >-
            Trang ổn định theo product_id. replay_from_offsets được chụp trước khi
            scan bắt đầu và biểu thị offset đầu tiên phải replay (inclusive). Giá trị
            này lặp lại không đổi ở mọi trang của cùng export session; Search import
            xong phải replay REVIEW_METRICS_UPDATED từ các offset đó và dùng
            review_revision để bỏ state cũ/trùng.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, next_after_product_id, replay_from_offsets]
                properties:
                  items:
                    type: array
                    maxItems: 1000
                    items: { $ref: '#/components/schemas/RatingAggregateSnapshot' }
                  next_after_product_id:
                    type: [string, 'null']
                    maxLength: 64
                  replay_from_offsets:
                    type: array
                    items: { $ref: '#/components/schemas/ReplayOffset' }
        '401': { description: Missing or invalid service identity. }
        '403': { description: Caller is not authorized to export review rating aggregates. }
        '503': { description: Review cannot create a consistent export session. }
components:
  securitySchemes:
    serviceIdentity:
      type: http
      scheme: bearer
      bearerFormat: internal-service-identity
  schemas:
    RatingAggregateSnapshot:
      type: object
      additionalProperties: false
      required: [product_id, average_rating, total_reviews, review_revision, observed_at]
      properties:
        product_id: { type: string, minLength: 1, maxLength: 64 }
        average_rating: { type: number, minimum: 0, maximum: 5 }
        total_reviews: { type: integer, minimum: 0 }
        total_with_media: { type: integer, minimum: 0 }
        review_revision: { type: integer, minimum: 1 }
        observed_at: { type: string, format: date-time }
    ReplayOffset:
      type: object
      additionalProperties: false
      required: [topic, partition, offset]
      properties:
        topic: { const: t.review.events }
        partition: { type: integer, minimum: 0 }
        offset: { type: integer, minimum: 0 }
