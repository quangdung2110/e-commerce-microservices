openapi: 3.1.0
info:
  title: Cart Service HTTP API
  version: 1.0.0
  description: >-
    Contract của Cart Service Redis-only (đã implement trong go/services/cart-service).
    Cart được xác định từ identity do API Gateway inject; client không gửi cart_id
    hoặc user_id. Gateway local dùng authenticated@file (ForwardAuth gateway-auth),
    không inject danh tính dev cố định. POST/DELETE không retry ở gateway.

    Rate limit cục bộ: mỗi pod giới hạn 20 request/giây (burst 40) theo user cho mọi
    route `/api/v1/carts/mine/**`, kể cả GET; vượt giới hạn trả `429 RATE_LIMITED` kèm
    `Retry-After`. Gateway áp thêm policy `rate-limit-api` ở phía trước.
x-adoption-status: implemented
servers:
  - url: http://localhost:8088
    description: Local Docker Compose, qua API Gateway (Cart không publish cổng host)
tags:
  - name: Cart
paths:
  /api/v1/carts/mine:
    get:
      tags: [Cart]
      operationId: getMyCart
      summary: Lấy cart của user hiện tại
      description: >-
        Redis miss trả cart rỗng. Cart enrich giá và availability từ Product Service;
        khi Product không khả dụng, response vẫn thành công nhưng catalog_freshness
        là DEGRADED và current_price có thể null.
      security:
        - gatewayIdentity: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Cart snapshot; dữ liệu cá nhân, không được shared-cache.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/CartStoreUnavailable'

  /api/v1/carts/mine/items:
    post:
      tags: [Cart]
      operationId: adjustCartItem
      summary: Thêm SKU hoặc điều chỉnh quantity theo delta
      description: >-
        delta dương thêm/tăng, delta âm giảm. Delta xử lý nguyên tử trong Redis,
        nên request đến lệch thứ tự không ghi đè quantity tuyệt đối. Khi kết quả
        không còn quantity dương, client phải gọi DELETE thay vì gửi delta âm thêm.
        SKU mới hoặc validation catalog stale mới cần Product Service.
      security:
        - gatewayIdentity: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdjustItemRequest'
      responses:
        '200':
          description: SKU đã tồn tại và quantity đã thay đổi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartMutationResult' }
        '201':
          description: SKU mới được thêm vào cart.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartMutationResult' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/WriteDependencyUnavailable'

    delete:
      tags: [Cart]
      operationId: deleteCartItems
      summary: Xóa tối đa 100 SKU khỏi cart
      description: SKU không tồn tại bị bỏ qua. Nếu không còn item, Cart xóa state và abandonment schedule Redis.
      security:
        - gatewayIdentity: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeleteItemsRequest' }
      responses:
        '200':
          description: Kết quả xóa logic.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeleteItemsResult' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/CartStoreUnavailable'

  /internal/v1/carts/{user_id}/checkout-snapshot:
    servers:
      - url: http://cart-service:8080
        description: Chỉ trong mạng service; không có route Gateway cho /internal/v1/**
    get:
      tags: [Cart]
      operationId: getCheckoutCartSnapshot
      summary: Resolve the authoritative Cart quantity snapshot for Checkout
      description: >-
        CHECKOUT only. Reads the same Redis source of truth as the public Cart API
        but returns only identifiers and quantities. It does not call Product,
        expose Redis keys, refresh TTL, or mutate cart lifecycle state. Redis miss
        returns an empty items array. Items are ordered by sku_id. The internal route
        is not rate limited.

        The mesh authenticates the workload principal; Cart additionally requires
        `X-Service-Identity` to be on its allowlist (`cart.internal_callers`, default
        `checkout-service`) as defence in depth: a missing header is 401, any other
        service is 403, a non-UUID `user_id` is 400.
      security: [{ checkoutService: [] }]
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ServiceIdentity'
      responses:
        '200':
          description: Minimal server-to-server Cart snapshot.
          headers:
            Cache-Control:
              schema: { type: string, const: 'private, no-store' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckoutCartSnapshot' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/CartStoreUnavailable' }

components:
  securitySchemes:
    gatewayIdentity:
      type: apiKey
      in: header
      name: X-User-Id
      description: Trusted identity Gateway inject sau JWT verification; không phải header public client được phép tự đặt.
    checkoutService:
      type: mutualTLS
      description: >-
        Mesh principal must be checkout-service. Cart also checks the X-Service-Identity
        header against its allowlist as defence in depth (see the ServiceIdentity parameter).

  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema: { type: string, minLength: 8, maxLength: 128 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 128 }
    ServiceIdentity:
      name: X-Service-Identity
      in: header
      required: true
      description: >-
        Calling service identity. Must be in the Cart allowlist (`cart.internal_callers`,
        default `checkout-service`); a missing header is 401 and any other value is 403.
      schema: { type: string, example: checkout-service }
    UserId:
      name: user_id
      in: path
      required: true
      schema: { type: string, format: uuid }

  schemas:
    Money:
      $ref: '../../../shared/json-schema/v1/money.schema.json'
    Problem:
      $ref: '../../../shared/json-schema/v1/problem.schema.json'
    AdjustItemRequest:
      type: object
      additionalProperties: false
      required: [sku_id, delta]
      properties:
        sku_id: { type: string, minLength: 1, maxLength: 64 }
        delta:
          type: integer
          minimum: -100
          maximum: 100
          not: { const: 0 }
          description: Lượng thay đổi tương đối; không phải quantity tuyệt đối.
    DeleteItemsRequest:
      type: object
      additionalProperties: false
      required: [sku_ids]
      properties:
        sku_ids:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 64 }
    CartMutationResult:
      type: object
      additionalProperties: false
      required: [sku_id, quantity, created, updated_at]
      properties:
        sku_id: { type: string, maxLength: 64 }
        quantity: { type: integer, minimum: 1, maximum: 100 }
        created: { type: boolean }
        updated_at: { type: string, format: date-time }
    DeleteItemsResult:
      type: object
      additionalProperties: false
      required: [deleted_count]
      properties:
        deleted_count: { type: integer, minimum: 0, maximum: 100 }
    CatalogFreshness:
      type: string
      enum: [CURRENT, DEGRADED]
    Cart:
      type: object
      additionalProperties: false
      required: [items, total_unique_skus, total_units, catalog_freshness]
      properties:
        items:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/CartItem' }
        total_unique_skus: { type: integer, minimum: 0, maximum: 50 }
        total_units: { type: integer, minimum: 0, maximum: 5000 }
        catalog_freshness: { $ref: '#/components/schemas/CatalogFreshness' }
    CartItem:
      type: object
      additionalProperties: false
      required:
        - sku_id
        - product_id
        - product_name
        - image_url
        - quantity
        - unit_price_at_add
        - current_price
        - is_available
        - added_at
        - updated_at
      properties:
        sku_id: { type: string, maxLength: 64 }
        product_id: { type: string, maxLength: 64 }
        product_name: { type: string, maxLength: 300 }
        variant_attributes:
          type: object
          additionalProperties: { type: string, maxLength: 200 }
          maxProperties: 30
        image_url:
          type: string
          format: uri
          maxLength: 2048
          description: >-
            Absolute CDN URL built by Cart from the Product image storage key, or the
            configured placeholder when the SKU has no image. Never a storage key.
        quantity: { type: integer, minimum: 1, maximum: 100 }
        unit_price_at_add: { $ref: '#/components/schemas/Money' }
        current_price:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Null khi Product Service không trả được giá hiện tại.
        is_available:
          type: boolean
          description: Catalog saleability (Product và SKU ACTIVE), không phải stock Inventory. Giá trị CURRENT khi catalog_freshness=CURRENT, snapshot gần nhất khi DEGRADED.
        added_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CheckoutCartSnapshot:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/CheckoutCartItem' }
    CheckoutCartItem:
      type: object
      additionalProperties: false
      required: [product_id, sku_id, quantity]
      properties:
        product_id: { type: string, minLength: 1, maxLength: 64 }
        sku_id: { type: string, minLength: 1, maxLength: 64 }
        quantity: { type: integer, minimum: 1, maximum: 100 }

  responses:
    BadRequest:
      description: >-
        Request không hợp lệ (`code` = `VALIDATION_FAILED`, kèm `errors[]` theo field): thiếu
        hoặc sai `Idempotency-Key`, body sai schema, `delta` bằng 0 hoặc ngoài -100..100,
        `sku_ids` rỗng/trùng/quá 100, hoặc `user_id` của route nội bộ không phải UUID.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: >-
        Thiếu trusted identity (`X-User-Id` ở route public, `X-Service-Identity` ở route nội bộ);
        `code` = `UNAUTHENTICATED`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: >-
        `X-Service-Identity` không nằm trong allowlist `cart.internal_callers`
        (`code` = `FORBIDDEN`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    IdempotencyConflict:
      description: >-
        `IDEMPOTENCY_CONFLICT`: cùng `Idempotency-Key` đã được dùng với payload khác. Ghi
        của Cart chạy nguyên tử trong Redis Lua nên không có trạng thái "đang xử lý": cùng
        key và cùng payload luôn trả lại kết quả đã lưu, không bao giờ trả 409.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unprocessable:
      description: >-
        Rule Cart hoặc Product validation không thỏa. `code` là một trong `CART_FULL`
        (SKU mới vượt 50 SKU), `PRODUCT_NOT_AVAILABLE` (Product/SKU không active hoặc không
        tồn tại), `QUANTITY_INVALID` (delta làm quantity không còn dương; dùng DELETE),
        `ITEM_NOT_FOUND` (delta âm cho SKU không có trong cart).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RateLimited:
      description: Vượt rate limit theo user (`code` = `RATE_LIMITED`, `retryable` = true).
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    CartStoreUnavailable:
      description: >-
        Redis Cart source of truth không khả dụng (`code` = `CART_STORE_UNAVAILABLE`,
        `retryable` = true).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    WriteDependencyUnavailable:
      description: >-
        Redis hoặc Product dependency cần cho write không khả dụng (`code` =
        `CART_STORE_UNAVAILABLE` hoặc `PRODUCT_UNAVAILABLE`, `retryable` = true).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
