openapi: 3.1.0
info:
  title: Cart Service HTTP API
  version: 1.0.0
  description: >-
    Contract đích cho Cart HTTP API. Đây là pilot proposed; implementation hiện
    tại chưa được đánh dấu là conformant.
x-adoption-status: proposed
servers:
  - url: http://localhost:8085
    description: Local Docker Compose
tags:
  - name: Cart
paths:
  /api/v1/carts/mine:
    get:
      tags: [Cart]
      operationId: getMyCart
      summary: Lấy giỏ hàng của user hiện tại
      security:
        - gatewayIdentity: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Cart snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/carts/items:
    post:
      tags: [Cart]
      operationId: addCartItem
      summary: Thêm SKU hoặc tăng quantity trong giỏ
      description: >-
        Idempotency-Key là bắt buộc. Cùng key và cùng payload trả lại cùng logical
        result; cùng key nhưng payload khác trả 409.
      security:
        - gatewayIdentity: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddItemRequest'
      responses:
        '200':
          description: SKU đã tồn tại và quantity được cập nhật
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartMutationResult'
        '201':
          description: SKU mới được thêm vào cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartMutationResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags: [Cart]
      operationId: deleteCartItems
      summary: Xóa tối đa 100 SKU khỏi cart
      security:
        - gatewayIdentity: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteItemsRequest'
      responses:
        '200':
          description: Kết quả xóa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteItemsResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    gatewayIdentity:
      type: apiKey
      in: header
      name: X-User-Id
      description: >-
        Trusted identity injected by API Gateway. Không được expose như một
        client-controlled header trên public edge.

  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
        minLength: 8
        maxLength: 128
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128

  schemas:
    Money:
      $ref: '../../../shared/json-schema/v1/money.schema.json'
    Problem:
      $ref: '../../../shared/json-schema/v1/problem.schema.json'
    AddItemRequest:
      type: object
      additionalProperties: false
      required: [sku_id, quantity]
      properties:
        sku_id:
          type: string
          minLength: 1
          maxLength: 64
        quantity:
          type: integer
          minimum: 1
          maximum: 100
    DeleteItemsRequest:
      type: object
      additionalProperties: false
      required: [sku_ids]
      properties:
        sku_ids:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 64
    CartMutationResult:
      type: object
      additionalProperties: false
      required: [sku_id, quantity, updated_at]
      properties:
        sku_id: { type: string, maxLength: 64 }
        quantity: { type: integer, minimum: 1, maximum: 100 }
        updated_at: { type: string, format: date-time }
    DeleteItemsResult:
      type: object
      additionalProperties: false
      required: [deleted_count]
      properties:
        deleted_count: { type: integer, minimum: 0, maximum: 100 }
    Cart:
      type: object
      additionalProperties: false
      required: [items, total_items, total_unique_skus, price_freshness]
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/CartItem'
        total_items: { type: integer, minimum: 0 }
        total_unique_skus: { type: integer, minimum: 0, maximum: 50 }
        price_freshness:
          type: string
          enum: [CURRENT, DEGRADED]
    CartItem:
      type: object
      additionalProperties: false
      required:
        - sku_id
        - product_id
        - product_name
        - quantity
        - unit_price_at_add
        - current_price
        - is_available
        - added_at
        - updated_at
      properties:
        sku_id: { type: string, maxLength: 64 }
        product_id: { type: string, maxLength: 64 }
        product_name: { type: string, maxLength: 300 }
        variant_attributes:
          type: object
          additionalProperties: { type: string, maxLength: 200 }
          maxProperties: 30
        image_url: { type: string, format: uri, maxLength: 2048 }
        quantity: { type: integer, minimum: 1, maximum: 100 }
        unit_price_at_add: { $ref: '#/components/schemas/Money' }
        current_price: { $ref: '#/components/schemas/Money' }
        is_available: { type: boolean }
        added_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

  responses:
    BadRequest:
      description: Request không hợp lệ
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Thiếu trusted identity
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    IdempotencyConflict:
      description: Idempotency key đang xử lý hoặc được dùng với payload khác
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unprocessable:
      description: Product không tồn tại, không khả dụng hoặc thiếu stock
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RateLimited:
      description: Vượt rate limit
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    InternalError:
      description: Lỗi không mong đợi
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
