openapi: 3.1.0
info:
  title: Search Service Storefront API
  version: 2.2.0
  description: >-
    Contract cho storefront search/browse và vận hành reindex, đã được provider
    (`java/services/search-service`) và frontend dùng. Search là
    Elasticsearch projection eventual-consistent, không phải nguồn catalog, giá
    hay tồn kho để quyết định giao dịch. Mỗi item là một Product đại diện bởi SKU giá bán thấp nhất thỏa bộ lọc; facet và
    category count đếm DISTINCT product_id.
    Gateway local chỉ expose bốn endpoint storefront bằng GET tại /api/v2/search;
    reindex-runs (liệt kê, đọc, tạo, hủy, rollback) dùng router riêng xác thực JWT
    qua gateway-auth, role ADMIN do Search kiểm tra. Không có route Search v1.
    Mọi lỗi là application/problem+json với `trace_id` luôn có; ngoài các mã nghiệp vụ nêu
    ở từng operation, một request sai giao thức (route lạ, method sai, Content-Type sai,
    body không đọc được) nhận 404 NOT_FOUND, 405 METHOD_NOT_ALLOWED, 406 NOT_ACCEPTABLE,
    415 UNSUPPORTED_MEDIA_TYPE hoặc 400 INVALID_QUERY_PARAMETER, không bao giờ 500.
    Một tham số rỗng hoặc chỉ có khoảng trắng (q, category, cursor) được coi như không gửi.
x-adoption-status: implemented
servers:
  - url: http://localhost:8081
    description: Local Docker Compose
  - url: http://search-service:8080
    description: Internal cluster endpoint
tags:
  - name: Storefront search
  - name: Search operations
paths:
  /api/v2/search/products:
    get:
      tags: [Storefront search]
      operationId: searchProducts
      security: []
      summary: Search và browse Product catalog đang hiển thị
      description: >-
        Public read qua API Gateway. Kết quả là Product card từ SKU projection, có thể cũ vài
        giây so với Product/Inventory. Không dùng response này để reserve, chốt
        giá hoặc xác nhận tồn kho. Chọn SKU theo selling_price_vnd asc rồi sku_id asc. Mọi sort Product dùng product_id asc làm tie-break;
        cursor có chữ ký, giữ snapshot PIT và chỉ hợp lệ với đúng query/filter/sort đã sinh nó.
        Giá tăng/giảm dùng giá của SKU đại diện; relevance lấy score cao nhất của SKU khớp,
        newest lấy updated_at lớn nhất, rating lấy rating lớn nhất của các SKU khớp.
        Snapshot hết hạn sau 2 phút không hoạt động: INVALID_CURSOR, tải lại trang đầu.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/Category'
        - $ref: '#/components/parameters/Filter'
        - $ref: '#/components/parameters/PriceMin'
        - $ref: '#/components/parameters/PriceMax'
        - $ref: '#/components/parameters/InStock'
        - $ref: '#/components/parameters/HasPromotion'
        - $ref: '#/components/parameters/SearchSort'
        - $ref: '#/components/parameters/SearchCursor'
        - $ref: '#/components/parameters/SearchSize'
      responses:
        '200':
          description: Trang Product duy nhất; total_products chính xác trong cùng snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/ElasticsearchUnavailable' }
        '504': { $ref: '#/components/responses/SearchTimeout' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v2/search/suggestions:
    get:
      tags: [Storefront search]
      operationId: suggestSearchTerms
      security: []
      summary: Gợi ý autocomplete từ projection pre-compute
      description: >-
        q có tối thiểu hai ký tự. Đây là capability degrade độc lập: client có
        thể ẩn dropdown khi endpoint lỗi mà không chặn search chính. Mỗi item là
        một cụm từ để hoàn tất truy vấn: khi được chọn, client dùng text làm q
        cho tìm kiếm sản phẩm. Item không phải link đến Product, SKU hay Category
        và response không cung cấp định danh để điều hướng.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/SuggestQuery'
        - $ref: '#/components/parameters/SuggestLimit'
      responses:
        '200':
          description: Suggestions theo weight giảm dần và text tăng dần khi hòa.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuggestionList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/ElasticsearchUnavailable' }
        '504': { $ref: '#/components/responses/SearchTimeout' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v2/search/categories:
    get:
      tags: [Storefront search]
      operationId: getCategoryTree
      security: []
      summary: Lấy cây category storefront
      description: >-
        Chỉ category chưa tombstone được trả. product_count là DISTINCT Product
        do job định kỳ tính lại, nên có thể trễ hơn search result. Search không trả cây
        thiếu khi Elasticsearch quá hạn hoặc lỗi shard: kết quả đó là 504 SEARCH_TIMEOUT.
      parameters: [{ $ref: '#/components/parameters/RequestId' }]
      responses:
        '200':
          description: Cây category đã materialize; node mồ côi bị loại khỏi response.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryTree' }
        '503': { $ref: '#/components/responses/ElasticsearchUnavailable' }
        '504': { $ref: '#/components/responses/SearchTimeout' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v2/search/categories/{category_id}/facets:
    get:
      tags: [Storefront search]
      operationId: getCategoryFacets
      security: []
      summary: Lấy filter facets khả dụng trong một nhánh category
      description: >-
        Counts dùng cùng visibility filters với search (ACTIVE, chưa xóa và
        in_stock=true mặc định), đếm DISTINCT product_id bằng cardinality nên là
        ước lượng. Filter option value là opaque token để gửi lại qua query
        parameter filter của searchProducts.
      parameters:
        - $ref: '#/components/parameters/CategoryId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Facet bootstrap cho category; không nhận buyer-selected filters.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FacetSet' }
        '404': { $ref: '#/components/responses/CategoryNotFound' }
        '503': { $ref: '#/components/responses/ElasticsearchUnavailable' }
        '504': { $ref: '#/components/responses/SearchTimeout' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v2/search/reindex-runs:
    post:
      tags: [Search operations]
      operationId: createReindexRun
      summary: Trigger full reindex bất đồng bộ
      description: >-
        Chỉ ADMIN qua Gateway. Server lấy actor từ trusted identity header, không
        tin actor do body tự khai. Một reindex chưa kết thúc sẽ chặn trigger mới
        (REINDEX_ALREADY_RUNNING). Một run mà process sở hữu nó đã chết được xử lý trước
        (resume hoặc đánh dấu bị bỏ rơi) nên không chặn trigger mãi mãi. Cluster red hoặc
        thiếu dung lượng đĩa cho một index thứ hai bị từ chối bằng 409
        REINDEX_PRECONDITION_FAILED; cluster yellow vẫn được nhận. Search cũng tự tạo run
        (actor `system:catalog-control`) khi Product phát catalog-reindex-requested; run đó
        xuất hiện ở listReindexRuns.
      security: [{ gatewayIdentity: [], gatewayRoles: [] }]
      parameters: [{ $ref: '#/components/parameters/RequestId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateReindexRunRequest' }
      responses:
        '202':
          description: Run đã được nhận; công việc tiếp tục nền.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReindexRun' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/ReindexAlreadyRunning' }
        '503': { $ref: '#/components/responses/ElasticsearchUnavailable' }
        '504': { $ref: '#/components/responses/SearchTimeout' }
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      tags: [Search operations]
      operationId: listReindexRuns
      summary: Liệt kê các full reindex run, mới nhất trước
      description: >-
        Chỉ ADMIN qua Gateway. Cần để tìm run do control event tự khởi chạy, vì admin không
        biết run_id của nó.
      security: [{ gatewayIdentity: [], gatewayRoles: [] }]
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: status
          in: query
          required: false
          description: Chỉ trả run ở trạng thái này.
          schema: { $ref: '#/components/schemas/ReindexRunStatus' }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Các run, sắp xếp theo started_at giảm dần.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReindexRunList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ElasticsearchUnavailable' }
        '504': { $ref: '#/components/responses/SearchTimeout' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v2/search/reindex-runs/{run_id}:
    get:
      tags: [Search operations]
      operationId: getReindexRun
      summary: Đọc trạng thái một full reindex run
      security: [{ gatewayIdentity: [], gatewayRoles: [] }]
      parameters:
        - $ref: '#/components/parameters/ReindexRunId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Trạng thái và tiến độ hiện tại của run.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReindexRun' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ReindexRunNotFound' }
        '503': { $ref: '#/components/responses/ElasticsearchUnavailable' }
        '504': { $ref: '#/components/responses/SearchTimeout' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v2/search/reindex-runs/{run_id}/cancellation:
    post:
      tags: [Search operations]
      operationId: cancelReindexRun
      summary: Yêu cầu hủy một full reindex run
      description: >-
        Chỉ ADMIN qua Gateway. Run đang Build hoặc Catch-up dừng ở trang kế tiếp và kết thúc
        `CANCELLED`, các index nó đã dựng bị xóa, alias không đổi; response `202` vẫn mang
        trạng thái hiện tại và client đọc lại run để thấy `CANCELLED`. Run không còn process
        sở hữu được kết thúc ngay trong chính request này. Run đã kết thúc, hoặc đang kiểm tra
        và chuyển alias (CUTOVER), không hủy được (409 REINDEX_RUN_NOT_CANCELLABLE).
      security: [{ gatewayIdentity: [], gatewayRoles: [] }]
      parameters:
        - $ref: '#/components/parameters/ReindexRunId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '202':
          description: Yêu cầu hủy đã được ghi nhận.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReindexRun' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ReindexRunNotFound' }
        '409': { $ref: '#/components/responses/ReindexRunNotCancellable' }
        '503': { $ref: '#/components/responses/ElasticsearchUnavailable' }
        '504': { $ref: '#/components/responses/SearchTimeout' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v2/search/reindex-runs/{run_id}/rollback:
    post:
      tags: [Search operations]
      operationId: rollbackReindexRun
      summary: Trả các alias về index mà một run đã hoàn tất thay thế
      description: >-
        Chỉ ADMIN qua Gateway. Chuyển cả bốn alias về index trước đó trong một lệnh `_aliases`
        atomic và đặt run `ROLLED_BACK`; xử lý đồng bộ nên trả 200. Chỉ run `COMPLETED` là lần
        cutover mới nhất mới rollback được, và chỉ khi index trước đó chưa bị job dọn dẹp xóa
        (giữ tối thiểu 24 giờ sau cutover). Dữ liệu ghi vào index mới sau cutover không có
        trong index cũ: chạy reindex mới để hội tụ.
      security: [{ gatewayIdentity: [], gatewayRoles: [] }]
      parameters:
        - $ref: '#/components/parameters/ReindexRunId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Alias đã về index cũ; run ở trạng thái ROLLED_BACK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReindexRun' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ReindexRunNotFound' }
        '409': { $ref: '#/components/responses/ReindexRollbackUnavailable' }
        '503': { $ref: '#/components/responses/ElasticsearchUnavailable' }
        '504': { $ref: '#/components/responses/SearchTimeout' }
        '500': { $ref: '#/components/responses/InternalError' }
components:
  securitySchemes:
    gatewayIdentity:
      type: apiKey
      in: header
      name: X-User-Id
      description: Trusted identity do API Gateway inject sau JWT verification; không phải public header.
    gatewayRoles:
      type: apiKey
      in: header
      name: X-User-Roles
      description: Trusted roles do API Gateway inject; operation yêu cầu role ADMIN.
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: >-
        Echoed in the response header and as the Problem `trace_id` when it is 16..64 characters
        of `[A-Za-z0-9._:-]`; a value outside that, or none, is replaced by an id Search generates.
      schema: { type: string, minLength: 8, maxLength: 128 }
    SearchQuery:
      name: q
      in: query
      required: false
      description: Trim, lower-case và collapse whitespace trước khi fingerprint cursor.
      schema: { type: string, minLength: 1, maxLength: 256 }
    Category:
      name: category
      in: query
      required: false
      description: >-
        Category ID hoặc slug; Search resolve từ projection category hiện hành. Giá trị không khớp
        category nào đang hiển thị là 400 INVALID_QUERY_PARAMETER (field `category`), không phải
        tìm trên toàn catalog.
      schema: { type: string, minLength: 1, maxLength: 180 }
    Filter:
      name: filter
      in: query
      required: false
      style: form
      explode: true
      description: >-
        Lặp lại cho từng opaque attribute token từ FacetOption.value, ví dụ
        filter=brand:s:apple&filter=color:s:black. Token là chuỗi đục do Search
        sinh; client chỉ gửi lại nguyên văn giá trị nhận được và không tự ghép.
        OR trong cùng attribute code, AND giữa code khác nhau. Một token không có dạng của
        FacetOption.value bị từ chối 400 INVALID_QUERY_PARAMETER (field `filter`), không bị bỏ qua.
      schema:
        type: array
        maxItems: 50
        items: { type: string, minLength: 1, maxLength: 256 }
    PriceMin:
      name: price_min
      in: query
      required: false
      schema: { type: integer, format: int64, minimum: 0, x-currency: VND }
    PriceMax:
      name: price_max
      in: query
      required: false
      description: Must be greater than or equal to price_min when both are supplied.
      schema: { type: integer, format: int64, minimum: 0, x-currency: VND }
    InStock:
      name: in_stock
      in: query
      required: false
      schema: { type: boolean, default: true }
    HasPromotion:
      name: has_promotion
      in: query
      required: false
      schema: { type: boolean }
    SearchSort:
      name: sort
      in: query
      required: false
      schema: { $ref: '#/components/schemas/SearchSort' }
    SearchCursor:
      name: cursor
      in: query
      required: false
      description: Opaque signed cursor từ next_cursor; không tự sinh hoặc dùng lại với query khác. Cursor SKU cũ không còn hợp lệ.
      schema: { type: string, minLength: 1, maxLength: 16384 }
    SearchSize:
      name: size
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    SuggestQuery:
      name: q
      in: query
      required: true
      schema: { type: string, minLength: 2, maxLength: 256 }
    SuggestLimit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 20, default: 8 }
    CategoryId:
      name: category_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    ReindexRunId:
      name: run_id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
  headers:
    RetryAfter:
      description: >-
        Seconds to wait before repeating the request. Present on every 429 and on every 503 with
        retryable=true (contracts ADR-005); a 503 with retryable=false does not carry it.
      required: false
      schema: { type: integer, minimum: 1, maximum: 3600 }
  schemas:
    Uuid:
      type: string
      format: uuid
      description: Opaque UUID owned by the upstream service or Search for run IDs.
    SearchSort:
      type: string
      enum: [relevance, price_asc, price_desc, newest, rating]
      default: relevance
    SearchPage:
      type: object
      additionalProperties: false
      required: [items, total_products, next_cursor, facets]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/SearchProductItem' }
        total_products:
          type: integer
          format: int64
          minimum: 0
          description: Exact number of distinct matching products in the PIT snapshot.
        next_cursor:
          type: [string, 'null']
          minLength: 1
          maxLength: 16384
          description: Null khi không còn Product tiếp theo.
        facets: { $ref: '#/components/schemas/FacetSet' }
    SearchProductItem:
      description: Một Product duy nhất; sku_id, giá, thumbnail và tồn kho thuộc SKU đại diện giá thấp nhất thỏa tất cả bộ lọc.
      type: object
      additionalProperties: false
      required:
        - sku_id
        - product_id
        - product_slug
        - name
        - thumbnail_url
        - base_price_vnd
        - selling_price_vnd
        - discount_percentage
        - product_rating_avg
        - product_rating_count
        - is_in_stock
      properties:
        sku_id: { $ref: '#/components/schemas/Uuid' }
        product_id: { $ref: '#/components/schemas/Uuid' }
        product_slug: { type: string, minLength: 1, maxLength: 180 }
        name: { type: string, minLength: 1, maxLength: 255 }
        thumbnail_url:
          type: string
          format: uri-reference
          maxLength: 2048
          description: CDN URL hoặc configured placeholder; không phải thumbnail_storage_key.
        base_price_vnd: { type: integer, format: int64, minimum: 0, x-currency: VND }
        selling_price_vnd: { type: integer, format: int64, minimum: 0, x-currency: VND }
        discount_percentage: { type: integer, minimum: 0, maximum: 100 }
        product_rating_avg:
          type: [number, 'null']
          minimum: 0
          maximum: 5
        product_rating_count: { type: integer, format: int64, minimum: 0 }
        is_in_stock:
          type: boolean
          description: Eventual Inventory snapshot, không phải kết quả reserve.
    SuggestionList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/Suggestion' }
    Suggestion:
      type: object
      additionalProperties: false
      required: [text, type]
      properties:
        text: { type: string, minLength: 1, maxLength: 255 }
        type:
          type: string
          description: >-
            Suggestion kind for dropdown presentation only; it is not a navigation
            target and clients must tolerate newly added types.
          maxLength: 64
    CategoryTree:
      type: object
      additionalProperties: false
      required: [count_semantics, categories]
      properties:
        count_semantics: { const: DISTINCT_PRODUCT }
        categories:
          type: array
          maxItems: 1000
          items: { $ref: '#/components/schemas/CategoryNode' }
    CategoryNode:
      type: object
      additionalProperties: false
      required: [category_id, name, slug, product_count, product_count_updated_at, children]
      properties:
        category_id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string, minLength: 1, maxLength: 160 }
        slug: { type: string, minLength: 1, maxLength: 180 }
        product_count: { type: integer, format: int64, minimum: 0 }
        product_count_updated_at:
          type: [string, 'null']
          format: date-time
          description: >-
            Null cho tới khi job recompute chạy lần đầu cho node này; category_upsert
            không khởi tạo số đếm.
        children:
          type: array
          maxItems: 1000
          items: { $ref: '#/components/schemas/CategoryNode' }
    FacetSet:
      type: object
      additionalProperties: false
      required: [count_semantics, count_accuracy, filters]
      properties:
        count_semantics: { const: DISTINCT_PRODUCT }
        count_accuracy: { const: APPROXIMATE }
        filters:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/AttributeFacet' }
    AttributeFacet:
      type: object
      additionalProperties: false
      required: [code, label, type, options]
      properties:
        code: { type: string, minLength: 1, maxLength: 64 }
        label: { type: string, minLength: 1, maxLength: 160 }
        type: { const: MULTI_SELECT }
        options:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/FacetOption' }
    FacetOption:
      type: object
      additionalProperties: false
      required: [value, label, count]
      properties:
        value:
          type: string
          minLength: 1
          maxLength: 256
          description: Opaque token accepted by the repeatable filter parameter.
        label: { type: string, minLength: 1, maxLength: 160 }
        count: { type: integer, format: int64, minimum: 0 }
    CreateReindexRunRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
    ReindexRunStatus:
      type: string
      description: >-
        STARTED, BUILDING, CATCHING_UP và CUTOVER là các trạng thái chưa kết thúc; một run chưa kết
        thúc giữ slot singleton. CUTOVER gồm bước kiểm tra index mới (số document, sample diff,
        smoke query) và lệnh chuyển alias. COMPLETED, FAILED, ROLLED_BACK, SUPERSEDED và CANCELLED
        là trạng thái kết thúc. SUPERSEDED nghĩa là một catalog-reindex-requested mới tới trong
        lúc run đang chạy; run bị bỏ, alias giữ nguyên và request vẫn được lưu để một run mới
        được khởi chạy. CANCELLED nghĩa là admin đã hủy (failure.code RUN_CANCELLED). ROLLED_BACK
        nghĩa là các alias đã được trả về index cũ sau khi COMPLETED.
      enum: [STARTED, BUILDING, CATCHING_UP, CUTOVER, COMPLETED, FAILED, ROLLED_BACK, SUPERSEDED, CANCELLED]
    ReindexRunList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/ReindexRun' }
    ReindexRun:
      type: object
      additionalProperties: false
      required: [run_id, status, phase, reason, actor, progress, status_url, started_at, finished_at, failure]
      properties:
        run_id: { $ref: '#/components/schemas/Uuid' }
        status: { $ref: '#/components/schemas/ReindexRunStatus' }
        phase:
          type: [string, 'null']
          enum: [BUILDING, CATCHING_UP, CUTOVER, null]
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: 'Lý do admin đã khai, hoặc "catalog-reindex-requested: ..." với run tự khởi chạy.'
        actor:
          type: string
          minLength: 1
          maxLength: 128
          description: Identity đã trigger run, hoặc `system:catalog-control` với run tự khởi chạy.
        progress: { $ref: '#/components/schemas/ReindexProgress' }
        status_url: { type: string, format: uri-reference, maxLength: 2048 }
        started_at: { type: string, format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
        failure:
          oneOf:
            - $ref: '#/components/schemas/ReindexFailure'
            - type: 'null'
    ReindexProgress:
      type: object
      additionalProperties: false
      required:
        - categories_exported
        - products_exported
        - stock_snapshots_imported
        - rating_aggregates_imported
        - catch_up_lag
      properties:
        categories_exported: { type: integer, format: int64, minimum: 0 }
        products_exported: { type: integer, format: int64, minimum: 0 }
        stock_snapshots_imported: { type: integer, format: int64, minimum: 0 }
        rating_aggregates_imported: { type: integer, format: int64, minimum: 0 }
        catch_up_lag: { type: [integer, 'null'], format: int64, minimum: 0 }
    ReindexFailure:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          minLength: 3
          maxLength: 64
          description: >-
            REINDEX_FAILED (build, catch-up hoặc kiểm tra không đạt), RUN_SUPERSEDED, RUN_CANCELLED
            hoặc RUN_ABANDONED (không process nào giữ run sống sau số lần resume tối đa).
        message: { type: string, minLength: 1, maxLength: 500 }
    Problem:
      $ref: '../../../shared/json-schema/v1/problem.schema.json'
  responses:
    BadRequest:
      description: >-
        INVALID_QUERY_PARAMETER (kèm errors[] theo field: tham số sai kiểu, ngoài khoảng hoặc
        vượt giới hạn độ dài/số lượng, token `filter` không phải giá trị facet, `category` không
        khớp category nào đang hiển thị, body không đọc được) hoặc INVALID_CURSOR (cursor sai
        chữ ký, đổi tham số, quá hạn hoặc quá dài).
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Unauthorized:
      description: Missing or invalid trusted Gateway identity.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Forbidden:
      description: Caller does not have role ADMIN.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    CategoryNotFound:
      description: CATEGORY_NOT_FOUND.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    ReindexRunNotFound:
      description: REINDEX_RUN_NOT_FOUND.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    ReindexAlreadyRunning:
      description: >-
        REINDEX_ALREADY_RUNNING (retry after the active run completes), or
        REINDEX_PRECONDITION_FAILED (cluster red or not enough free disk; retry once the cluster
        has recovered).
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    ReindexRunNotCancellable:
      description: REINDEX_RUN_NOT_CANCELLABLE; the run already finished or is switching the aliases.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    ReindexRollbackUnavailable:
      description: >-
        REINDEX_ROLLBACK_UNAVAILABLE; the run is not COMPLETED, replaced no index, is not the latest
        cutover, the previous index was already removed, or another run is in progress.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    ElasticsearchUnavailable:
      description: ELASTICSEARCH_UNAVAILABLE; retryable infrastructure failure.
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    SearchTimeout:
      description: SEARCH_TIMEOUT; Search did not retry internally.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    InternalError:
      description: INTERNAL_ERROR.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
