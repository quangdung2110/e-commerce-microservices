openapi: 3.1.0
info:
  title: Auth Service HTTP API
  version: 1.0.0
  description: >-
    Auth HTTP API do `go/services/auth-service` phục vụ. Auth sở hữu account, role,
    credential, session, token và JWT key; không sở hữu user profile. Mọi lỗi là
    `application/problem+json` với `code` ổn định; danh mục mã, HTTP status và cờ
    retryable nằm ở `docs/auth/domain.md` mục 7 và ma trận theo endpoint ở
    `docs/auth/interfaces.md` mục 6.
x-adoption-status: proposed
servers:
  - url: http://auth-service:8080
    description: Cluster endpoint, chỉ tới được qua API Gateway (và JWKS cho gateway-auth)
  - url: http://localhost:8086
    description: Cổng host của auth-service trong root Docker Compose
tags:
  - name: Authentication
  - name: Sessions
  - name: Password
  - name: Accounts
  - name: JWKS

paths:
  /api/v1/auth/registrations:
    post:
      tags: [Authentication]
      operationId: registerAccount
      security: []
      summary: Tạo account chờ xác minh email
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegistrationRequest' }
      responses:
        '202':
          description: Account đã được tạo và email xác minh đã được yêu cầu.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistrationAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/EmailAlreadyRegistered' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/auth/email-verification-requests:
    post:
      tags: [Authentication]
      operationId: requestEmailVerification
      security: []
      summary: Gửi lại OTP xác minh email
      description: >-
        Luôn trả cùng phản hồi thành công để không tiết lộ email có account
        chờ xác minh hay không. Mỗi account chỉ được gửi lại 3 lần trong 15 phút;
        vượt ngân sách đó Auth không gửi nữa nhưng vẫn trả `202`, vì một `429` chỉ
        xuất hiện với địa chỉ có account chờ xác minh sẽ là chính điều cần giấu.
        `429` ở đây chỉ đến từ rate limit theo IP.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailRequest' }
      responses:
        '202': { $ref: '#/components/responses/GenericAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/auth/email-verifications:
    post:
      tags: [Authentication]
      operationId: verifyEmail
      security: []
      summary: Xác minh OTP email và kích hoạt account
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailVerificationRequest' }
      responses:
        '204': { description: Email đã được xác minh. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/AccountStateConflict' }
        '422': { $ref: '#/components/responses/InvalidOtp' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/auth/email-change-requests:
    post:
      tags: [Accounts]
      operationId: requestEmailChange
      summary: Yêu cầu đổi email của account hiện tại
      description: >-
        Xác thực password hiện tại, rồi gửi OTP tới email mới. Email chỉ thay đổi
        sau khi confirmation OTP thành công.
      security:
        - gatewayIdentity: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailChangeRequest' }
      responses:
        '202': { $ref: '#/components/responses/GenericAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '409': { $ref: '#/components/responses/EmailAlreadyRegistered' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/auth/email-changes/confirmations:
    post:
      tags: [Accounts]
      operationId: confirmEmailChange
      summary: Xác minh OTP và hoàn tất đổi email
      description: >-
        Khi thành công, Auth revoke toàn bộ refresh session, đặt `revoked_before`
        và phát `USER_EMAIL_CHANGED` để thông báo email cũ.
      security:
        - gatewayIdentity: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailChangeConfirmationRequest' }
      responses:
        '204':
          description: Email đã được đổi và session đã bị thu hồi.
          headers:
            Set-Cookie: { $ref: '#/components/headers/ClearedRefreshCookie' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/AccountStateConflict' }
        '422': { $ref: '#/components/responses/InvalidOtp' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/auth/sessions:
    post:
      tags: [Authentication, Sessions]
      operationId: login
      security: []
      summary: Đăng nhập và tạo session mới
      description: >-
        Mật khẩu được kiểm trước trạng thái account. Sai mật khẩu luôn là `401
        INVALID_CREDENTIALS` (email không tồn tại, account chờ xác minh, đang bị khóa
        hay đang hoạt động đều giống nhau); chỉ người đúng mật khẩu mới thấy `403
        ACCOUNT_NOT_VERIFIED` hoặc `423 ACCOUNT_LOCKED`. Lần sai chạm ngưỡng khóa trả
        `423` kèm `Retry-After`. Đăng nhập đúng sau khi lock hết hạn tự mở khóa account.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: >-
            Access token được trả trong JSON. Refresh token chỉ được trả qua
            cookie `auth_refresh`, không xuất hiện trong response body.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            Set-Cookie: { $ref: '#/components/headers/RefreshCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessTokenResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '403': { $ref: '#/components/responses/AccountNotVerified' }
        '423': { $ref: '#/components/responses/AccountLocked' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

    get:
      tags: [Sessions]
      operationId: listSessions
      summary: Liệt kê session đang có hiệu lực của account hiện tại
      security:
        - gatewayIdentity: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Danh sách session không chứa refresh token hoặc hash.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

    delete:
      tags: [Sessions]
      operationId: revokeAllSessions
      summary: Thu hồi toàn bộ session của account hiện tại
      description: >-
        Thu hồi toàn bộ refresh token và đặt mốc `revoked_before`; Gateway phải
        từ chối access token được phát hành trước hoặc đúng mốc này. Mốc và `iat` đều
        có độ phân giải một giây nên token cấp trong cùng giây với lần thu hồi cũng bị
        từ chối; đây là chủ ý, và client phải đăng nhập lại sau thao tác này.
      security:
        - gatewayIdentity: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '204':
          description: Tất cả session đã được thu hồi.
          headers:
            Set-Cookie: { $ref: '#/components/headers/ClearedRefreshCookie' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/auth/sessions/refresh:
    post:
      tags: [Sessions]
      operationId: refreshSession
      summary: Rotate refresh token và cấp access token mới
      description: >-
        Cookie `auth_refresh` chỉ thành công một lần. Retry sau timeout không
        được giả định là idempotent; client phải thực hiện lại login khi cần.
      security:
        - refreshSession: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Refresh token đã được rotate.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            Set-Cookie: { $ref: '#/components/headers/RefreshCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessTokenResponse' }
        '401': { $ref: '#/components/responses/InvalidRefreshToken' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/auth/sessions/{session_id}:
    delete:
      tags: [Sessions]
      operationId: revokeSession
      summary: Thu hồi một session của account hiện tại
      security:
        - gatewayIdentity: []
          gatewayTokenJti: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '204':
          description: >-
            Session family đã được thu hồi hoặc đã không còn hiệu lực. Nếu đây là
            session hiện tại, Auth denylist `jti` và xóa refresh cookie.
          headers:
            Set-Cookie: { $ref: '#/components/headers/ClearedRefreshCookie' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/SessionNotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/auth/password:
    put:
      tags: [Password]
      operationId: changePassword
      summary: Đổi password của account hiện tại
      description: >-
        Yêu cầu password hiện tại. Khi thành công, toàn bộ refresh session bị
        thu hồi; client cần login lại.
      security:
        - gatewayIdentity: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '204':
          description: Password đã được đổi và session đã bị thu hồi.
          headers:
            Set-Cookie: { $ref: '#/components/headers/ClearedRefreshCookie' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '422': { $ref: '#/components/responses/PasswordPolicyViolation' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/auth/password-reset-requests:
    post:
      tags: [Password]
      operationId: requestPasswordReset
      security: []
      summary: Yêu cầu email có opaque reset-token link
      description: >-
        Luôn trả cùng phản hồi thành công dù email có tồn tại hay không. Reset
        token là opaque, single-use, có TTL và không xuất hiện trong response. Mỗi
        account chỉ được yêu cầu 5 lần trong 15 phút; vượt ngân sách đó Auth không gửi
        nữa nhưng vẫn trả `202` (một `429` theo account sẽ lộ account tồn tại). `429`
        ở đây chỉ đến từ rate limit theo IP. Một yêu cầu mới thay thế link cũ.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailRequest' }
      responses:
        '202': { $ref: '#/components/responses/GenericAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/auth/password-resets:
    post:
      tags: [Password]
      operationId: completePasswordReset
      security: []
      summary: Đổi password bằng opaque reset token
      description: >-
        Reset token được nhận từ URL fragment phía frontend và gửi trong body
        HTTPS; token không được ghi log hoặc đưa vào URL của API request.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompletePasswordResetRequest' }
      responses:
        '204':
          description: Password đã được reset; user phải login lại.
          headers:
            Set-Cookie: { $ref: '#/components/headers/ClearedRefreshCookie' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/InvalidResetToken' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/auth/accounts/me/deletion-requests:
    post:
      tags: [Accounts]
      operationId: requestOwnAccountDeletion
      summary: Yêu cầu xóa account hiện tại theo GDPR
      description: >-
        Yêu cầu password hiện tại. Account được anonymize ngay, session bị thu
        hồi và bản ghi bị hard delete sau 90 ngày; không hỗ trợ restore.
      security:
        - gatewayIdentity: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CurrentPasswordRequest' }
      responses:
        '202':
          description: Yêu cầu xóa đã được chấp nhận.
          headers:
            Set-Cookie: { $ref: '#/components/headers/ClearedRefreshCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountDeletionAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '409': { $ref: '#/components/responses/AccountStateConflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/auth/admin/accounts/{account_id}/deletion-requests:
    post:
      tags: [Accounts]
      operationId: requestAdminAccountDeletion
      summary: Xóa account do quản trị viên yêu cầu
      description: >-
        Chỉ trusted Gateway identity có role `ADMIN` được gọi. Lý do xóa luôn là
        `ADMIN_DELETION`.
      security:
        - gatewayIdentity: []
          gatewayRoles: []
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '202':
          description: Yêu cầu xóa admin đã được chấp nhận.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountDeletionAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/AccountNotFound' }
        '409': { $ref: '#/components/responses/AccountStateConflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /.well-known/jwks.json:
    get:
      tags: [JWKS]
      operationId: getJwks
      security: []
      summary: Công bố public signing key hiện hành và phase-out key
      responses:
        '200':
          description: JSON Web Key Set; private key không bao giờ xuất hiện.
          headers:
            Cache-Control:
              description: Gateway có thể cache theo thời gian do Auth cấu hình.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Jwks' }
        '500': { $ref: '#/components/responses/InternalError' }

components:
  securitySchemes:
    gatewayIdentity:
      type: apiKey
      in: header
      name: X-User-Id
      description: >-
        Identity được API Gateway tin cậy inject sau khi verify access token.
        Không phải header do client public edge kiểm soát.
    gatewayRoles:
      type: apiKey
      in: header
      name: X-User-Roles
      description: >-
        Danh sách role do API Gateway inject. Auth yêu cầu `ADMIN` cho endpoint
        xóa account của quản trị viên.
    gatewayTokenJti:
      type: apiKey
      in: header
      name: X-Token-Jti
      description: >-
        JWT ID do API Gateway inject từ access token đã verify. Auth dùng header
        này để denylist access token hiện tại khi logout một session.
    refreshSession:
      type: apiKey
      in: cookie
      name: auth_refresh
      description: Opaque refresh token `HttpOnly; Secure; SameSite=Strict`.

  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema: { type: string, minLength: 8, maxLength: 128 }
    SessionId:
      name: session_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    AccountId:
      name: account_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      required: false
      description: Cursor opaque từ `next_cursor` của response trước.
      schema: { type: string, minLength: 1, maxLength: 256 }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }

  headers:
    NoStore:
      description: Response chứa credential không được browser/proxy cache.
      required: true
      schema: { type: string, const: no-store }
    RefreshCookie:
      description: >-
        auth_refresh=<opaque>; HttpOnly; Secure; SameSite=Strict;
        Path=/api/v1/auth/sessions; Max-Age=<configured>. Giá trị thật không
        được log, cache hoặc xuất hiện trong JSON response.
      required: true
      schema: { type: string }
    ClearedRefreshCookie:
      description: >-
        Xóa cookie `auth_refresh` của browser hiện tại bằng cùng Path,
        `HttpOnly; Secure; SameSite=Strict; Max-Age=0`.
      required: false
      schema: { type: string }

  schemas:
    Problem:
      $ref: '../../../shared/json-schema/v1/problem.schema.json'
    Email:
      type: string
      format: email
      minLength: 3
      maxLength: 254
    Password:
      type: string
      format: password
      minLength: 12
      maxLength: 128
      description: >-
        Hỗ trợ khoảng trắng và không ép tổ hợp ký tự; việc kiểm tra password
        phổ biến/đã lộ là trách nhiệm implementation.
    Otp:
      type: string
      pattern: '^[0-9]{6}$'
      description: OTP sáu chữ số, single-use và có TTL.
    RegistrationRequest:
      type: object
      additionalProperties: false
      required: [email, password, confirm_password]
      properties:
        email: { $ref: '#/components/schemas/Email' }
        password: { $ref: '#/components/schemas/Password' }
        confirm_password: { $ref: '#/components/schemas/Password' }
    RegistrationAccepted:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, const: PENDING_VERIFICATION }
    EmailRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { $ref: '#/components/schemas/Email' }
    EmailVerificationRequest:
      type: object
      additionalProperties: false
      required: [email, otp]
      properties:
        email: { $ref: '#/components/schemas/Email' }
        otp: { $ref: '#/components/schemas/Otp' }
    EmailChangeRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_email]
      properties:
        current_password: { $ref: '#/components/schemas/Password' }
        new_email: { $ref: '#/components/schemas/Email' }
    EmailChangeConfirmationRequest:
      type: object
      additionalProperties: false
      required: [new_email, otp]
      properties:
        new_email: { $ref: '#/components/schemas/Email' }
        otp: { $ref: '#/components/schemas/Otp' }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { $ref: '#/components/schemas/Email' }
        password: { $ref: '#/components/schemas/Password' }
        device_name: { type: string, minLength: 1, maxLength: 200 }
    AccessTokenResponse:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_in, session_id]
      properties:
        access_token: { type: string, minLength: 1 }
        token_type: { type: string, const: Bearer }
        expires_in: { type: integer, minimum: 1 }
        session_id:
          type: string
          format: uuid
          description: '`family_id` ổn định của session, không phải refresh-token row ID.'
    Session:
      type: object
      additionalProperties: false
      required: [id, created_at, last_used_at, expires_at]
      properties:
        id:
          type: string
          format: uuid
          description: '`family_id` ổn định của session.'
        device_name: { type: string, maxLength: 200 }
        ip_address:
          type: string
          minLength: 1
          maxLength: 45
          description: IPv4 hoặc IPv6 được ghi nhận khi session được tạo.
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
    SessionList:
      type: object
      additionalProperties: false
      required: [sessions]
      properties:
        sessions:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/Session' }
        next_cursor:
          type: string
          minLength: 1
          maxLength: 256
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_password, confirm_password]
      properties:
        current_password: { $ref: '#/components/schemas/Password' }
        new_password: { $ref: '#/components/schemas/Password' }
        confirm_password: { $ref: '#/components/schemas/Password' }
    CompletePasswordResetRequest:
      type: object
      additionalProperties: false
      required: [reset_token, new_password, confirm_password]
      properties:
        reset_token:
          type: string
          minLength: 43
          maxLength: 128
          writeOnly: true
        new_password: { $ref: '#/components/schemas/Password' }
        confirm_password: { $ref: '#/components/schemas/Password' }
    CurrentPasswordRequest:
      type: object
      additionalProperties: false
      required: [current_password]
      properties:
        current_password: { $ref: '#/components/schemas/Password' }
    AccountDeletionAccepted:
      type: object
      additionalProperties: false
      required: [status, hard_delete_after]
      properties:
        status: { type: string, const: DELETED }
        hard_delete_after: { type: string, format: date-time }
    Jwk:
      type: object
      additionalProperties: false
      required: [kty, kid, use, alg, n, e]
      properties:
        kty: { type: string, const: RSA }
        kid: { type: string, format: uuid }
        use: { type: string, const: sig }
        alg: { type: string, const: RS256 }
        n: { type: string, minLength: 1 }
        e: { type: string, minLength: 1 }
    Jwks:
      type: object
      additionalProperties: false
      required: [keys]
      properties:
        keys:
          type: array
          minItems: 1
          maxItems: 10
          items: { $ref: '#/components/schemas/Jwk' }

  responses:
    GenericAccepted:
      description: Yêu cầu đã được chấp nhận mà không tiết lộ account có tồn tại.
    BadRequest:
      description: Request không hợp lệ.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Thiếu hoặc không hợp lệ trusted Gateway identity.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    InvalidCredentials:
      description: Email hoặc password không hợp lệ.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    InvalidRefreshToken:
      description: Refresh token không hợp lệ, hết hạn hoặc đã bị thu hồi.
      headers:
        Set-Cookie: { $ref: '#/components/headers/ClearedRefreshCookie' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    AccountNotVerified:
      description: Account chưa xác minh email.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    AccountLocked:
      description: Account đang bị lock tạm thời.
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Trusted identity không có quyền `ADMIN`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    EmailAlreadyRegistered:
      description: Email đã được đăng ký.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    AccountStateConflict:
      description: >-
        Account đang ở trạng thái không cho phép thao tác (`ACCOUNT_NOT_ACTIVE`),
        gồm cả yêu cầu xóa account đã bị xóa.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    SessionNotFound:
      description: Session không tồn tại hoặc không thuộc account hiện tại.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    AccountNotFound:
      description: Account không tồn tại.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    InvalidOtp:
      description: OTP không hợp lệ, hết hạn hoặc đã dùng.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    InvalidResetToken:
      description: Reset token không hợp lệ, hết hạn hoặc đã dùng.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PasswordPolicyViolation:
      description: Password mới không đạt chính sách bảo mật.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RateLimited:
      description: Vượt rate limit.
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    InternalError:
      description: >-
        Lỗi không mong đợi (`INTERNAL_ERROR`), hoặc lỗi retryable: `DEPENDENCY_UNAVAILABLE`
        khi Redis không trả lời (Auth fail closed; contract chưa định nghĩa `503`) và
        `CONCURRENT_UPDATE` khi account bị ghi đè liên tục. Với đổi mật khẩu, đổi email
        và xóa account, thay đổi đã commit trước khi lỗi Redis xảy ra; event vẫn được phát
        và client có thể gọi `DELETE /api/v1/auth/sessions` để ghi lại mốc thu hồi.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
