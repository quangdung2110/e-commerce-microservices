openapi: 3.1.0
info:
  title: Inventory Warehouse Administration API
  version: 1.1.0
  description: >-
    Target ADMIN contract for warehouse master data, physical stock operations and
    read-only operational queues. Every accepted mutation atomically persists state,
    immutable evidence, command outcome, successful operation identity, and required
    outbox events. Routed by the gateway at /api/v1/admin/inventory with role ADMIN;
    MFA is a production release gate (Inventory ADR-024).
x-adoption-status: implemented
x-required-role: ADMIN
x-mfa-required: production-gate
servers:
  - url: http://inventory-service:8080
    description: ADMIN service endpoint behind the trusted gateway
security: [{ adminIdentity: [] }]
tags:
  - name: Warehouses
  - name: Sellable stock
  - name: Dispatch
  - name: Returns
  - name: Quarantine
paths:
  /api/v1/admin/inventory/warehouses:
    get:
      tags: [Warehouses]
      operationId: listWarehouses
      summary: List warehouses
      parameters:
        - { name: is_active, in: query, required: false, schema: { type: boolean } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses: { '200': { description: Warehouse page., content: { application/json: { schema: { $ref: '#/components/schemas/WarehousePage' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '503': { $ref: '#/components/responses/Unavailable' } }
    post:
      tags: [Warehouses]
      operationId: createWarehouse
      summary: Create an Inventory-owned warehouse
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CorrelationId' }, { $ref: '#/components/parameters/CausationId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateWarehouseRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/WarehouseSuccess' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' }, '503': { $ref: '#/components/responses/Unavailable' } }

  /api/v1/admin/inventory/warehouses/{warehouse_id}:
    get:
      tags: [Warehouses]
      operationId: getWarehouse
      summary: Read warehouse master data
      parameters: [{ $ref: '#/components/parameters/WarehouseId' }]
      responses: { '200': { description: Warehouse., content: { application/json: { schema: { $ref: '#/components/schemas/Warehouse' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '503': { $ref: '#/components/responses/Unavailable' } }
    patch:
      tags: [Warehouses]
      operationId: updateWarehouse
      summary: Update name, address or new-allocation eligibility
      description: >-
        Requires expected_revision equal to the current warehouse revision; otherwise durable
        409 WAREHOUSE_CONFLICT (Inventory ADR-027). Status changes never release, reroute, or
        rewrite existing commitments.
      parameters: [{ $ref: '#/components/parameters/WarehouseId' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CorrelationId' }, { $ref: '#/components/parameters/CausationId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateWarehouseRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/WarehouseSuccess' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' }, '503': { $ref: '#/components/responses/Unavailable' } }

  /api/v1/admin/inventory/stock-receipts:
    post:
      tags: [Sellable stock]
      operationId: recordSellableStockReceipt
      summary: Record initial or supplier stock as sellable
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CorrelationId' }, { $ref: '#/components/parameters/CausationId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/StockReceiptRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/StockMutationSuccess' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' }, '503': { $ref: '#/components/responses/Unavailable' } }

  /api/v1/admin/inventory/stock-adjustments:
    post:
      tags: [Sellable stock]
      operationId: recordStockAdjustment
      summary: Apply an audited sellable-stock adjustment
      description: A negative adjustment can remove only available_to_sell units.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CorrelationId' }, { $ref: '#/components/parameters/CausationId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/StockAdjustmentRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/StockMutationSuccess' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' }, '503': { $ref: '#/components/responses/Unavailable' } }

  /api/v1/admin/inventory/stock-movements/{movement_id}/reversals:
    post:
      tags: [Sellable stock]
      operationId: reverseSellableStockMovement
      summary: Append a compensating movement for an eligible receipt or adjustment
      description: >-
        Target must be a successful sellable receipt or adjustment. reversal_sequence is
        1..n per original movement and the cumulative reversed quantity cannot exceed the
        original quantity (409 MOVEMENT_NOT_REVERSIBLE). The sequence is contiguous (next value =
        accepted reversals + 1) and a reversal movement is not itself reversible. Reversing an increase requires
        quantity <= available_to_sell (409 INSUFFICIENT_SELLABLE_STOCK); reversing a
        decrease adds back to sellable.
      parameters: [{ $ref: '#/components/parameters/MovementId' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CorrelationId' }, { $ref: '#/components/parameters/CausationId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MovementReversalRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/StockMutationSuccess' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' }, '503': { $ref: '#/components/responses/Unavailable' } }

  /api/v1/admin/inventory/physical-dispatches:
    post:
      tags: [Dispatch]
      operationId: recordPhysicalDispatch
      summary: Record that a committed allocation physically left its warehouse
      description: >-
        This is the sale-flow operation that reduces on_hand and committed. It records
        an entire line: quantity must equal the immutable ReservationLine quantity at its
        allocated warehouse and SKU while the line is COMMITTED; otherwise durable 409
        DISPATCH_NOT_ALLOWED. Partial-line dispatch does not exist.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CorrelationId' }, { $ref: '#/components/parameters/CausationId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PhysicalDispatchRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/StockMutationSuccess' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' }, '503': { $ref: '#/components/responses/Unavailable' } }

  /api/v1/admin/inventory/return-receipts:
    post:
      tags: [Returns]
      operationId: recordReturnReceipt
      summary: Receive an exact Refund Scope line into quarantine
      description: >-
        (return_receipt_id, return_receipt_line_id) is globally unique. Unknown scope/line,
        SKU mismatch or over-receipt is 409 RETURN_RECEIPT_REJECTED; a terminal or
        INSPECTION_COMPLETED scope is 409 REFUND_SCOPE_STATE_CONFLICT; an unknown warehouse is
        409 WAREHOUSE_NOT_FOUND.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CorrelationId' }, { $ref: '#/components/parameters/CausationId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReturnReceiptRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/StockMutationSuccess' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' }, '503': { $ref: '#/components/responses/Unavailable' } }

  /api/v1/admin/inventory/inspections:
    post:
      tags: [Returns]
      operationId: recordFinalInspection
      summary: Record a final PASS or FAIL for received quantity
      description: >-
        PASS moves quarantine to sellable. FAIL remains quarantined and cannot later become PASS.
        inspection_id is globally unique; the receipt line is addressed by its globally unique
        (return_receipt_id, return_receipt_line_id) and may be consumed by several inspections.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CorrelationId' }, { $ref: '#/components/parameters/CausationId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/InspectionRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/StockMutationSuccess' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' }, '503': { $ref: '#/components/responses/Unavailable' } }

  /api/v1/admin/inventory/quarantine-dispositions:
    post:
      tags: [Quarantine]
      operationId: recordQuarantineDisposition
      summary: Hold or physically remove failed-inspection stock
      description: >-
        HOLD is a non-terminal annotation with no bucket movement; the quantity stays
        eligible for a later DISPOSE or RETURN_TO_SUPPLIER. Only those two consume
        failed, undisposed quantity and require physical departure evidence.
        (disposition_id, disposition_line_id) is globally unique.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CorrelationId' }, { $ref: '#/components/parameters/CausationId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/QuarantineDispositionRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/StockMutationSuccess' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { $ref: '#/components/responses/Conflict' }, '503': { $ref: '#/components/responses/Unavailable' } }

  /api/v1/admin/inventory/quarantine-dispositions/{disposition_id}/reversals:
    post:
      tags: [Quarantine]
      operationId: reverseQuarantineDisposition
      summary: Restore physically returned stock to quarantine only
      description: >-
        Only for a DISPOSE or RETURN_TO_SUPPLIER disposition line, selected by the path
        disposition_id plus body disposition_line_id, whose units are verified physically
        back at the same warehouse; restores quarantine, never sellable. reversal_sequence
        is contiguous per disposition line and the cumulative quantity cannot exceed the
        disposed quantity (409 DISPOSITION_REJECTED).
      parameters: [{ $ref: '#/components/parameters/DispositionId' }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CorrelationId' }, { $ref: '#/components/parameters/CausationId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DispositionReversalRequest' } } } }
      responses: { '200': { $ref: '#/components/responses/StockMutationSuccess' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' }, '503': { $ref: '#/components/responses/Unavailable' } }

  /api/v1/admin/inventory/stock-positions:
    get:
      tags: [Sellable stock]
      operationId: listStockPositions
      summary: List stock positions
      description: >-
        Every position, ordered by (warehouse_id, sku_id). warehouse_id and sku_id are optional
        filters that only narrow the result; omitting both is valid.
      parameters:
        - { name: warehouse_id, in: query, required: false, schema: { $ref: '#/components/schemas/OpaqueId' } }
        - { name: sku_id, in: query, required: false, schema: { $ref: '#/components/schemas/OpaqueId' } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses: { '200': { description: Stock position page., content: { application/json: { schema: { $ref: '#/components/schemas/StockPositionPage' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '503': { $ref: '#/components/responses/Unavailable' } }

  /api/v1/admin/inventory/stock-movements:
    get:
      tags: [Sellable stock]
      operationId: listStockMovements
      summary: Search immutable movement evidence
      description: >-
        Every movement, newest first. warehouse_id, sku_id, source_operation_type and the
        recorded_from/recorded_to window are optional filters that only narrow the result;
        omitting all of them is valid.
      parameters:
        - { name: warehouse_id, in: query, required: false, schema: { $ref: '#/components/schemas/OpaqueId' } }
        - { name: sku_id, in: query, required: false, schema: { $ref: '#/components/schemas/OpaqueId' } }
        - { name: source_operation_type, in: query, required: false, description: 'Exact movement source, for example SELLABLE_RECEIPT for stock receipts or RETURN_RECEIPT for returned goods.', schema: { type: string, minLength: 1, maxLength: 64 } }
        - { name: recorded_from, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: recorded_to, in: query, required: false, schema: { type: string, format: date-time } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses: { '200': { description: Movement page., content: { application/json: { schema: { $ref: '#/components/schemas/StockMovementPage' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '503': { $ref: '#/components/responses/Unavailable' } }

  /api/v1/admin/inventory/dispatch-queue:
    get:
      tags: [Dispatch]
      operationId: listDispatchQueue
      summary: List committed, undispatched lines
      description: Oldest commit first. Covers every warehouse; warehouse_id optionally narrows to one.
      parameters:
        - { name: warehouse_id, in: query, required: false, schema: { $ref: '#/components/schemas/OpaqueId' } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses: { '200': { description: Dispatch queue page., content: { application/json: { schema: { $ref: '#/components/schemas/DispatchQueuePage' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '503': { $ref: '#/components/responses/Unavailable' } }

  /api/v1/admin/inventory/inspection-queue:
    get:
      tags: [Returns]
      operationId: listInspectionQueue
      summary: List return receipt lines with uninspected quantity
      description: Oldest receipt first. Covers every warehouse; warehouse_id optionally narrows to one.
      parameters:
        - { name: warehouse_id, in: query, required: false, schema: { $ref: '#/components/schemas/OpaqueId' } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses: { '200': { description: Inspection queue page., content: { application/json: { schema: { $ref: '#/components/schemas/InspectionQueuePage' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '503': { $ref: '#/components/responses/Unavailable' } }

  /api/v1/admin/inventory/quarantine-items:
    get:
      tags: [Quarantine]
      operationId: listQuarantineItems
      summary: List failed-inspection quantity not yet disposed out
      description: Oldest inspection first. Covers every warehouse; warehouse_id optionally narrows to one.
      parameters:
        - { name: warehouse_id, in: query, required: false, schema: { $ref: '#/components/schemas/OpaqueId' } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses: { '200': { description: Quarantine item page., content: { application/json: { schema: { $ref: '#/components/schemas/QuarantineItemPage' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '503': { $ref: '#/components/responses/Unavailable' } }

  /api/v1/admin/inventory/refund-scope-summaries:
    get:
      tags: [Returns]
      operationId: listAdminRefundScopes
      summary: List Refund Scopes (return requests)
      description: >-
        Every registered Refund Scope, newest registration first. state optionally narrows the
        result. Use the scope identifier with getAdminRefundScope for per-line quantities.
      parameters:
        - { name: state, in: query, required: false, schema: { enum: [REGISTERED, IN_PROGRESS, INSPECTION_COMPLETED, CANCELLED, CLOSED, CLOSED_INCOMPLETE] } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses: { '200': { description: Refund Scope summary page., content: { application/json: { schema: { $ref: '#/components/schemas/AdminRefundScopeSummaryPage' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '503': { $ref: '#/components/responses/Unavailable' } }

  /api/v1/admin/inventory/refund-scopes:
    get:
      tags: [Returns]
      operationId: findAdminRefundScopeByOrder
      summary: Resolve the lifetime Refund Scope of an order
      parameters:
        - { name: order_id, in: query, required: true, schema: { $ref: '#/components/schemas/OpaqueId' } }
      responses: { '200': { description: Refund Scope operational view., content: { application/json: { schema: { $ref: '#/components/schemas/AdminRefundScope' } } } }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '503': { $ref: '#/components/responses/Unavailable' } }

  /api/v1/admin/inventory/stock-positions/{warehouse_id}/{sku_id}:
    get:
      tags: [Sellable stock]
      operationId: getStockPosition
      summary: Read all authoritative buckets for warehouse operations
      parameters: [{ $ref: '#/components/parameters/WarehouseId' }, { $ref: '#/components/parameters/SkuId' }]
      responses: { '200': { description: Stock position., content: { application/json: { schema: { $ref: '#/components/schemas/StockPosition' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '503': { $ref: '#/components/responses/Unavailable' } }

  /api/v1/admin/inventory/stock-movements/{movement_id}:
    get:
      tags: [Sellable stock]
      operationId: getStockMovement
      summary: Read immutable movement evidence
      parameters: [{ $ref: '#/components/parameters/MovementId' }]
      responses: { '200': { description: Movement evidence., content: { application/json: { schema: { $ref: '#/components/schemas/StockMovement' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '503': { $ref: '#/components/responses/Unavailable' } }

  /api/v1/admin/inventory/commands/{command_id}:
    get:
      tags: [Sellable stock]
      operationId: getAdminCommandOutcome
      summary: Read a durable ADMIN command outcome
      parameters: [{ $ref: '#/components/parameters/CommandId' }]
      responses: { '200': { description: Command outcome., content: { application/json: { schema: { $ref: '#/components/schemas/AdminCommandOutcome' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '503': { $ref: '#/components/responses/Unavailable' } }

  /api/v1/admin/inventory/reservations/{order_id}:
    get:
      tags: [Dispatch]
      operationId: getAdminReservationFact
      summary: Read allocation facts needed for warehouse operations
      parameters: [{ $ref: '#/components/parameters/OrderId' }]
      responses: { '200': { description: Reservation operational view., content: { application/json: { schema: { $ref: '#/components/schemas/AdminReservation' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '503': { $ref: '#/components/responses/Unavailable' } }

  /api/v1/admin/inventory/refund-scopes/{refund_scope_id}:
    get:
      tags: [Returns]
      operationId: getAdminRefundScopeFact
      summary: Read immutable expected-return and inspection progress
      parameters: [{ $ref: '#/components/parameters/RefundScopeId' }]
      responses: { '200': { description: Refund Scope operational view., content: { application/json: { schema: { $ref: '#/components/schemas/AdminRefundScope' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '503': { $ref: '#/components/responses/Unavailable' } }

components:
  securitySchemes:
    adminIdentity:
      type: apiKey
      in: header
      name: X-User-Id
      description: >-
        Trusted interactive identity injected by the API Gateway after JWT verification,
        with X-User-Roles containing ADMIN and X-User-Session-Id recorded in audit. The
        Gateway strips client-supplied identity headers. There is no non-interactive
        ADMIN principal. MFA is a production release gate that requires an Auth/gateway
        MFA assertion (Inventory ADR-024).
  parameters:
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, description: Caller-scoped command ID retained with its fingerprint and result for at least seven years., schema: { type: string, minLength: 16, maxLength: 128 } }
    CorrelationId: { name: X-Correlation-ID, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 128 } }
    CausationId: { name: X-Causation-ID, in: header, required: true, description: For an initial ADMIN command use the command ID., schema: { type: string, minLength: 8, maxLength: 128 } }
    WarehouseId: { name: warehouse_id, in: path, required: true, schema: { $ref: '#/components/schemas/OpaqueId' } }
    SkuId: { name: sku_id, in: path, required: true, schema: { $ref: '#/components/schemas/OpaqueId' } }
    MovementId: { name: movement_id, in: path, required: true, schema: { $ref: '#/components/schemas/OpaqueId' } }
    DispositionId: { name: disposition_id, in: path, required: true, schema: { $ref: '#/components/schemas/OpaqueId' } }
    CommandId: { name: command_id, in: path, required: true, schema: { $ref: '#/components/schemas/OpaqueId' } }
    OrderId: { name: order_id, in: path, required: true, schema: { $ref: '#/components/schemas/OpaqueId' } }
    RefundScopeId: { name: refund_scope_id, in: path, required: true, schema: { $ref: '#/components/schemas/OpaqueId' } }
    Cursor: { name: cursor, in: query, required: false, description: Opaque cursor from the previous page., schema: { type: string, minLength: 1, maxLength: 512 } }
    Limit: { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
  schemas:
    OpaqueId: { type: string, minLength: 1, maxLength: 128 }
    Quantity: { type: integer, format: int64, minimum: 1 }
    EvidenceReference: { type: string, minLength: 1, maxLength: 512 }
    Address:
      type: object
      additionalProperties: false
