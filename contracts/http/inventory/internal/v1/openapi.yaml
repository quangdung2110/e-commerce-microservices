openapi: 3.1.0
info:
  title: Inventory Internal Stock Snapshot Export API
  version: 1.0.0
  description: >-
    Contract đích cho Search bootstrap/recovery. Chỉ service identity được gọi;
    endpoint không expose qua API Gateway.
x-adoption-status: proposed
servers:
  - url: http://inventory-service:8080
    description: Internal cluster endpoint
paths:
  /internal/v1/inventory/stock-snapshots:
    get:
      operationId: exportStockSnapshots
      summary: Keyset export stock snapshot per-SKU
      security: [{ serviceIdentity: [] }]
      parameters:
        - name: after_sku_id
          in: query
          required: false
          schema: { type: string, maxLength: 64 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 1000, default: 500 }
      responses:
        '200':
          description: >-
            Trang ổn định theo sku_id. replay_from_offsets được chụp trước khi export
            bắt đầu; Search replay từ các offset này sau import và dùng stock_revision
            để bỏ state cũ/trùng.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, next_after_sku_id, replay_from_offsets]
                properties:
                  items:
                    type: array
                    maxItems: 1000
                    items: { $ref: '#/components/schemas/StockSnapshot' }
                  next_after_sku_id:
                    type: [string, 'null']
                    maxLength: 64
                  replay_from_offsets:
                    type: array
                    description: Kafka offsets của t.inventory.stock.events.v1, chỉ trả ở trang đầu và lặp lại không đổi trong các trang sau.
                    items: { $ref: '#/components/schemas/ReplayOffset' }
        '401': { description: Missing or invalid service identity. }
        '403': { description: Caller is not authorized to export inventory snapshots. }
        '503': { description: Inventory cannot create a consistent export session. }
components:
  securitySchemes:
    serviceIdentity:
      type: http
      scheme: bearer
      bearerFormat: internal-service-identity
  schemas:
    StockSnapshot:
      type: object
      additionalProperties: false
      required: [product_id, sku_id, available_quantity, stock_revision, observed_at]
      properties:
        product_id: { type: string, minLength: 1, maxLength: 64 }
        sku_id: { type: string, minLength: 1, maxLength: 64 }
        available_quantity: { type: integer, minimum: 0 }
        stock_revision: { type: integer, minimum: 1 }
        observed_at: { type: string, format: date-time }
    ReplayOffset:
      type: object
      additionalProperties: false
      required: [topic, partition, offset]
      properties:
        topic: { const: t.inventory.stock.events.v1 }
        partition: { type: integer, minimum: 0 }
        offset: { type: integer, minimum: 0 }
