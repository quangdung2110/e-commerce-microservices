syntax = "proto3";

package ecommerce.product.v1;

option go_package = "github.com/ecommerce/contracts/gen/go/ecommerce/product/v1;productv1";
option java_multiple_files = true;
option java_package = "com.ecommerce.contracts.product.v1";

import "ecommerce/common/v1/money.proto";
import "google/protobuf/timestamp.proto";

// ProductService owns the product/SKU read capability consumed by Cart.
service ProductService {
  // Recommended deadline: 500 ms. Safe to retry within the caller retry budget.
  rpc GetSku(GetSkuRequest) returns (GetSkuResponse);

  // Maximum 100 unique sku_ids. Recommended deadline: 1 second.
  // Safe to retry within the caller retry budget.
  rpc GetBatchSkus(GetBatchSkusRequest) returns (GetBatchSkusResponse);
}

message GetSkuRequest {
  string sku_id = 1;
}

message GetSkuResponse {
  oneof result {
    Sku sku = 1;
    SkuNotFound not_found = 2;
    SkuUnavailable unavailable = 3;
  }
}

message GetBatchSkusRequest {
  // Caller removes duplicates. Provider rejects more than 100 IDs.
  repeated string sku_ids = 1;
}

message GetBatchSkusResponse {
  map<string, Sku> skus = 1;
  repeated string not_found_sku_ids = 2;
  repeated string unavailable_sku_ids = 3;
}

message Sku {
  string sku_id = 1;
  string product_id = 2;
  string product_name = 3;
  map<string, string> variant_attributes = 4;
  string image_url = 5;
  ecommerce.common.v1.Money price = 6;
  SkuStatus status = 7;
  int64 available_quantity = 8;
  google.protobuf.Timestamp updated_at = 9;
}

enum SkuStatus {
  SKU_STATUS_UNSPECIFIED = 0;
  SKU_STATUS_ACTIVE = 1;
  SKU_STATUS_OUT_OF_STOCK = 2;
  SKU_STATUS_INACTIVE = 3;
}

message SkuNotFound {
  string sku_id = 1;
}

message SkuUnavailable {
  string sku_id = 1;
  SkuUnavailableReason reason = 2;
}

enum SkuUnavailableReason {
  SKU_UNAVAILABLE_REASON_UNSPECIFIED = 0;
  SKU_UNAVAILABLE_REASON_INACTIVE = 1;
  SKU_UNAVAILABLE_REASON_DELETED = 2;
  SKU_UNAVAILABLE_REASON_OUT_OF_STOCK = 3;
}
