version: 1

# status: legacy_documented | proposed | implemented | verified
interactions:
  - id: cart-queries-product-skus
    protocol: grpc
    provider: product-service
    consumers: [cart-service]
    contract: grpc/ecommerce/product/v1/product_service.proto
    status: proposed
    notes: Canonical replacement for duplicated Product/Cart proto files.

  - id: storefront-queries-search
    protocol: http
    provider: search-service
    consumers: [api-gateway]
    contract: http/search/v2/openapi.yaml
    status: proposed
    notes: >-
      Bốn API storefront anonymous cộng hai operation admin reindex. Một hit là một SKU;
      facet và category count đếm DISTINCT product_id. V1 legacy đã bị gỡ khỏi Search nên
      route /api/v1/search/** không còn backend.

  - id: search-reindexes-product-catalog
    protocol: http
    provider: product-service
    consumers: [search-service]
    contract: http/product/v1/openapi.yaml
    status: proposed
    notes: Internal mTLS Product/Category export and Product snapshot API for Search reindex; catalog event consumer must also run during export.

  - id: storefront-queries-product-detail
    protocol: http
    provider: product-detail-bff
    consumers: [api-gateway]
    contract: http/product-detail-bff/v1/openapi.yaml
    status: proposed
    notes: >-
      Buyer PDP API composes Product catalog and optional Review summary/preview.
      Its direct Inventory availability projection is not covered by Inventory v1;
      adding it requires a separate registered-consumer contract review.

  - id: product-detail-bff-queries-product-catalog
    protocol: http
    provider: product-service
    consumers: [product-detail-bff]
    contract: http/product/v1/openapi.yaml
    status: proposed
    notes: Internal mTLS buyer-read by slug; Product returns catalog/price only and never stock.

  - id: product-detail-bff-queries-review-summary
    protocol: http
    provider: review-service
    consumers: [product-detail-bff]
    contract: http/review/internal/v1/openapi.yaml
    status: proposed
    notes: >-
      Internal service-identity PDP read after Product resolves product_id. Review
      remains source of truth; timeout degrades only the Review section and never
      becomes aggregate zero.

  - id: product-publishes-catalog-events
    protocol: kafka
    provider: product-service
    consumers: [search-service, promotion-service]
    contract: events/product/v1/asyncapi.yaml
    status: proposed
    notes: Product outbox emits CloudEvents SKU/category snapshots, tombstones and Category-tree reindex control. Inventory must consume tombstones or enforce an equivalent reserve guard.

  - id: promotion-publishes-product-markdown-snapshots
    protocol: kafka
    provider: promotion-service
    consumers: [product-service]
    contract: events/product/v1/asyncapi.yaml
    status: proposed
    notes: Product-scope markdown state snapshots use product_id key and source_revision; legacy category-scoped MARKDOWN_* events are not the target contract.

  - id: cart-publishes-cart-events
    protocol: kafka
    provider: cart-service
    consumers: [cart-service, analytics-service, notification-service]
    contract: events/cart/v1/asyncapi.yaml
    status: proposed
    notes: Pilot contains CART_ITEM_ADDED only; more event types migrate incrementally.

  - id: auth-publishes-identity-events
    protocol: kafka
    provider: auth-service
    consumers: [user-service, notification-service, review-service, chat-service]
    contract: events/auth/v1/asyncapi.yaml
    status: proposed
    notes: USER_VERIFIED_SUCCESS chỉ cho User; USER_DELETED được Auth phát trực tiếp cho User, Notification, Review và Chat trên t.auth.events. CloudEvents v1 là target contract.

  - id: user-publishes-profile-preference-events
    protocol: kafka
    provider: user-service
    consumers: [chat-service, notification-service]
    contract: events/user/v1/asyncapi.yaml
    status: proposed
    notes: USER_PROFILE_UPDATED cho Chat và USER_PREFERENCES_UPDATED cho Notification; không republish USER_DELETED.

  - id: auth-requests-security-notifications
    protocol: kafka
    provider: auth-service
    consumers: [notification-service]
    contract: events/auth/v1/asyncapi.yaml
    status: proposed
    notes: Notification event chỉ có delivery_id; không mang email, OTP hoặc reset token.

  - id: notification-resolves-auth-delivery-content
    protocol: http
    provider: auth-service
    consumers: [notification-service]
    contract: http/auth/internal/v1/openapi.yaml
    status: proposed
    notes: Internal mTLS API để resolve PII/secret theo delivery_id, không qua public Gateway.

  - id: gateway-verifies-auth-tokens
    protocol: http
    provider: auth-service
    consumers: [api-gateway]
    contract: http/auth/v1/openapi.yaml
    status: implemented
    notes: >-
      Gateway đọc JWKS tại /.well-known/jwks.json rồi verify access token ở edge.
      Claim set, ánh xạ claim sang identity header, key Redis auth:revocation:*
      và payload invalidation được chốt tại docs/gateway/runtime-contract.md mục
      6 và 6.1. Đây là contract duy nhất cho identity header; không service nào
      được tự định nghĩa lại tên claim hay tên key.

  - id: auth-signals-jwks-rotation
    protocol: redis-pubsub
    provider: auth-service
    consumers: [api-gateway]
    contract: null
    status: implemented
    notes: >-
      Channel auth:jwks:update mang JSON {"type","kid","timestamp"}. Chỉ là tối
      ưu hóa: gateway vẫn phải refresh khi gặp kid lạ hoặc khi cache hết TTL, nên
      mất tín hiệu chỉ làm chậm rotation chứ không phá verification.

  - id: order-paid-clears-cart
    protocol: kafka
    provider: order-service
    consumers: [cart-service]
    contract: null
    status: legacy_documented
    notes: Currently described in docs/cart/interfaces.md.

  - id: checkout-creates-order
    protocol: http
    provider: order-service
    consumers: [checkout-service]
    contract: null
    status: legacy_documented

  - id: order-initiates-payment
    protocol: http
    provider: payment-service
    consumers: [order-service]
    contract: null
    status: legacy_documented

  - id: payment-publishes-payment-events
    protocol: kafka
    provider: payment-service
    consumers: [order-service]
    contract: null
    status: legacy_documented

  - id: checkout-previews-inventory-allocation
    protocol: http
    provider: inventory-service
    consumers: [checkout-service]
    contract: http/inventory/workflow/v1/openapi.yaml
    status: proposed
    notes: Preview is advisory, creates no hold, and returns ALLOCATABLE or REJECT_ALL.

  - id: order-commands-inventory-workflow
    protocol: http
    provider: inventory-service
    consumers: [order-service]
    contract: http/inventory/workflow/v1/openapi.yaml
    status: proposed
    notes: >-
      Order Temporal Saga exclusively owns Reserve/Commit/Release and Refund Scope
      decisions; commands are durable and idempotent by caller namespace plus key.

  - id: warehouse-admin-operates-inventory
    protocol: http
    provider: inventory-service
    consumers: [api-gateway]
    contract: http/inventory/admin/v1/openapi.yaml
    status: proposed
    notes: ADMIN-with-MFA warehouse master, physical movement, return, inspection, and disposition contract.

  - id: checkout-calculates-promotions
    protocol: http
    provider: promotion-service
    consumers: [checkout-service]
    contract: null
    status: legacy_documented

  - id: inventory-publishes-public-facts
    protocol: kafka
    provider: inventory-service
    consumers: [search-service, order-service]
    contract: events/inventory/v1/asyncapi.yaml
    status: proposed
    notes: >-
      Search consumes one Inventory-owned per-SKU availability snapshot only after
      Search has registered Product-document readiness; Order consumes
      reservation, physical-dispatch, and refund-inspection facts. Delivery is
      at-least-once with a 30-day minimum replay window.

  - id: search-exports-inventory-availability
    protocol: http
    provider: inventory-service
    consumers: [search-service]
    contract: http/inventory/exports/v1/openapi.yaml
    status: proposed
    notes: >-
      Idempotent Product-document readiness register/revoke plus fixed-watermark
      per-SKU availability snapshot and ordered change feed. Inventory does not expose
      warehouse/position projection facts to Search.

  - id: gateway-routes-review-api
    protocol: http
    provider: review-service
    consumers: [api-gateway]
    contract: null
    status: proposed
    notes: >-
      Public list/pagination and all Review commands (create, edit, media, report,
      reply, moderation, takedown) route directly to Review Service, never through
      Product Detail BFF. Machine-readable public OpenAPI is still a known gap.

  - id: review-publishes-rating-aggregate-events
    protocol: kafka
    provider: review-service
    consumers: [search-service]
    contract: events/review/v1/asyncapi.yaml
    status: proposed
    notes: >-
      Review phát rating aggregate snapshot theo product_id, guarded bằng
      review_revision. Search VNext chỉ consume event metrics này, không consume
      review business event để tính lại aggregate.

  - id: search-reindexes-review-rating-aggregates
    protocol: http
    provider: review-service
    consumers: [search-service]
    contract: http/review/internal/v1/openapi.yaml
    status: proposed
    notes: >-
      Internal service-identity export cho full reindex. Response chụp Review Kafka
      replay offsets trước scan; Search import snapshot rồi replay inclusive từ offset.
