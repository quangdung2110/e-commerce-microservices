services:
  order-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: order_dispatch_bench
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: bench
    ports:
      - "127.0.0.1:${ORDER_BENCH_DB_PORT:-25432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bench -d order_dispatch_bench"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - order-data:/var/lib/postgresql/data
  temporal-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - temporal-data:/var/lib/postgresql/data
  temporal:
    image: temporalio/auto-setup:1.25.2
    depends_on:
      temporal-db:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-db
    ports:
      - "127.0.0.1:${ORDER_BENCH_TEMPORAL_PORT:-27233}:7233"
    healthcheck:
      test: ["CMD-SHELL", "tctl --address temporal:7233 cluster health | grep -q SERVING"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 20s
volumes:
  order-data:
  temporal-data:
