# Common Module Configuration Template
# Copy these properties to each service's application.properties

# ============================================
# Kafka Configuration (Event Streaming)
# ============================================
kafka.bootstrap-servers=localhost:9092
kafka.consumer.group-id=${spring.application.name}-group
kafka.consumer.auto-offset-reset=earliest
kafka.consumer.enable-auto-commit=false
kafka.consumer.concurrency=3

# ============================================
# RabbitMQ Configuration (Task Queue)
# ============================================
rabbitmq.enabled=true
rabbitmq.host=localhost
rabbitmq.port=5672
rabbitmq.username=guest
rabbitmq.password=guest
rabbitmq.virtual-host=/

# ============================================
# Redis Configuration (Cache & Session)
# ============================================
redis.enabled=true
redis.host=localhost
redis.port=6379
redis.database=0
redis.cache-ttl.cart=7200
redis.cache-ttl.promotion=300
redis.cache-ttl.promo-validation=60
redis.cache-ttl.session=1800
redis.cache-ttl.idempotency-key=86400

# ============================================
# Temporal Configuration (Saga Orchestration)
# ============================================
temporal.enabled=true
temporal.host=localhost
temporal.port=7233
temporal.namespace=default
temporal.worker.task-queue=order-saga-task-queue
temporal.worker.max-concurrent-workflow-tasks=100
temporal.worker.max-concurrent-activity-tasks=100
temporal.workflow.execution-timeout=1800
temporal.workflow.task-timeout=300
temporal.workflow.max-retry-attempts=3

# ============================================
# Resilience4j Configuration
# ============================================
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=60s

resilience4j.ratelimiter.configs.default.limit-for-period=100
resilience4j.ratelimiter.configs.default.limit-refresh-period=1m
resilience4j.ratelimiter.configs.default.timeout-duration=5s

resilience4j.retry.configs.default.max-attempts=3
resilience4j.retry.configs.default.wait-duration=1s

# ============================================
# Spring Cache
# ============================================
spring.cache.type=redis
spring.cache.redis.time-to-live=3600000
