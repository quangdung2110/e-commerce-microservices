# ============================================================
# Product Service — Local Development Stack
# ============================================================
# Usage:
#   docker compose up -d
#   docker compose logs -f product-service
# ============================================================

services:

  # ── Product Service ────────────────────────────────────
  product-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: product-service
    ports:
      - "8081:8080"   # HTTP (Spring Boot)
      - "9091:9090"   # gRPC (internal service-to-service)
    environment:
      # Spring Profile
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}

      # Database
      DB_URL: jdbc:postgresql://postgres:5432/product_service
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgressecret}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 10

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      SPRING_DATA_REDIS_TIMEOUT: 2000ms
      SPRING_DATA_REDIS_Lettuce_POOL_MAX-ACTIVE: 16
      SPRING_DATA_REDIS_Lettuce_POOL_MAX-IDLE: 8
      SPRING_DATA_REDIS_Lettuce_POOL_MIN-IDLE: 4

      # Kafka
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      SPRING_KAFKA_CONSUMER_BOOTSTRAP_SERVERS: kafka:19092
      SPRING_KAFKA_PRODUCER_BOOTSTRAP_SERVERS: kafka:19092

      # Kafka Consumer Concurrency (match partitions)
      SPRING_KAFKA_LISTENER_CONCURRENCY: 3
      SPRING_KAFKA_CONSUMER_CONCURRENCY: 3

      # App-specific settings
      APP_CACHE_SKU_TTL_SECONDS: ${APP_CACHE_SKU_TTL_SECONDS:-3600}
      APP_OUTBOX_BATCH_SIZE: ${APP_OUTBOX_BATCH_SIZE:-100}
      APP_INVENTORY_SYNC_BATCH_SIZE: ${APP_INVENTORY_SYNC_BATCH_SIZE:-100}
      APP_INVENTORY_SYNC_INTERVAL_MS: ${APP_INVENTORY_SYNC_INTERVAL_MS:-500}
      APP_MARKDOWN_EXPIRY_CRON: ${APP_MARKDOWN_EXPIRY_CRON:-0 0 3 * * ?}

      # Distributed lock
      APP_LOCK_DISTRIBUTED_LOCK_TTL_SECONDS: ${APP_LOCK_DISTRIBUTED_LOCK_TTL_SECONDS:-30}

      # gRPC
      GRPC_PORT: 9090
      GRPC_SERVER_PORT: 9090
      GRPC_CLIENT_INVENTORY_SERVICE_ADDRESS: static://inventory-service:9091
      GRPC_SECURITY_INTERNAL_SECRET: ${GRPC_SECRET:-dev-internal-secret-change-in-prod}

      # Logging
      LOGGING_LEVEL_ROOT: ${LOGGING_LEVEL_ROOT:-INFO}
      LOGGING_LEVEL_COM_PLATFORM_PRODUCTSERVICE: ${LOGGING_LEVEL_APP:-DEBUG}

      # Debezium / CDC
      DEBEZIUM_CONNECT_HOST: kafka-connect
      DEBEZIUM_CONNECT_PORT: 8083

      # JVM tuning
      JAVA_OPTS: "-Xms512m -Xmx1536m -XX:+UseG1GC"

    volumes:
      # Mount Lua scripts for hot-reload in dev (optional)
      # ./src/main/resources/lua:/app/lua:ro
      - ./src/main/resources/lua:/app/lua:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-connect:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/liveness || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - product-network
    restart: on-failure

  # ── PostgreSQL 16 ───────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: postgres-product
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: product_service
      # Performance tuning for local dev
      POSTGRES_MAX_CONNECTIONS: "100"
      POSTGRES_SHARED_BUFFERS: "256MB"
      POSTGRES_EFFECTIVE_CACHE_SIZE: "1GB"
      POSTGRES_MAINTENANCE_WORK_MEM: "64MB"
      POSTGRES_WAL_LEVEL: "logical"
      POSTGRES_MAX_WAL_SIZE: "1GB"
      POSTGRES_MIN_WAL_SIZE: "80MB"
    ports:
      - "15436:5432"
    volumes:
      - postgres-product-data:/var/lib/postgresql/data
      # Mount Flyway migrations for first-run initialization
      - ./src/main/resources/db/migration:/docker-entrypoint-initdb.d/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d product_service"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - product-network
    restart: on-failure

  # ── Redis 7 ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: redis-product
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1
      --appendonly yes
      --appendfsync everysec
      --lua-time-limit 5000
    ports:
      - "6380:6379"
    volumes:
      - redis-product-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '${REDIS_PASSWORD:-}' ping || redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - product-network
    restart: on-failure

  # ── Apache Kafka (KRaft mode, no Zookeeper) ─────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka-product
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:19092,EXTERNAL://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: U-Ui4bTZS5CSb3nHVfwbmQ
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "9094:9094"   # External access
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9094 --list"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - product-network
    restart: on-failure

  # ── Kafka Connect + Debezium ─────────────────────────────
  kafka-connect:
    image: debezium/connect:3.0
    container_name: kafka-connect-product
    environment:
      # Kafka Connect basics
      BOOTSTRAP_SERVERS: kafka:19092
      GROUP_ID: product-service-connect-cluster
      CONFIG_STORAGE_TOPIC: product-service-connect-configs
      OFFSET_STORAGE_TOPIC: product-service-connect-offsets
      STATUS_STORAGE_TOPIC: product-service-connect-status
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"

      # Producer settings
      CONNECT_PRODUCER_BOOTSTRAP_SERVERS: kafka:19092
      CONNECT_PRODUCER_KEY_SERIALIZER: org.apache.kafka.common.serialization.StringSerializer
      CONNECT_PRODUCER_VALUE_SERIALIZER: org.apache.kafka.common.serialization.StringSerializer
      CONNECT_PRODUCER_ACKS: all
      CONNECT_PRODUCER_RETRIES: 3

      # Consumer settings
      CONNECT_CONSUMER_BOOTSTRAP_SERVERS: kafka:19092
      CONNECT_CONSUMER_KEY_DESERIALIZER: org.apache.kafka.common.serialization.StringDeserializer
      CONNECT_CONSUMER_VALUE_DESERIALIZER: org.apache.kafka.common.serialization.StringDeserializer
      CONNECT_CONSUMER_GROUP_ID: product-service-connect-consumers
      CONNECT_CONSUMER_AUTO_OFFSET_RESET: earliest
      CONNECT_CONSUMER_ENABLE_AUTO_COMMIT: "false"

      # Resource limits
      CONNECT_HEAP_MAX_SIZE: 512m
      CONNECT_WORKER_MAX_TASKS_MAX: 5
    ports:
      - "8083:8083"
    volumes:
      # Mount Debezium connector configs
      - ./src/main/resources/kafka:/kafka/connect/debezium:ro
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/ || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - product-network
    restart: on-failure

  # ── Kafka UI (Kafka Topics Management) ──────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8091:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: debezium
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:8083
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - product-network
    restart: on-failure

# ── Networks ──────────────────────────────────────────────
networks:
  product-network:
    driver: bridge

# ── Volumes ───────────────────────────────────────────────
volumes:
  postgres-product-data:
  redis-product-data:
  kafka-data:
