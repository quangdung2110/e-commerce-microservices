syntax = "proto3";

package com.platform.productservice.proto;

option java_package = "com.platform.productservice.proto";
option java_multiple_files = true;
option java_outer_classname = "CartServiceProto";

import "google/protobuf/timestamp.proto";

// =============================================
// Cart Service Contract - matches go/services/cart-service/internal/infrastructure/grpc/product.proto
// =============================================

message GetSkuRequest {
  string sku_id = 1;
}

message GetSkuResponse {
  oneof result {
    SkuData sku = 1;
    SkuNotFound not_found = 2;
    SkuUnavailable unavailable = 3;
  }
}

message GetBatchSkusRequest {
  repeated string sku_ids = 1;
}

message GetBatchSkusResponse {
  map<string, SkuData> skus = 1;
  repeated string not_found = 2;
  repeated string unavailable = 3;
}

message SkuData {
  string sku_id = 1;
  string product_id = 2;
  string product_name = 3;
  string variant_info = 4;
  string image_url = 5;
  double price = 6;
  string status = 7;
  int64 stock_qty = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

message SkuNotFound {
  string sku_id = 1;
}

message SkuUnavailable {
  string sku_id = 1;
  string reason = 2;
}

// =============================================
// gRPC Service for Cart Service
// =============================================

service CartServiceGrpc {
  rpc GetSku(GetSkuRequest) returns (GetSkuResponse);
  rpc GetBatchSkus(GetBatchSkusRequest) returns (GetBatchSkusResponse);
}
