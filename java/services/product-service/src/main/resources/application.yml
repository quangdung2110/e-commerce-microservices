spring:
  application:
    name: product-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15432/product_service}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  # JSON field name của HTTP contract là snake_case; unknown field bị từ chối vì
  # OpenAPI đặt additionalProperties: false.
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest

server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful
  tomcat:
    connection-timeout: 5000
    threads:
      max: 200
      min-spare: 10

grpc:
  server:
    port: ${GRPC_PORT:9091}
    reflection-service-enabled: true

# Cấu hình riêng của service. Không có mục cache/inventory/scheduler:
# thiết kế hiện hành không có các workload đó.
product:
  admin:
    required-role: ADMIN
    user-id-header: X-User-Id
    roles-header: X-User-Roles
  internal:
    identity-header: X-Service-Identity
    allowed-clients:
      - search-service
  export:
    cursor-secret: ${EXPORT_CURSOR_SECRET:dev-export-cursor-secret-change-in-prod}
    cursor-ttl: 30m
    default-limit: 200
    max-limit: 500
  markdown:
    topic: ${MARKDOWN_TOPIC:t.promotion.markdown.events}
    dlq-topic: ${MARKDOWN_DLQ_TOPIC:t.promotion.markdown.events.dlq}
    group-id: ${MARKDOWN_GROUP_ID:product-markdown-consumer}
    lock-timeout: 3s
    retry-attempts: 4
    retry-backoff: 500ms

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true

logging:
  level:
    root: INFO
    com.platform.productservice: INFO
    org.springframework.kafka: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
