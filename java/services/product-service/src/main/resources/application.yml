spring:
  application:
    name: product-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15432/product_service}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  # JSON field name của HTTP contract là snake_case; unknown field bị từ chối vì
  # OpenAPI đặt additionalProperties: false.
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest

    listener:
      observation-enabled: true


    template:
      observation-enabled: true

server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful
  tomcat:
    connection-timeout: 5000
    threads:
      max: 200
      min-spare: 10

grpc:
      listener:
      observation-enabled: true


    template:
      observation-enabled: true

server:
    port: ${GRPC_PORT:9091}
    # Reflection lộ toàn bộ schema cho bất kỳ ai tới được cổng gRPC; chỉ bật ở profile dev
    # hoặc bằng PRODUCT_GRPC_REFLECTION=true khi cần grpcurl (Product ADR-022).
    reflection-service-enabled: ${PRODUCT_GRPC_REFLECTION:false}
    # Kết nối của Cart/Checkout là HTTP/2 dài hạn: không có giới hạn tuổi thì pod Product mới không bao giờ
    # nhận RPC từ client đã kết nối, và không có keepalive thì kết nối chết im lặng không bị phát hiện.
    # max-connection-age cộng ngẫu nhiên +-10%; client kết nối lại và phân giải DNS lại sau GOAWAY.
    # permit-keep-alive-time phải nhỏ hơn chu kỳ ping 30 giây của client (contracts ADR-007).
    max-connection-age: ${GRPC_SERVER_MAX_CONNECTION_AGE:5m}
    max-connection-age-grace: ${GRPC_SERVER_MAX_CONNECTION_AGE_GRACE:30s}
    permit-keep-alive-time: ${GRPC_SERVER_PERMIT_KEEP_ALIVE_TIME:20s}
    permit-keep-alive-without-calls: false

# Cấu hình riêng của service. Không có mục cache/inventory/scheduler:
# thiết kế hiện hành không có các workload đó.
product:
  admin:
    required-role: ADMIN
    user-id-header: X-User-Id
    roles-header: X-User-Roles
  internal:
    identity-header: X-Service-Identity
    # Allowlist tách theo nhóm route, khớp hai security scheme trong
    # contracts/http/product/v1/openapi.yaml (ADR-015).
    reindex-clients:
      - search-service
    # Promotion validate Product đồng bộ qua GET /internal/v1/products/{id}/snapshot
    # trước khi tạo/sửa markdown rule (docs/promotion/workflows.md WF-PROMO-001);
    # chỉ route snapshot, không được export.
    snapshot-clients:
      - search-service
      - promotion-service
    buyer-read-clients:
      - product-detail-bff
  export:
    cursor-secret: ${EXPORT_CURSOR_SECRET:dev-export-cursor-secret-change-in-prod}
    cursor-ttl: 30m
    default-limit: 200
    # gRPC ProductService: x-service-identity phải nằm trong danh sách này (contracts ADR-004).
    grpc-clients:
      - cart-service
      - checkout-service
    max-limit: 500
    # Topic Debezium route outbox tới; export chụp offset của chúng làm replay
    # boundary cho Search (ADR-014).
    product-topic: ${PRODUCT_EVENTS_TOPIC:t.product.events}
    category-topic: ${CATEGORY_EVENTS_TOPIC:t.category.events}
    offset-timeout: 5s
  markdown:
    topic: ${MARKDOWN_TOPIC:t.promotion.markdown.events}
    dlq-topic: ${MARKDOWN_DLQ_TOPIC:t.promotion.markdown.events.dlq}
    group-id: ${MARKDOWN_GROUP_ID:product-markdown-consumer}
    lock-timeout: 3s
    retry-attempts: 4
    retry-backoff: 500ms

management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true

logging:
  level:
    root: INFO
    com.platform.productservice: INFO
    org.springframework.kafka: INFO
  pattern:
    # request_id/trace_id come from RequestCorrelationFilter (contracts ADR-002); empty off the request path.
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [%X{request_id:-},%X{trace_id:-}] - %msg%n"
