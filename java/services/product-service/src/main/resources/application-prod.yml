spring:
  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  data:
    redis:
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 32
          max-idle: 16
          min-idle: 8

  kafka:
    listener:
      concurrency: 3
    consumer:
      concurrency: 3

app:
  cache:
    sku-ttl-seconds: 7200
    markdown-ttl-buffer-seconds: 600
  outbox:
    batch-size: 200
  inventory:
    sync-batch-size: 200

logging:
  level:
    root: INFO
    com.platform.productservice: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
