# Chạy local với PostgreSQL/Kafka của docker-compose ở repo root.
spring:
  datasource:
    url: jdbc:postgresql://localhost:15432/product_service
    username: postgres
    password: postgres

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  kafka:
    # Listener host của broker compose (chỉ bind 127.0.0.1); 9092 không publish ra host.
    bootstrap-servers: localhost:29092

logging:
  level:
    com.platform.productservice: DEBUG
    org.hibernate.SQL: DEBUG

# Secret dev cố định khi chạy từ IDE; docker-compose đặt EXPORT_CURSOR_SECRET riêng.
product:
  export:
    cursor-secret: ${EXPORT_CURSOR_SECRET:dev-export-cursor-secret}

# grpcurl tiện dụng khi chạy local; mặc định tắt ở mọi profile khác (Product ADR-022).
grpc:
  server:
    reflection-service-enabled: true
