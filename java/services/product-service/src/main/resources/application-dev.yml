# Chạy local với PostgreSQL/Kafka của docker-compose ở repo root.
spring:
  datasource:
    url: jdbc:postgresql://localhost:15432/product_service
    username: postgres
    password: postgres

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: localhost:9092

logging:
  level:
    com.platform.productservice: DEBUG
    org.hibernate.SQL: DEBUG

# grpcurl tiện dụng khi chạy local; mặc định tắt ở mọi profile khác (Product ADR-022).
grpc:
  server:
    reflection-service-enabled: true
