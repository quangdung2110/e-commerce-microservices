spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/product_service_dev
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: false

  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9092

logging:
  level:
    root: DEBUG
    com.platform.productservice: TRACE
    org.springframework.kafka: DEBUG
    org.hibernate.SQL: DEBUG
