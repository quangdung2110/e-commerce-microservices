# Integration test dùng Testcontainers PostgreSQL; URL do test inject.
spring:
  # gRPC service được gọi trực tiếp qua bean, không mở port.
  grpc:
    server:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  # Không có broker trong test: consumer được gọi trực tiếp.
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: false

product:
  export:
    cursor-secret: test-export-cursor-secret
    default-limit: 2
    max-limit: 10
  markdown:
    lock-timeout: 2s

logging:
  level:
    root: WARN
    com.platform.productservice: INFO
    org.testcontainers: INFO
