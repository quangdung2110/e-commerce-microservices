spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/product_service_test
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

  flyway:
    enabled: false

  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9092

app:
  markdown:
    expiry-cron: "0 0 3 * * ?"
  outbox:
    retention-days: 1
    batch-size: 10
  inventory:
    sync-batch-size: 10
    sync-interval-ms: 100
  cache:
    sku-ttl-seconds: 60
    markdown-ttl-buffer-seconds: 30
  lock:
    timeout-seconds: 1
    distributed-lock-ttl-seconds: 5

logging:
  level:
    root: WARN
    com.platform.productservice: DEBUG
