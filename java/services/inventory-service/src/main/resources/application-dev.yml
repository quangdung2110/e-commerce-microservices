spring:
  datasource:
    url: jdbc:postgresql://localhost:15432/inventory_db
    username: inventory
    password: inventory_dev
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/dev-migration
    baseline-on-migrate: true
  data:
    redis:
      host: localhost
      port: 16379

inventory:
  redis:
    cluster:
      nodes: localhost:16379
  kafka:
    bootstrap-servers: localhost:9092
  temporal:
    target: localhost:7233