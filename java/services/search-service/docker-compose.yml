version: '3.8'
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    command: >
      bash -c "bin/elasticsearch-plugin install --batch analysis-icu || true;
      /bin/tini -- /usr/local/bin/docker-entrypoint.sh eswrapper"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms2g -Xmx2g
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - es-data:/usr/share/elasticsearch/data

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
      - "29092:29092"

  search-service:
    build: .
    depends_on:
      elasticsearch:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      ES_URIS: http://elasticsearch:9200
      KAFKA_BOOTSTRAP: kafka:9092
      SPRING_PROFILES_ACTIVE: dev
      # Local only: the dev profile creates the four indices from docs/search/schema.
      SEARCH_BOOTSTRAP_INDICES: "true"
      # Only read during a full reindex; Product, Inventory and Review are not needed
      # for ordinary local work, where events are published to Kafka by hand.
      PRODUCT_INTERNAL_URL: http://product-service:8081
      INVENTORY_INTERNAL_URL: http://inventory-service:8080
      REVIEW_INTERNAL_URL: http://review-service:8080
      REVIEW_EXPORT_ENABLED: "false"
      CDN_BASE_URL: http://localhost:9000/media/
    ports:
      - "8081:8080"

volumes:
  es-data:
