spring:
  application:
    name: search-service

  main:
    web-application-type: servlet

  elasticsearch:
    uris: ${ES_URIS:http://localhost:9200}
    connection-timeout: 5s
    socket-timeout: 30s
    username: ${ES_USERNAME:}
    password: ${ES_PASSWORD:}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: search-indexer
      auto-offset-reset: earliest
      max-poll-records: 500
      enable-auto-commit: false
      properties:
        max.poll.interval.ms: 600000
    listener:
      concurrency: 3

  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: 8080
  shutdown: graceful
  # The OpenAPI allows a 16384-character cursor, up to 50 filter tokens of 256 characters and a
  # 256-character q on one GET. Tomcat's default 8KB request line would reject such a request
  # before it reaches the controller, so the limit follows the contract.
  max-http-request-header-size: 40KB

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
      group:
        # Liveness is process-only on purpose: an Elasticsearch outage must not restart
        # every instance (docs/search/operations.md 2).
        liveness:
          include: ping
        readiness:
          include: searchReadiness
  health:
    elasticsearch:
      enabled: false
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        es_query_duration_seconds: true

search:
  # Consumer group of the indexing worker. Changing it resets the read position.
  consumer-group: search-indexer
  # Only true for local development and tests; shared environments create the indices
  # deliberately from docs/search/schema before the service starts.
  bootstrap-indices: ${SEARCH_BOOTSTRAP_INDICES:false}

  topics:
    product: t.product.events
    category: t.category.events
    catalog-control: t.catalog.control.events
    stock: t.inventory.stock.events.v1
    review: t.review.events

  aliases:
    products: products
    products-write: products_write
    categories: categories
    categories-write: categories_write
    search-suggestions: search_suggestions
    search-jobs: search_jobs

  query:
    product-timeout: 5s
    suggest-timeout: 2s
    category-timeout: 5s
    update-by-query-timeout: 2m
    cardinality-precision-threshold: 1000
    facet-max-options: 50
    facet-max-attributes: 100

  pagination:
    default-size: 20
    max-size: 100
    cursor-secret: ${SEARCH_CURSOR_SECRET:dev-product-cursor-secret-change-in-production}
    pit-keep-alive: 2m
    product-scan-batch-size: 500
    max-matching-products: 50000

  # Client-side _bulk throttling. requests-per-second throttles bulk dispatch;
  # task-requests-per-second is the ES task API parameter for _update_by_query and
  # _delete_by_query. They are different mechanisms (docs/search/operations.md 11).
  bulk:
    max-actions: 1000
    max-bytes: 5242880
    max-in-flight: 4
    requests-per-second: 20
    throttle-backoff-factor: 0.5
    throttle-recovery-factor: 1.1
    recovery-window-requests: 20
    max-retries: 8
    initial-backoff: 500ms
    max-backoff: 30s
    task-requests-per-second: 300

  reindex:
    run-deadline: 6h
    export-page-size: 500
    catch-up-zero-lag-polls: 5
    catch-up-poll-timeout: 10s
    catch-up-deadline: 30m
    max-doc-count-drift-ratio: 0.02

  suggestions:
    rebuild-cron: "0 0 3 * * *"
    rebuild-enabled: true
    min-docs: 1
    min-ratio-to-previous-version: 0.80
    pit-keep-alive: 5m
    lease-duration: 5m
    lease-renew-interval: 1m
    category-weight-scale: 5000
    product-weight-scale: 1000
    promotion-multiplier: 1.10
    max-weight: 9000000000000000000
    language: vi
    scope: GLOBAL
    hot-prefixes: []

  tombstone:
    purge-cron: "0 30 2 * * *"
    purge-enabled: true
    # Must stay strictly longer than the longest time a consumed record can still be on the
    # broker. The longest topic is t.inventory.stock.events.v1 at exactly 30d (floor and ceiling,
    # Inventory ADR-028); the Product, Category, catalog-control and Review topics are 14d in the
    # AsyncAPI contracts. Kafka deletes whole segments, so a record outlives retention.ms by up
    # to segment.ms (7d by default): 30d + 7d + 8d margin = 45d (ADR-022, which replaces the
    # number chosen in ADR-021 and keeps ADR-011's rule).
    protection-window: 45d
    product-count-cron: "0 0 */4 * * *"
    product-count-enabled: true

  media:
    # Absolute http(s) URL without a trailing slash, and equal to PDP_MEDIA_CDN_BASE_URL;
    # the service refuses to start otherwise (ADR-022).
    cdn-base-url: ${CDN_BASE_URL:https://cdn.local}
    placeholder-url: ${THUMBNAIL_PLACEHOLDER_URL:/static/placeholder-product.png}

  gateway:
    user-id-header: X-User-Id
    roles-header: X-User-Roles
    request-id-header: X-Request-Id
    admin-role: ADMIN

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

  export:
    product-base-url: ${PRODUCT_INTERNAL_URL:http://product-service:8081}
    inventory-base-url: ${INVENTORY_INTERNAL_URL:http://inventory-service:8080}
    review-base-url: ${REVIEW_INTERNAL_URL:http://review-service:8080}
    review-enabled: ${REVIEW_EXPORT_ENABLED:true}
    # 25 s: the mesh allows 30 s on the export routes and the caller must stay at least 1 s under it
    # (contracts ADR-003, Search ADR-023). It is also sent to the provider as X-Request-Timeout-Ms.
    timeout: 25s
    # A snapshot session lives 24h and a re-created one must be paged from the start,
    # so repeatedly outliving one is a capacity problem, not a blip (WF-SEARCH-007).
    availability-snapshot-max-sessions: 2
    # Same budget for the Review rating export: an expired session forces the rating
    # import to restart from the first page (WF-SEARCH-009 step 3).
    rating-export-max-sessions: 2

  consumer:
    # Pause before an unacknowledged batch is handed back to Kafka (Acknowledgment.nack).
    retry-backoff: 5s

  # Life cycle around a full reindex (ADR-022, docs/search/workflows.md WF-SEARCH-009).
  lifecycle:
    # The run that owns the `full-reindex` lease renews it every renew-interval; a lease that
    # has not been renewed for lease-duration marks the run abandoned.
    lease-duration: 2m
    lease-renew-interval: 30s
    watchdog-interval: 30s
    max-resume-attempts: 3
    # catalog-reindex-requested starts a run once no further request arrived for this long.
    control-debounce: 2m
    control-auto-start: true
    # Trigger refuses with REINDEX_PRECONDITION_FAILED on a red cluster or when free disk is
    # below min-free-disk-ratio times the current primary store size.
    precondition-enabled: true
    min-free-disk-ratio: 1.5
    # A superseded index survives this long after it stopped being current.
    old-index-retention: 24h
    cleanup-cron: "0 15 * * * *"
    cleanup-enabled: true

  # Checks between catch-up and cutover: sample diff against the current index and a smoke
  # query set. hot-queries are free-text queries that must return hits when the current index does.
  verify:
    enabled: true
    sample-size-per-bucket: 100
    hot-queries: []

logging:
  level:
    root: INFO
    com.ecommerce.search: INFO
    org.elasticsearch.client: WARN
    org.springframework.kafka: INFO
