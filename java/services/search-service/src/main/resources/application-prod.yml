spring:
  elasticsearch:
    uris: ${ES_URIS:}
    username: ${ES_USERNAME:}
    password: ${ES_PASSWORD:}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:}
    consumer:
      properties:
        sasl.mechanism: PLAIN
        sasl.jaas.config: org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_SASL_USERNAME:}" password="${KAFKA_SASL_PASSWORD:}";
        security.protocol: SASL_PLAINTEXT

search:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://shop.example.com}

logging:
  level:
    com.ecommerce.search: INFO
