spring:
  elasticsearch:
    connection-timeout: 10s
    socket-timeout: 60s
  kafka:
    consumer:
      auto-offset-reset: earliest
      group-id: search-indexer-test
      properties:
        max.poll.interval.ms: 300000
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

search:
  consumer-group: search-indexer-test
  bootstrap-indices: true
  cors:
    allowed-origins: "*"
  # Scheduled jobs are driven explicitly from the tests so that timing never decides
  # whether an assertion holds.
  suggestions:
    rebuild-enabled: false
    rebuild-cron: "0 0 5 31 2 ?"
  tombstone:
    purge-enabled: false
    product-count-enabled: false
    purge-cron: "0 0 5 31 2 ?"
    product-count-cron: "0 0 5 31 2 ?"
  media:
    cdn-base-url: "https://cdn.test"
    placeholder-url: "/static/placeholder-product.png"

logging:
  level:
    com.ecommerce.search: DEBUG
    org.testcontainers: INFO
    org.springframework.kafka: WARN
    co.elastic.clients: WARN
