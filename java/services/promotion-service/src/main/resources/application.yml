# ============================================================
# Promotion Service - Main Configuration
# Theo thiết kế technology_choice.md - Section 4: Tech Stack
# ============================================================

server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: promotion-service

  # ---- PostgreSQL (Theo thiết kế promotion_db_design.md) ----
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ecommerce_promotion}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true

  # ---- Redis L2 Cache (Theo thiết kế redis_caching_design.md - Section 2) ----
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:16}
          max-idle: ${REDIS_POOL_MAX_IDLE:8}
          min-idle: ${REDIS_POOL_MIN_IDLE:2}

  # ---- Kafka (Theo thiết kế promotion_events.md - Section 4: Topic Mapping) ----
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
    consumer:
      group-id: promo-order-consumer
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
      enable-auto-commit: false
    listener:
      ack-mode: manual

# ============================================================
# Kafka Topics (Theo thiết kế promotion_events.md - Section 4)
# ============================================================
kafka:
  topic:
    promotion-markdown-events: t.promotion.markdown.events
    promotion-coupon-events: t.promotion.coupon.events
    promotion-budget-events: t.promotion.budget.events
    order-events: t.order.events
    partitions: ${KAFKA_TOPIC_PARTITIONS:3}
    replicas: ${KAFKA_TOPIC_REPLICAS:1}

# ============================================================
# Promotion Service Custom Config
# ============================================================
promotion:
  # Outbox Relay Worker (Theo thiết kế promotion_outbox_pattern.md - Section 4.1)
  outbox:
    polling-interval-ms: ${OUTBOX_POLL_INTERVAL:500}
    batch-size: ${OUTBOX_BATCH_SIZE:100}
    max-retries: 5

  # Caffeine L1 Cache (Theo thiết kế redis_caching_design.md - Section 2.1)
  cache:
    caffeine:
      refresh-after-write-seconds: ${CAFFEINE_REFRESH_SECONDS:60}
      maximum-size: ${CAFFEINE_MAX_SIZE:10000}

  # Budget Reservation TTL (Theo thiết kế redis_caching_design.md - Section 2.4)
  reservation:
    ttl-seconds: ${RESERVATION_TTL:900}

  # Flash Sale Pending Claims Sweep (Theo thiết kế promotion_workers.md - Section 2.2)
  pending-claims:
    sweep-interval-ms: ${PENDING_CLAIMS_SWEEP_INTERVAL:300000}
    stale-threshold-seconds: ${PENDING_CLAIMS_STALE_THRESHOLD:300}

  # Rate Limiting (Theo thiết kế redis_caching_design.md - Section 2.5)
  rate-limit:
    claim-max-requests: ${RATE_LIMIT_CLAIM_MAX:5}
    claim-window-seconds: ${RATE_LIMIT_CLAIM_WINDOW:10}

  # Rule Engine Validation (Theo thiết kế rule_engine_design.md - Section 4)
  rule-engine:
    max-depth: 10
    max-payload-size-kb: 64

  # Redis Pub/Sub Channel (Theo thiết kế redis_caching_design.md - Section 2.1)
  pubsub:
    evict-channel: channel:promo:cache:evict

logging:
  level:
    root: INFO
    com.ecommerce.promotion: INFO
    org.springframework.kafka: WARN
