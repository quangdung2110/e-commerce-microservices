# Chạy local với PostgreSQL/Redis/Kafka của docker-compose ở repo root.
spring:
  datasource:
    url: jdbc:postgresql://localhost:15432/promotion_service
    username: postgres
    password: postgres
  data:
    redis:
      host: localhost
      port: 6379
      # Redis của compose bật requirepass (mesh ADR-002); mặc định trùng x-redis-password.
      password: ${REDIS_PASSWORD:local-dev-redis-password}
  kafka:
    # Listener host của broker compose (chỉ bind 127.0.0.1); 9092 không publish ra host.
    bootstrap-servers: localhost:29092

promotion:
  product:
    base-url: http://localhost:8082

logging:
  level:
    com.platform.promotionservice: DEBUG
