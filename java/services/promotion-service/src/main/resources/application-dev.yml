spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  kafka:
    consumer:
      properties:
        spring.json.trusted.packages: "*"

logging:
  level:
    root: INFO
    com.ecommerce.promotion: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
