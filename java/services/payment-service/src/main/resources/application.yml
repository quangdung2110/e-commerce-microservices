spring:
  application:
    name: payment-service
  datasource:
    url: ${PAYMENT_DATABASE_URL:jdbc:postgresql://localhost:15432/payment_service}
    username: ${PAYMENT_DATABASE_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${PAYMENT_KAFKA_BROKERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        max.request.size: 393216
    consumer:
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        max.partition.fetch.bytes: 393216
    listener:
      ack-mode: manual_immediate
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
payment:
  scheduling:
    enabled: true
  stripe:
    api-version: ${PAYMENT_STRIPE_API_VERSION:2026-08-26.dahlia}
    webhook-window-seconds: 300
    webhook-max-bytes: 262144
    timeout:
      connect: PT5S
      read: PT15S
    max-network-retries: 2
    decline:
      max-per-attempt: 5
  session:
    ttl: PT15M
    client-secret-margin: PT30S
  command:
    lease-ttl: PT45S
    heartbeat: PT10S
  webhook:
    processor-enabled: true
    lease-ttl: PT1M
    heartbeat: PT15S
    retry:
      max: 8
      base-delay: PT30S
      interval: PT30S
      batch-size: 100
  provider:
    safe-replay-horizon: PT23H
    cancel-recovery-window: P7D
    refund-recovery-window: P7D
  scheduler:
    recovery:
      interval: PT30S
      backoff: PT30S
      max-backoff: PT5M
      max-attempts: 20
      batch-size: 100
    expiration:
      interval: PT1M
      batch-size: 200
    refund:
      interval: PT10M
      minimum-age: PT1M
      batch-size: 100
  review:
    idempotency-retention: P7D
  retention:
    cron: "0 30 3 * * *"
    batch-size: 5000
    outbox-days: 15
    webhook-raw-days: 90
    webhook-metadata-months: 12
    reconciliation-run-months: 12
    financial-years: 7
    outbox-slot-name: payment_outbox_slot
  reconciliation:
    interval: PT1H
    lookback: PT65M
    # ADR-022: SUCCESS refunds are re-checked against Stripe for this long (reversal can arrive ~30 days later)
    refund-success-lookback: P35D
    batch-size: 500
    auto-correction-frozen: false
  # Callers per route group (X-Service-Identity); the mesh is the real boundary
  # (contracts ADR-004, Payment ADR-026, ADR-028). An empty list rejects every caller.
  identity:
    # /v1/payments/** (except the webhook) and /v1/refunds/**
    allowed-callers: ${PAYMENT_ALLOWED_CALLERS:order-service}
    # /internal/v1/payment/** (Finance Ops, contracts/http/payment/internal/v1)
    operations-callers: ${PAYMENT_OPERATIONS_CALLERS:finance-ops,accounting-ops}

logging:
  pattern:
    # request_id/trace_id come from RequestCorrelationFilter (contracts ADR-002); empty off the request path.
    level: "%5p [%X{request_id:-},%X{trace_id:-}]"
