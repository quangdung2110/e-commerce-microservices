name: GitOps Validation

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  gitops-required:
    name: gitops-required
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements.txt
      - name: Validate frozen bundles and compare previous state
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_SAME_REPOSITORY: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          args=()
          if [[ -n "$BASE" && ! "$BASE" =~ ^0+$ ]]; then args+=(--base "$BASE"); fi
          if [ -z "$PR_AUTHOR" ]; then unset PR_AUTHOR; fi
          python tools/cd/validate_gitops.py "${args[@]}"
      - name: Validate Kubernetes and controller resource schemas
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" ghcr.io/yannh/kubeconform:v0.6.7@sha256:0925177fb05b44ce18574076141b5c3d83235e1904d3f952182ac99ddc45762c -strict -summary \
            -ignore-filename-pattern '(state|profile|metadata|kustomization)\.(json|yaml)$' \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /repo/candidates /repo/environments /repo/bootstrap/staging /repo/bootstrap/production
