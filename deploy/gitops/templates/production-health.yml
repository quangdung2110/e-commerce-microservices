name: Production Health

on:
  push:
    branches: [main]
    paths: ['environments/production/**', 'config.json', 'tools/**', '.github/workflows/production-health.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-health
  cancel-in-progress: false

jobs:
  configuration-required:
    if: github.event_name == 'workflow_dispatch' && (vars.CD_ENABLED != 'true' || github.ref != 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: |
          echo '::error::Production verification requires main and CD_ENABLED=true after platform setup.'
          exit 1

  verify:
    if: vars.CD_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements.txt
      - name: Verify exact production state with read-only Argo credentials
        env:
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
          PROMETHEUS_AUTHORIZATION: ${{ secrets.PROMETHEUS_AUTHORIZATION }}
        run: >-
          python tools/cd/observe.py --config config.json --environment production
          --bundle environments/production --output ci-artifacts/production-proof.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-proof
          overwrite: true
          path: ci-artifacts/production-proof.json
          if-no-files-found: error
          retention-days: 90
