data:
  resource.customizations.health.external-secrets.io_ExternalSecret: |
    local hs = {status = "Progressing", message = "Waiting for the pinned external secret version"}
    if obj.status ~= nil and obj.status.conditions ~= nil then
      for _, c in ipairs(obj.status.conditions) do
        if c.type == "Ready" and c.status == "True" then
          hs.status = "Healthy"
          hs.message = "Pinned secret synchronized"
        elseif c.type == "Ready" and c.status == "False" then
          hs.status = "Degraded"
          hs.message = "External secret is not ready"
        end
      end
    end
    return hs
