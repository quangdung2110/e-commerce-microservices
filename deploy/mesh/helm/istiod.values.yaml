# Values for the `istiod` chart, Istio 1.24.2 ambient (docs/mesh/runtime-contract.md sections 2, 7, 8, 9; mesh ADR-001).
# Install: helm install istiod istio/istiod -n istio-system -f deploy/mesh/helm/istiod.values.yaml --version 1.24.2
# Pin image digests at install time (versions.yaml); never use `latest`.
profile: ambient

global:
  tag: 1.24.2

meshConfig:
  # Egress is declared with ServiceEntry (generated/60-serviceentries.yaml). Verify on the first cluster whether ztunnel enforces
  # REGISTRY_ONLY in ambient mode; if it does not, an egress control outside the mesh is needed (mesh ADR-001, open item).
  outboundTrafficPolicy:
    mode: REGISTRY_ONLY

  # No route depends on Istio's implicit retries: every route in generated/50-virtualservices.yaml states its attempts.
  defaultHttpRetryPolicy:
    attempts: 0

  # Waypoint access log: JSON on stdout with the fields of runtime-contract section 9. No Authorization, cookie, body or X-User-* value.
  accessLogFile: /dev/stdout
  accessLogEncoding: JSON
  accessLogFormat: >-
    {"start_time":"%START_TIME%","method":"%REQ(:METHOD)%","path":"%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%",
    "response_code":"%RESPONSE_CODE%","response_flags":"%RESPONSE_FLAGS%","duration":"%DURATION%",
    "source_principal":"%DOWNSTREAM_PEER_URI_SAN%","destination_service":"%REQ(:AUTHORITY)%",
    "trace_id":"%REQ(TRACEPARENT)%","x_request_id":"%REQ(X-REQUEST-ID)%"}

  # Traces go to the OpenTelemetry Collector (W3C traceparent); sampling is set by generated/70-telemetry.yaml.
  extensionProviders:
    - name: otel
      opentelemetry:
        service: otel-collector.observability.svc.cluster.local
        port: 4317
