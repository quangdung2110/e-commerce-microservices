apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-checkout-redis-exporter
  namespace: observability
spec:
  action: ALLOW
  selector:
    matchLabels:
      app.kubernetes.io/name: checkout-redis-exporter
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/observability/sa/prometheus
      to:
        - operation:
            ports: ["9121"]
