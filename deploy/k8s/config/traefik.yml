# =============================================================================
# Traefik v3.x - Static Configuration cho Kubernetes (deploy/k8s)
# =============================================================================
# Bản của go/services/api-gateway/config/traefik.yml, khác đúng một điểm: không có docker
# provider. Route do deploy/k8s/generate.py dịch từ label Traefik trong docker-compose.yml
# sang /etc/traefik/dynamic/routes.yml; middleware và serversTransport vẫn từ dynamic.yml gốc.
# =============================================================================

global:
  checkNewVersion: false
  sendAnonymousUsage: false

api:
  dashboard: true
  insecure: true

entryPoints:
  web:
    address: ":80"

  metrics:
    address: ":8090"

providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true

log:
  level: INFO
  format: json

accessLog:
  format: json
  fields:
    defaultMode: keep
    names:
      RequestPath: drop
      RequestLine: drop
      ClientUsername: drop
    headers:
      defaultMode: drop
      names:
        X-Request-Id: keep

metrics:
  prometheus:
    entryPoint: metrics
    addRoutersLabels: true
    buckets: [0.005, 0.01, 0.025, 0.05, 0.1, 0.25, 0.5, 1, 2.5, 5, 10]

tracing:
  serviceName: api-gateway
  sampleRate: 1.0
  otlp:
    http:
      endpoint: http://otel-collector:4318/v1/traces
