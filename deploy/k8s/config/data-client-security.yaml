apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-service
  namespace: ecommerce
spec:
  template:
    spec:
      containers:
        - name: checkout-service
          env:
            - name: CHECKOUT_REDIS_URL
              value: null
              valueFrom:
                secretKeyRef:
                  name: checkout-redis-client
                  key: url
            - name: JAVA_TOOL_OPTIONS
              value: -Djavax.net.ssl.trustStore=/run/data-trust/trust.p12 -Djavax.net.ssl.trustStorePassword=changeit
          volumeMounts:
            - name: data-trust
              mountPath: /run/data-trust
              readOnly: true
      volumes:
        - name: data-trust
          secret:
            secretName: data-server-trust
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-service
  namespace: ecommerce
spec:
  template:
    spec:
      containers:
        - name: search-service
          env:
            - name: ES_URIS
              value: https://elasticsearch:9200
            - name: ES_USERNAME
              value: search-service
            - name: ES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elasticsearch-client
                  key: password
            - name: JAVA_TOOL_OPTIONS
              value: -Djavax.net.ssl.trustStore=/run/data-trust/trust.p12 -Djavax.net.ssl.trustStorePassword=changeit
          volumeMounts:
            - name: data-trust
              mountPath: /run/data-trust
              readOnly: true
      volumes:
        - name: data-trust
          secret:
            secretName: data-server-trust
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-connect-init
  namespace: data
spec:
  template:
    spec:
      containers:
        - name: kafka-connect-init
          env:
            - name: CONNECT_URL
              value: https://kafka-connect:8083
            - name: CURL_CA_BUNDLE
              value: /run/connect-tls/ca.crt
            - name: CONNECT_CLIENT_CERT
              value: /run/connect-tls/tls.crt
            - name: CONNECT_CLIENT_KEY
              value: /run/connect-tls/tls.key
          volumeMounts:
            - name: connect-client
              mountPath: /run/connect-tls
              readOnly: true
      volumes:
        - name: connect-client
          secret:
            secretName: kafka-connect-rest-client
