# Observability (namespace observability — docs/mesh/design.md §Namespace và phạm vi). Cấu hình dùng lại
# nguyên file của infra/observability (đọc ngoài thư mục, nên build qua deploy/k8s/apply.sh); riêng Alloy có
# bản Kubernetes ở deploy/k8s/config/config.alloy vì compose đọc log qua docker.sock.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: observability

labels:
  - pairs:
      app.kubernetes.io/part-of: ecommerce
    includeSelectors: false

resources:
  - namespace.yaml
  - aliases.yaml
  - otel-collector.yaml
  - prometheus.yaml
  - alertmanager.yaml
  - loki.yaml
  - jaeger.yaml
  - grafana.yaml
  - exporters.yaml

configMapGenerator:
  - name: otel-collector-config
    files:
      - config.alloy=../config/config.alloy
  - name: prometheus-config
    files:
      - prometheus.yml=../../../infra/observability/prometheus.yml
      - rules.yml=../../../infra/observability/rules.yml
  - name: prometheus-optional-targets
    files:
      - optional-targets.py=../../../infra/observability/optional-targets.py
  - name: alertmanager-config
    files:
      - alertmanager.yml=../../../infra/observability/alertmanager.yml
  - name: loki-config
    files:
      - config.yml=../../../infra/observability/loki.yml
  - name: jaeger-config
    files:
      - config.yml=../../../infra/observability/jaeger.yml
  - name: grafana-datasources
    files:
      - datasources.yml=../../../infra/observability/grafana/datasources/datasources.yml
  - name: grafana-dashboards
    files:
      - dashboards.yml=../../../infra/observability/grafana/dashboards/dashboards.yml
      - backends.json=../../../infra/observability/grafana/dashboards/backends.json

# Giá trị mặc định của docker-compose.yml (docs/observability/runbook.md); chỉ dùng cho local.
secretGenerator:
  - name: grafana-admin
    literals:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=local-observability
  - name: postgres-exporter
    literals:
      - DATA_SOURCE_NAME=postgresql://postgres:postgres@postgres:5432/postgres?sslmode=disable
