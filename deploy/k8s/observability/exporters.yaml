apiVersion: v1
kind: Service
metadata:
  name: postgres-exporter
spec:
  selector:
    app.kubernetes.io/name: postgres-exporter
  ports:
    - name: metrics
      port: 9187
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-exporter
    spec:
      enableServiceLinks: false
      containers:
        - name: postgres-exporter
          image: prometheuscommunity/postgres-exporter:v0.20.1
          envFrom:
            - secretRef:
                name: postgres-exporter
          ports:
            - name: metrics
              containerPort: 9187
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-exporter
spec:
  selector:
    app.kubernetes.io/name: kafka-exporter
  ports:
    - name: metrics
      port: 9308
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-exporter
    spec:
      enableServiceLinks: false
      containers:
        - name: kafka-exporter
          image: danielqsj/kafka-exporter:v1.10.0
          # Principal kafka-exporter chỉ có DESCRIBE trên topic và group (mesh ADR-003). Mật khẩu dev
          # trùng x-kafka-passwords của docker-compose; $(VAR) do kubelet thay.
          args:
            - --kafka.server=kafka:9092
            - --sasl.enabled
            - --sasl.mechanism=scram-sha512
            - --sasl.username=kafka-exporter
            - --sasl.password=$(SCRAM_PASSWORD)
          env:
            - name: SCRAM_PASSWORD
              value: kafka-exporter-local-dev
          ports:
            - name: metrics
              containerPort: 9308
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
