# Exporter hạ tầng; tên Service/cổng trùng target trong infra/observability/prometheus.yml.
apiVersion: v1
kind: Service
metadata:
  name: redis-exporter
spec:
  selector:
    app.kubernetes.io/name: redis-exporter
  ports:
    - name: metrics
      port: 9121
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis-exporter
    spec:
      # Service link REDIS_EXPORTER_* trùng tiền tố cấu hình của exporter.
      enableServiceLinks: false
      containers:
        - name: redis-exporter
          image: oliver006/redis_exporter:v1.94.0
          env:
            - name: REDIS_ADDR
              value: redis://redis:6379
            # Giá trị dev, trùng Secret redis-credentials của namespace data (Secret không dùng
            # chéo namespace được) và x-redis-password của docker-compose.
            - name: REDIS_PASSWORD
              value: local-dev-redis-password
          ports:
            - name: metrics
              containerPort: 9121
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
---
