apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - name: http
      port: 9090
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: prometheus
spec:
  serviceName: prometheus
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
    spec:
      enableServiceLinks: false
      securityContext:
        fsGroup: 65534
      initContainers:
        # observability-init của compose: ghi target file_sd cho profile tuỳ chọn. Ở cụm này Payment và
        # Notification luôn chạy (deploy/k8s/README.md), nên cả hai được scrape.
        - name: optional-targets
          image: python:3.12-alpine
          command: ["python", "/config/optional-targets.py"]
          env:
            - name: OBSERVABILITY_OPTIONAL_SERVICES
              value: payment notification
          volumeMounts:
            - name: optional-targets-script
              mountPath: /config
              readOnly: true
            - name: targets
              mountPath: /targets
      containers:
        - name: prometheus
          image: prom/prometheus:v3.15.0
          args: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d", "--enable-feature=exemplar-storage"]
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
            - name: config
              mountPath: /etc/prometheus/rules.yml
              subPath: rules.yml
            - name: targets
              mountPath: /etc/prometheus/targets
              readOnly: true
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: optional-targets-script
          configMap:
            name: prometheus-optional-targets
        - name: targets
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
