# Jaeger v2, Badger trên PVC (infra/observability/jaeger.yml ghi vào /tmp/jaeger/{keys,values}).
apiVersion: v1
kind: Service
metadata:
  name: jaeger
spec:
  selector:
    app.kubernetes.io/name: jaeger
  ports:
    - name: http
      port: 16686
    - name: otlp-grpc
      port: 4317
    - name: metrics
      port: 8888
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: jaeger
spec:
  serviceName: jaeger
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jaeger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jaeger
    spec:
      enableServiceLinks: false
      initContainers:
        # observability-init của compose: Badger chạy với UID 10001 và không tự tạo thư mục.
        - name: badger-dirs
          image: busybox:1.36
          command: ["sh", "-c", "mkdir -p /jaeger/keys /jaeger/values && chown -R 10001:10001 /jaeger"]
          volumeMounts:
            - name: data
              mountPath: /jaeger
      containers:
        - name: jaeger
          # Cùng phiên bản với docker-compose.yml: 2.21+ bỏ API v1 mà datasource Jaeger của Grafana cần
          # (grafana/grafana-jaeger-datasource#87).
          image: jaegertracing/jaeger:2.20.0
          args: ["--config=/etc/jaeger/config.yml"]
          ports:
            - name: http
              containerPort: 16686
            - name: otlp-grpc
              containerPort: 4317
            - name: metrics
              containerPort: 8888
            - name: health
              containerPort: 13133
          readinessProbe:
            httpGet:
              path: /status
              port: health
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/jaeger
              readOnly: true
            - name: data
              mountPath: /tmp/jaeger
      volumes:
        - name: config
          configMap:
            name: jaeger-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
