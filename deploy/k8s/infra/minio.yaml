# MinIO: byte của media Review (ADR-011) và product-media thay CDN ở local (PDP BFF ADR-005).
# Image ecommerce-minio build từ infra/minio (`docker compose build minio`); cụm kubeadm của
# Docker Desktop dùng chung kho image với Docker Engine nên không cần registry.
apiVersion: v1
kind: Service
metadata:
  name: minio
spec:
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
    - name: console
      port: 9001
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
spec:
  serviceName: minio
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      enableServiceLinks: false
      containers:
        - name: minio
          image: ecommerce-minio:RELEASE.2025-10-15T17-29-55Z
          imagePullPolicy: IfNotPresent
          args: ["server", "/data", "--console-address", ":9001"]
          envFrom:
            - secretRef:
                name: minio-credentials
          ports:
            - name: api
              containerPort: 9000
            - name: console
              containerPort: 9001
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
# Tạo bucket một lần rồi thoát (idempotent). apply.sh xoá Job cũ trước khi apply vì spec của Job
# không sửa được; chạy lại tay: `kubectl -n data delete job minio-init` rồi apply.
#  - review-media: private, Review ký mọi URL (ADR-011).
#  - product-media: chỉ GetObject ẩn danh; policy "download" có sẵn sẽ lộ ListBucket.
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      enableServiceLinks: false
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc:RELEASE.2024-01-18T07-03-39Z
          envFrom:
            - secretRef:
                name: minio-credentials
          command:
            - /bin/sh
            - -c
            - |
              set -e
              until mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do sleep 3; done
              mc mb --ignore-existing local/review-media
              mc mb --ignore-existing local/product-media
              mc anonymous set-json /seed/policies/product-media-read.json local/product-media
              mc cp --recursive /seed/product-media/ local/product-media/
              echo 'review-media and product-media buckets ready'
          volumeMounts:
            - name: seed
              mountPath: /seed
              readOnly: true
      volumes:
        - name: seed
          configMap:
            name: minio-seed
            items:
              - key: product-media-read.json
                path: policies/product-media-read.json
              - key: product.svg
                path: product-media/placeholder/product.svg
