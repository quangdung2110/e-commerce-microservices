apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
spec:
  selector:
    app: elasticsearch
  ports:
    - name: http
      port: 9200
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
spec:
  serviceName: elasticsearch
  replicas: 1
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
    spec:
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
          # analysis-icu cài lúc khởi động như docker-compose (cần mạng ra ngoài).
          command:
            - bash
            - -c
            - bin/elasticsearch-plugin install --batch analysis-icu || true; exec /bin/tini -- /usr/local/bin/docker-entrypoint.sh eswrapper
          env:
            - name: discovery.type
              value: single-node
            - name: xpack.security.enabled
              value: "true"
            - name: xpack.security.autoconfiguration.enabled
              value: "false"
            - name: xpack.security.http.ssl.enabled
              value: "true"
            - name: xpack.security.http.ssl.certificate
              value: tls/tls.crt
            - name: xpack.security.http.ssl.key
              value: tls/tls.key
            - name: SEARCH_PROBE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elasticsearch-server
                  key: probe-password
            - name: ES_JAVA_OPTS
              value: -Xms1g -Xmx1g
          ports:
            - name: http
              containerPort: 9200
          startupProbe:
            exec: &searchHealthProbe
              command:
                - sh
                - -ec
                - 'curl -fsS --cacert config/tls/ca.crt --user "search-probe:$SEARCH_PROBE_PASSWORD" "https://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=2s" >/dev/null'
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 5
          readinessProbe:
            exec: *searchHealthProbe
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 500m
              memory: 1536Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /usr/share/elasticsearch/data
            - name: security
              mountPath: /usr/share/elasticsearch/config/tls
              readOnly: true
            - name: security
              mountPath: /usr/share/elasticsearch/config/users
              subPath: users
              readOnly: true
            - name: security
              mountPath: /usr/share/elasticsearch/config/users_roles
              subPath: users_roles
              readOnly: true
            - name: roles
              mountPath: /usr/share/elasticsearch/config/roles.yml
              subPath: roles.yml
              readOnly: true
      volumes:
        - name: security
          secret:
            secretName: elasticsearch-server
        - name: roles
          configMap:
            name: elasticsearch-file-roles
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
