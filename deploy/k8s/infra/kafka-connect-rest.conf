server {
    listen 8443 ssl;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /run/connect-tls/tls.crt;
    ssl_certificate_key /run/connect-tls/tls.key;
    ssl_client_certificate /run/connect-tls/client-ca.crt;
    ssl_verify_client on;

    location / {
        proxy_pass http://127.0.0.1:8083;
    }
}
