# Các đích nhạy cảm có allowlist riêng. Quyền allow giữa các NetworkPolicy cộng dồn.
# kubectl port-forward đi qua kubelet nên các endpoint vẫn cần tự xác thực client.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-project-namespaces
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: NotIn
        values: [zookeeper, checkout-redis, kafka-connect, elasticsearch]
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [data, ecommerce, edge, observability]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: checkout-redis-clients
spec:
  podSelector:
    matchLabels:
      app: checkout-redis
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ecommerce
          podSelector:
            matchLabels:
              app.kubernetes.io/name: checkout-service
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: checkout-redis-exporter
      ports:
        - port: 6379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka-connect-registrar
spec:
  podSelector:
    matchLabels:
      app: kafka-connect
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              batch.kubernetes.io/job-name: kafka-connect-init
      ports:
        - port: 8443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: elasticsearch-clients
spec:
  podSelector:
    matchLabels:
      app: elasticsearch
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ecommerce
          podSelector:
            matchLabels:
              app.kubernetes.io/name: search-service
      ports:
        - port: 9200
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: zookeeper-from-kafka
spec:
  podSelector:
    matchLabels:
      app: zookeeper
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: kafka
      ports:
        - port: 2181
