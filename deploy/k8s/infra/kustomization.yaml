# Hạ tầng dùng chung (namespace data, ngoài mesh — docs/mesh/design.md §Namespace và phạm vi).
# Build bằng deploy/k8s/apply.sh: configMapGenerator đọc file ngoài thư mục này (init-db.sh,
# infra/minio) nên cần --load-restrictor LoadRestrictionsNone; như vậy file gốc vẫn là nguồn
# duy nhất, không chép sang đây.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: data

labels:
  - pairs:
      app.kubernetes.io/part-of: ecommerce
    includeSelectors: false

resources:
  - namespace.yaml
  - postgres.yaml
  - redis.yaml
  - checkout-redis.yaml
  - zookeeper.yaml
  - kafka.yaml
  - kafka-connect.yaml
  - elasticsearch.yaml
  - minio.yaml
  - temporal.yaml
  - kafka-topics-init.yaml
  - networkpolicies.yaml

# Không còn Service LoadBalancer cho hạ tầng (mesh ADR-002): LoadBalancer của Docker Desktop mở cổng
# trên mọi interface của máy. Công cụ local dùng deploy/k8s/port-forward-dev.sh (bind 127.0.0.1).

configMapGenerator:
  - name: postgres-init
    files:
      - init-db.sh=../../../init-db.sh
  # Topic, principal và ACL chung với kafka-init của docker-compose (mesh ADR-002, ADR-003).
  - name: kafka-topics
    files:
      - init.sh=../../../infra/kafka/init.sh
      - KafkaInit.java=../../../infra/kafka/KafkaInit.java
      - topics.txt=../../../infra/kafka/topics.txt
      - acls.txt=../../../infra/kafka/acls.txt
  - name: kafka-broker
    files:
      - broker-entrypoint.sh=../../../infra/kafka/broker-entrypoint.sh
  - name: minio-seed
    files:
      - product-media-read.json=../../../infra/minio/policies/product-media-read.json
      - product.svg=../../../infra/minio/product-media/placeholder/product.svg

# Chỉ dùng cho môi trường local; giá trị trùng docker-compose.yml.
secretGenerator:
  - name: postgres-credentials
    literals:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
  - name: minio-credentials
    literals:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
  # Trùng x-redis-password của docker-compose; service nhận giá trị này qua env do generate.py sinh.
  - name: redis-credentials
    literals:
      - REDIS_PASSWORD=local-dev-redis-password
  # Mật khẩu SCRAM của Kafka, trùng x-kafka-passwords của docker-compose (service nhận phần của nó
  # qua env do generate.py sinh). Job kafka-topics-init đọc hết để tạo user; broker chỉ đọc hai
  # super user.
  - name: kafka-credentials
    literals:
      - SCRAM_BROKER_PASSWORD=kafka-broker-local-dev
      - SCRAM_ADMIN_PASSWORD=kafka-admin-local-dev
      - SCRAM_PASSWORD_AUTH_SERVICE=auth-service-local-dev
      - SCRAM_PASSWORD_USER_SERVICE=user-service-local-dev
      - SCRAM_PASSWORD_CART_SERVICE=cart-service-local-dev
      - SCRAM_PASSWORD_NOTIFICATION_SERVICE=notification-service-local-dev
      - SCRAM_PASSWORD_ORDER_SERVICE=order-service-local-dev
      - SCRAM_PASSWORD_PAYMENT_SERVICE=payment-service-local-dev
      - SCRAM_PASSWORD_PRODUCT_SERVICE=product-service-local-dev
      - SCRAM_PASSWORD_PROMOTION_SERVICE=promotion-service-local-dev
      - SCRAM_PASSWORD_REVIEW_SERVICE=review-service-local-dev
      - SCRAM_PASSWORD_SEARCH_SERVICE=search-service-local-dev
      - SCRAM_PASSWORD_KAFKA_CONNECT=kafka-connect-local-dev
      - SCRAM_PASSWORD_DEBEZIUM_PRODUCT=debezium-product-local-dev
      - SCRAM_PASSWORD_DEBEZIUM_PROMOTION=debezium-promotion-local-dev
      - SCRAM_PASSWORD_DEBEZIUM_INVENTORY=debezium-inventory-local-dev
      - SCRAM_PASSWORD_DEBEZIUM_ORDER=debezium-order-local-dev
      - SCRAM_PASSWORD_DEBEZIUM_PAYMENT=debezium-payment-local-dev
      - SCRAM_PASSWORD_DEBEZIUM_REVIEW=debezium-review-local-dev
      - SCRAM_PASSWORD_KAFKA_EXPORTER=kafka-exporter-local-dev
  # Kafka Connect: worker và sáu connector, không có mật khẩu của principal khác.
  - name: kafka-connect-credentials
    literals:
      - SCRAM_PASSWORD_KAFKA_CONNECT=kafka-connect-local-dev
      - SCRAM_PASSWORD_DEBEZIUM_PRODUCT=debezium-product-local-dev
      - SCRAM_PASSWORD_DEBEZIUM_PROMOTION=debezium-promotion-local-dev
      - SCRAM_PASSWORD_DEBEZIUM_INVENTORY=debezium-inventory-local-dev
      - SCRAM_PASSWORD_DEBEZIUM_ORDER=debezium-order-local-dev
      - SCRAM_PASSWORD_DEBEZIUM_PAYMENT=debezium-payment-local-dev
      - SCRAM_PASSWORD_DEBEZIUM_REVIEW=debezium-review-local-dev
