# Headless + publishNotReadyAddresses: broker quảng bá kafka.data.svc.cluster.local, nên tên này
# phải trỏ thẳng tới pod ngay cả trước khi pod Ready (readiness probe tự gọi qua tên đó).
apiVersion: v1
kind: Service
metadata:
  name: kafka
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: kafka
  ports:
    - name: internal
      port: 9092
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      # Image Confluent từ chối chạy khi có KAFKA_PORT (biến service link) và đọc mọi KAFKA_*.
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: wait-zookeeper
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z zookeeper 2181; do echo waiting for zookeeper; sleep 3; done"]
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.5.0
          # Giống docker-compose (mesh ADR-003): entrypoint ghi credential SCRAM của kafka-broker và
          # kafka-admin vào ZooKeeper rồi mới khởi động broker; user và ACL khác do Job
          # kafka-topics-init tạo từ infra/kafka/acls.txt.
          command: ["/bin/bash", "/scripts/broker-entrypoint.sh"]
          env:
            - name: KAFKA_BROKER_ID
              value: "1"
            - name: KAFKA_ZOOKEEPER_CONNECT
              value: zookeeper:2181
            # INTERNAL cho pod trong cluster; HOST cho máy host qua `kubectl port-forward`
            # (deploy/k8s/port-forward-dev.sh, localhost:29092), giống docker-compose. Cả hai là
            # SASL_PLAINTEXT với SCRAM-SHA-512; tên listener không chứa SASL_ vì bước configure của
            # image khi đó đòi file JAAS trong KAFKA_OPTS.
            - name: KAFKA_LISTENERS
              value: INTERNAL://0.0.0.0:9092,HOST://0.0.0.0:29092
            - name: KAFKA_ADVERTISED_LISTENERS
              value: INTERNAL://kafka.data.svc.cluster.local:9092,HOST://localhost:29092
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: INTERNAL:SASL_PLAINTEXT,HOST:SASL_PLAINTEXT
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: INTERNAL
            - name: KAFKA_SASL_ENABLED_MECHANISMS
              value: SCRAM-SHA-512
            - name: KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL
              value: SCRAM-SHA-512
            - name: KAFKA_AUTHORIZER_CLASS_NAME
              value: kafka.security.authorizer.AclAuthorizer
            - name: KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND
              value: "false"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            # Topic do Job kafka-topics-init tạo từ infra/kafka/topics.txt (mesh ADR-002).
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"
            - name: KAFKA_HEAP_OPTS
              value: -Xms512m -Xmx512m
            - name: SCRAM_BROKER_USERNAME
              value: kafka-broker
            - name: SCRAM_BROKER_PASSWORD
              valueFrom:
                secretKeyRef: {name: kafka-credentials, key: SCRAM_BROKER_PASSWORD}
            - name: SCRAM_ADMIN_USERNAME
              value: kafka-admin
            - name: SCRAM_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: kafka-credentials, key: SCRAM_ADMIN_PASSWORD}
          ports:
            - name: internal
              containerPort: 9092
            - name: host
              containerPort: 29092
          # Không dùng kafka-topics: mỗi lần probe khởi động một JVM CLI, mất >10 giây khi node bận
          # (đo 2026-10-21 lúc các service Java cùng khởi động) và tự nó tốn CPU.
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: kafka-broker
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
