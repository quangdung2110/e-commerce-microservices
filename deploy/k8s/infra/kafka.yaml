# Headless + publishNotReadyAddresses: broker quảng bá kafka.data.svc.cluster.local, nên tên này
# phải trỏ thẳng tới pod ngay cả trước khi pod Ready (readiness probe tự gọi qua tên đó).
apiVersion: v1
kind: Service
metadata:
  name: kafka
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: kafka
  ports:
    - name: plaintext
      port: 9092
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      # Image Confluent từ chối chạy khi có KAFKA_PORT (biến service link) và đọc mọi KAFKA_*.
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: wait-zookeeper
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z zookeeper 2181; do echo waiting for zookeeper; sleep 3; done"]
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.5.0
          env:
            - name: KAFKA_BROKER_ID
              value: "1"
            - name: KAFKA_ZOOKEEPER_CONNECT
              value: zookeeper:2181
            # PLAINTEXT cho pod trong cluster (mọi namespace); PLAINTEXT_HOST cho máy host qua
            # LoadBalancer kafka-external (localhost:29092), giống docker-compose.
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://kafka.data.svc.cluster.local:9092,PLAINTEXT_HOST://localhost:29092
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: PLAINTEXT
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
            - name: KAFKA_HEAP_OPTS
              value: -Xms512m -Xmx512m
          ports:
            - name: plaintext
              containerPort: 9092
            - name: plaintext-host
              containerPort: 29092
          # Không dùng kafka-topics: mỗi lần probe khởi động một JVM CLI, mất >10 giây khi node bận
          # (đo 2026-10-21 lúc các service Java cùng khởi động) và tự nó tốn CPU.
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
