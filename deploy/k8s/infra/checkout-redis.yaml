# Redis riêng của Checkout. noeviction là yêu cầu, không phải tinh chỉnh: mất một session
# SUBMITTING do eviction có thể sinh đơn trùng (docs/checkout/data.md).
apiVersion: v1
kind: Service
metadata:
  name: checkout-redis
spec:
  selector:
    app: checkout-redis
  ports:
    - name: redis
      port: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: checkout-redis
spec:
  serviceName: checkout-redis
  replicas: 1
  selector:
    matchLabels:
      app: checkout-redis
  template:
    metadata:
      labels:
        app: checkout-redis
    spec:
      enableServiceLinks: false
      initContainers:
        - name: configure-acl
          image: busybox:1.36
          command:
            - sh
            - -ec
            - |
              sed -e "s/@CHECKOUT@/$checkout/" -e "s/@EXPORTER@/$exporter/" -e "s/@PROBE@/$probe/" \
                /acl-template/checkout-redis.acl >/acl/users.acl
          env:
            - name: checkout
              valueFrom:
                secretKeyRef:
                  name: checkout-redis-server
                  key: checkout-hash
            - name: exporter
              valueFrom:
                secretKeyRef:
                  name: checkout-redis-server
                  key: exporter-hash
            - name: probe
              valueFrom:
                secretKeyRef:
                  name: checkout-redis-server
                  key: probe-hash
          volumeMounts:
            - name: acl-template
              mountPath: /acl-template
              readOnly: true
            - name: acl
              mountPath: /acl
      containers:
        - name: redis
          image: redis:7-alpine
          args:
            - redis-server
            - --maxmemory
            - 256mb
            - --maxmemory-policy
            - noeviction
            - --appendonly
            - "yes"
            - --appendfsync
            - everysec
            - --aclfile
            - /acl/users.acl
            - --port
            - "0"
            - --tls-port
            - "6379"
            - --tls-cert-file
            - /run/checkout-redis/tls.crt
            - --tls-key-file
            - /run/checkout-redis/tls.key
            - --tls-ca-cert-file
            - /run/checkout-redis/ca.crt
            - --tls-auth-clients
            - "no"
          env:
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: checkout-redis-server
                  key: probe-password
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: &redisProbe
                - sh
                - -ec
                - 'test "$(redis-cli --tls --cacert /run/checkout-redis/ca.crt --user probe ping)" = PONG'
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: *redisProbe
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 384Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: checkout-redis-server
              mountPath: /run/checkout-redis
              readOnly: true
            - name: acl
              mountPath: /acl
              readOnly: true
      volumes:
        - name: checkout-redis-server
          secret:
            secretName: checkout-redis-server
        - name: acl-template
          configMap:
            name: checkout-redis-acl
        - name: acl
          emptyDir:
            medium: Memory
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
