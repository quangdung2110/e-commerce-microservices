# Kafka Connect (Debezium) cho các outbox. Connector được đăng ký ở đợt service, không phải ở
# đây: publication của Debezium cần bảng outbox mà Flyway/migration của service tạo ra.
apiVersion: v1
kind: Service
metadata:
  name: kafka-connect
spec:
  selector:
    app: kafka-connect
  ports:
    - name: rest
      port: 8083
      targetPort: rest-tls
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-connect
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kafka-connect
  template:
    metadata:
      labels:
        app: kafka-connect
    spec:
      enableServiceLinks: false
      initContainers:
        - name: wait-kafka
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z kafka 9092; do echo waiting for kafka; sleep 3; done"]
      containers:
        - name: kafka-connect
          image: debezium/connect:3.0.0.Final
          # Giống docker-compose (mesh ADR-003): worker xác thực là kafka-connect; dòng JAAS dựng từ
          # SCRAM_PASSWORD_KAFKA_CONNECT. Mỗi connector produce bằng principal debezium-<service>
          # của nó (producer.override.sasl.jaas.config với ${env:SCRAM_PASSWORD_DEBEZIUM_<SERVICE>}).
          command:
            - /bin/bash
            - -c
            - export CONNECT_SASL_JAAS_CONFIG="org.apache.kafka.common.security.scram.ScramLoginModule required username=\"kafka-connect\" password=\"${SCRAM_PASSWORD_KAFKA_CONNECT}\";"; exec /docker-entrypoint.sh start
          envFrom:
            - secretRef:
                name: kafka-connect-credentials
          env:
            - name: BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: GROUP_ID
              value: product-service-connect-cluster
            - name: CONFIG_STORAGE_TOPIC
              value: product-service-connect-configs
            - name: OFFSET_STORAGE_TOPIC
              value: product-service-connect-offsets
            - name: STATUS_STORAGE_TOPIC
              value: product-service-connect-status
            - name: KEY_CONVERTER
              value: org.apache.kafka.connect.storage.StringConverter
            - name: VALUE_CONVERTER
              value: org.apache.kafka.connect.json.JsonConverter
            - name: KEY_CONVERTER_SCHEMAS_ENABLE
              value: "false"
            - name: VALUE_CONVERTER_SCHEMAS_ENABLE
              value: "false"
            - name: CONNECT_SECURITY_PROTOCOL
              value: SASL_PLAINTEXT
            - name: CONNECT_SASL_MECHANISM
              value: SCRAM-SHA-512
            - name: CONNECT_PRODUCER_BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: CONNECT_PRODUCER_ACKS
              value: all
            - name: CONNECT_PRODUCER_SECURITY_PROTOCOL
              value: SASL_PLAINTEXT
            - name: CONNECT_PRODUCER_SASL_MECHANISM
              value: SCRAM-SHA-512
            # Connector chỉ được override cấu hình SASL (sasl.jaas.config, sasl.mechanism, security.protocol).
            - name: CONNECT_CONNECTOR_CLIENT_CONFIG_OVERRIDE_POLICY
              value: Principal
            - name: CONNECT_CONSUMER_BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: CONNECT_CONFIG_PROVIDERS
              value: env
            - name: CONNECT_CONFIG_PROVIDERS_ENV_CLASS
              value: org.apache.kafka.common.config.provider.EnvVarConfigProvider
            - name: CONNECT_CONFIG_PROVIDERS_ENV_PARAM_ALLOWLIST_PATTERN
              value: ^SCRAM_PASSWORD_DEBEZIUM_[A-Z]+$
            - name: HEAP_OPTS
              value: -Xms256m -Xmx512m
            # Một worker. Chỉ proxy mTLS cùng pod có thể gọi listener gốc.
            - name: CONNECT_LISTENERS
              value: http://127.0.0.1:8083
            - name: ADVERTISED_HOST_NAME
              value: "127.0.0.1"
          readinessProbe:
            exec:
              command: ["curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8083/"]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command: ["curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8083/"]
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
        - name: rest-proxy
          image: nginx:1.28-alpine
          ports:
            - name: rest-tls
              containerPort: 8443
          readinessProbe:
            tcpSocket:
              port: rest-tls
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: rest-proxy
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: rest-server
              mountPath: /run/connect-tls
              readOnly: true
      volumes:
        - name: rest-proxy
          configMap:
            name: kafka-connect-rest-proxy
        - name: rest-server
          secret:
            secretName: kafka-connect-rest-server
